<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UX/UI Exam Trainer</title>
<style>
:root{--p:#1f3a8a;--ok:#1b8a4b;--bad:#c62828;--bg:#f4f6fb;--card:#fff;--mut:#5b6475}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Segoe UI","Sarabun","Thonburi",sans-serif;background:var(--bg);color:#1d2330;line-height:1.5}
header{background:var(--p);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1}header .tm{font-variant-numeric:tabular-nums;background:#ffffff22;padding:3px 8px;border-radius:6px}
main{max-width:860px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px #0002;margin-bottom:12px}
h2{margin:0 0 8px;font-size:18px;color:var(--p)}h3{margin:10px 0 6px;font-size:15px}
label{display:block;margin:4px 0}select,input[type=number]{font-size:15px;padding:4px 6px;border-radius:6px;border:1px solid #c3c9d8}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>div{flex:1;min-width:220px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid #c3c9d8;background:#fff;padding:7px 12px}
button.pri{background:var(--p);color:#fff;border-color:var(--p)}button:disabled{opacity:.45;cursor:default}
.bar{height:8px;background:#e1e6f2;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--p)}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin:6px 0;flex-wrap:wrap;gap:6px}
.q{font-size:16.5px;font-weight:600;margin:6px 0 10px;white-space:pre-line}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 12px;border-radius:10px;border:2px solid #d5dbea;background:#fff}
.tr{font-weight:400;color:#4a5568;font-size:.93em;margin-top:2px}.opt .tr{margin-left:24px}
.opt .L{display:inline-block;width:24px;font-weight:700;color:var(--p)}
.opt.sel{border-color:var(--p);background:#eef2ff}.opt.ok{border-color:var(--ok);background:#e8f6ee}.opt.bad{border-color:var(--bad);background:#fdecec}
.why{font-size:13.5px;color:#333;margin:3px 0 0 24px}
.exp{background:#f7f8fc;border-left:4px solid var(--p);padding:8px 10px;border-radius:6px;margin-top:8px;font-size:14px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.nav .sp{flex:1}
.star.on{background:#fff4c2;border-color:#e0b100}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #e1e6f2;padding:6px;text-align:left}
.cb{height:12px;border-radius:6px;background:#e1e6f2;overflow:hidden;min-width:80px}.cb>i{display:block;height:100%}
.weak{background:#fff3f3}.big{font-size:30px;font-weight:800;color:var(--p)}
.grid{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.grid button{width:36px;padding:4px 0;font-size:12.5px}
.grid .a{background:#dde5ff}.grid .s{outline:2px solid #e0b100}.grid .c{background:#e8f6ee}.grid .x{background:#fdecec}.grid .cur{border:2px solid var(--p)}
.tag{display:inline-block;padding:0 6px;border-radius:5px;background:#eef2fb;color:var(--p);font-size:12px;margin-right:4px}
.hidden{display:none}.small{font-size:13px;color:var(--mut)}
@media(max-width:560px){.q{font-size:15.5px}main{padding:6px}.card{padding:10px}}
.sitenav{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;background:#e9eefb;justify-content:center}.sitenav a{color:#1f3a8a;text-decoration:none;font-size:14px;padding:4px 10px;border-radius:999px;background:#fff;border:1px solid #c9d3ee}
</style></head><body>

<script id="quiz-data" type="application/json">{"chapters": {"2": "Psychology in UX/UI", "3": "Problem Statement, Journey, Persona", "4": "Ethics (Human Subject Protection)", "5": "Usability Test Design", "8": "Wireframe & Prototype", "9": "UX/UI Measurement"}, "sets": {"E": {"name": "Easy", "questions": [{"id": "E2-01", "set": "E", "ch": 2, "q": "Which law says users expect your website to work the same way as other websites they already use?", "q_th": "กฎใดบอกว่าผู้ใช้คาดหวังให้เว็บของเราทำงานแบบเดียวกับเว็บอื่นที่เขาใช้อยู่แล้ว", "options": [{"id": "E2-01-d0", "t": "Hick's Law", "th": "Hick's Law", "w": "Hick's Law เรื่องจำนวนตัวเลือกกับเวลาตัดสินใจ"}, {"id": "E2-01-d1", "t": "Tesler's Law", "th": "Tesler's Law", "w": "Tesler's Law เรื่องความซับซ้อนที่ต้องย้ายไปให้ระบบ"}, {"id": "E2-01-a", "t": "Jakob's Law", "th": "Jakob's Law", "w": "Jakob's Law: ผู้ใช้คุ้นเคยกับเว็บอื่นจึงคาดหวังให้เว็บเราทำงานแบบเดียวกัน"}, {"id": "E2-01-d2", "t": "Miller's Law", "th": "Miller's Law", "w": "Miller's Law เรื่องความจำ 7 ± 2"}], "answer": "E2-01-a", "ref": "Ch2 p61"}, {"id": "E2-02", "set": "E", "ch": 2, "q": "Fitts's Law predicts the time to reach a target based on which two factors?", "q_th": "Fitts's Law ทำนายเวลาที่ใช้ไปถึงเป้าหมายจาก 2 ปัจจัยใด", "options": [{"id": "E2-02-d0", "t": "Color and font", "th": "สีและฟอนต์", "w": "ไม่ใช่ปัจจัยของ Fitts"}, {"id": "E2-02-a", "t": "Size and distance", "th": "ขนาดและระยะทาง", "w": "สไลด์: เวลาขึ้นกับระยะทางไปยังปุ่มและขนาดของปุ่ม"}, {"id": "E2-02-d1", "t": "Number of choices and complexity", "th": "จำนวนตัวเลือกและความซับซ้อน", "w": "นั่นคือ Hick's Law"}, {"id": "E2-02-d2", "t": "Memory and attention", "th": "ความจำและความใส่ใจ", "w": "เป็นกระบวนการทางความคิด ไม่ใช่ Fitts"}], "answer": "E2-02-a", "ref": "Ch2 p52–53"}, {"id": "E2-03", "set": "E", "ch": 2, "q": "The tendency to remember the LAST items in a list best is called:", "q_th": "แนวโน้มที่จะจำรายการ \"สุดท้าย\" ในลิสต์ได้ดีที่สุด เรียกว่า", "options": [{"id": "E2-03-d0", "t": "Primacy Effect", "th": "Primacy Effect", "w": "Primacy Effect คือจำตัวแรกได้ดี"}, {"id": "E2-03-d1", "t": "Isolation Effect", "th": "Isolation Effect", "w": "Isolation Effect คือจำสิ่งที่แปลกแยก"}, {"id": "E2-03-d2", "t": "Banner Blindness", "th": "Banner Blindness", "w": "Banner Blindness คือการเมินสิ่งที่ดูเหมือนโฆษณา"}, {"id": "E2-03-a", "t": "Recency Effect", "th": "Recency Effect", "w": "Recency Effect: จำตัวท้ายได้ดีเพราะยังอยู่ในความจำระยะสั้น"}], "answer": "E2-03-a", "ref": "Ch2 p76"}, {"id": "E2-04", "set": "E", "ch": 2, "q": "\"Sign up in one click, but cancelling is long and only possible on the website\" is known as:", "q_th": "\"สมัครได้ในคลิกเดียว แต่ยกเลิกยุ่งยากและทำได้ผ่านเว็บไซต์เท่านั้น\" เรียกว่าอะไร", "options": [{"id": "E2-04-d0", "t": "Rogue Malware", "th": "Rogue Malware", "w": "Rogue Malware คือหลอกให้ติดตั้งซอฟต์แวร์อันตราย"}, {"id": "E2-04-d1", "t": "Disguised Ad", "th": "Disguised Ad", "w": "คือโฆษณาที่เนียนไปกับเนื้อหา"}, {"id": "E2-04-a", "t": "The Roach Motel", "th": "The Roach Motel", "w": "สไลด์: The Roach Motel อยู่ใต้หัวข้อ SaaS Billing สมัครง่ายยกเลิกยาก"}, {"id": "E2-04-d2", "t": "False Urgency", "th": "False Urgency", "w": "คือการสร้างความเร่งด่วนปลอม"}], "answer": "E2-04-a", "ref": "Ch2 p23"}, {"id": "E2-05", "set": "E", "ch": 2, "q": "A user keeps using an app mainly to collect points, discounts and rewards. This is:", "q_th": "ผู้ใช้ยังใช้แอปต่อเพราะอยากสะสมแต้ม ส่วนลด และรางวัลเป็นหลัก เป็นแรงจูงใจแบบใด", "options": [{"id": "E2-05-a", "t": "Extrinsic motivation", "th": "Extrinsic motivation", "w": "Extrinsic = ใช้งานเพราะต้องการสิ่งตอบแทน เช่น Points, Discounts, Rewards"}, {"id": "E2-05-d0", "t": "Intrinsic motivation", "th": "Intrinsic motivation", "w": "Intrinsic = ใช้เพราะความพึงพอใจ เช่น Fun, Connection, Community"}, {"id": "E2-05-d1", "t": "Selective retention", "th": "Selective retention", "w": "เป็นเรื่องการเลือกจดจำ ไม่ใช่แรงจูงใจ"}, {"id": "E2-05-d2", "t": "Cognitive overload", "th": "Cognitive overload", "w": "คือภาวะข้อมูลมากเกินไป"}], "answer": "E2-05-a", "ref": "Ch2 p25"}, {"id": "E2-06", "set": "E", "ch": 2, "q": "In the course's UX version of Maslow's Hierarchy of Needs, which level is at the TOP?", "q_th": "ใน Maslow's Hierarchy of Needs ฉบับ UX ของคอร์ส ขั้นใดอยู่ \"บนสุด\"", "options": [{"id": "E2-06-d0", "t": "Functional", "th": "Functional", "w": "Functional อยู่ล่างสุด (ระบบต้องทำงานได้)"}, {"id": "E2-06-d1", "t": "Reliability", "th": "Reliability", "w": "Reliability เป็นขั้นที่ 2"}, {"id": "E2-06-d2", "t": "Usability", "th": "Usability", "w": "Usability เป็นขั้นที่ 3"}, {"id": "E2-06-a", "t": "Pleasurable", "th": "Pleasurable", "w": "ลำดับ: Functional → Reliability → Usability → Convenience → Pleasurable (บนสุด)"}], "answer": "E2-06-a", "ref": "Ch2 p26"}, {"id": "E2-07", "set": "E", "ch": 2, "q": "Which of the following is NOT one of the Gestalt laws listed in the course?", "q_th": "ข้อใด \"ไม่ใช่\" กฎ Gestalt ที่ระบุในคอร์ส", "options": [{"id": "E2-07-d0", "t": "Law of Proximity", "th": "Law of Proximity", "w": "อยู่ในรายการ Gestalt"}, {"id": "E2-07-d1", "t": "Law of Similarity", "th": "Law of Similarity", "w": "อยู่ในรายการ Gestalt"}, {"id": "E2-07-d2", "t": "Law of Closure", "th": "Law of Closure", "w": "อยู่ในรายการ Gestalt"}, {"id": "E2-07-a", "t": "Law of Scarcity", "th": "Law of Scarcity", "w": "กฎ Gestalt ในสไลด์: Proximity, Closure, Similarity, Continuation, Prägnanz ไม่มี Scarcity"}], "answer": "E2-07-a", "ref": "Ch2 p37"}, {"id": "E2-08", "set": "E", "ch": 2, "q": "The Invisible Gorilla experiment by Chabris and Simons demonstrates:", "q_th": "การทดลอง Invisible Gorilla ของ Chabris และ Simons พิสูจน์เรื่องใด", "options": [{"id": "E2-08-d0", "t": "Banner Blindness", "th": "Banner Blindness", "w": "Banner Blindness คือเมินสิ่งที่ดูเหมือนโฆษณา (คนละแนวคิด)"}, {"id": "E2-08-d1", "t": "Serial Position Effect", "th": "Serial Position Effect", "w": "เกี่ยวกับการจำลำดับรายการ"}, {"id": "E2-08-a", "t": "Inattentional Blindness", "th": "Inattentional Blindness", "w": "สไลด์: การทดลองพิสูจน์ Inattentional Blindness มองไม่เห็นสิ่งที่คาดไม่ถึงเมื่อจดจ่อสิ่งอื่น"}, {"id": "E2-08-d2", "t": "Hick's Law", "th": "Hick's Law", "w": "เกี่ยวกับเวลาตัดสินใจ"}], "answer": "E2-08-a", "ref": "Ch2 p31"}, {"id": "E2-09", "set": "E", "ch": 2, "q": "In UX, \"affordance\" means:", "q_th": "ในงาน UX คำว่า \"affordance\" หมายถึง", "options": [{"id": "E2-09-a", "t": "A cue suggesting how an object is used", "th": "สิ่งบ่งบอกว่าวัตถุนั้นใช้งานอย่างไร", "w": "Affordance = การแนะถึงหน้าที่/วิธีใช้ของวัตถุ มองแล้วรู้ว่าต้องทำอะไร"}, {"id": "E2-09-d0", "t": "The total cost of building a product", "th": "ต้นทุนรวมในการสร้างผลิตภัณฑ์", "w": "ไม่เกี่ยวกับราคา"}, {"id": "E2-09-d1", "t": "A type of dark pattern", "th": "dark pattern ประเภทหนึ่ง", "w": "affordance ไม่ใช่ dark pattern"}, {"id": "E2-09-d2", "t": "The loading speed of a website", "th": "ความเร็วในการโหลดเว็บไซต์", "w": "ไม่เกี่ยวกับความเร็ว"}], "answer": "E2-09-a", "ref": "Ch2 p39"}, {"id": "E2-10", "set": "E", "ch": 2, "q": "\"Work expands to fill the time available\" is the definition of:", "q_th": "\"งานจะขยายตัวจนเต็มเวลาที่มีอยู่\" เป็นนิยามของกฎใด", "options": [{"id": "E2-10-a", "t": "Parkinson's Law", "th": "Parkinson's Law", "w": "Parkinson's Law: งานจะขยายตัวเพื่อให้เต็มเวลาที่มี"}, {"id": "E2-10-d0", "t": "Jakob's Law", "th": "Jakob's Law", "w": "Jakob's Law เรื่องความคุ้นเคย"}, {"id": "E2-10-d1", "t": "Fitts's Law", "th": "Fitts's Law", "w": "Fitts's Law เรื่องขนาดและระยะ"}, {"id": "E2-10-d2", "t": "Miller's Law", "th": "Miller's Law", "w": "Miller's Law เรื่องความจำ 7 ± 2"}], "answer": "E2-10-a", "ref": "Ch2 p64"}, {"id": "E3-01", "set": "E", "ch": 3, "q": "According to the course, what should NOT be written in a problem statement?", "q_th": "ตามที่คอร์สสอน สิ่งใด \"ไม่ควร\" เขียนลงใน problem statement", "options": [{"id": "E3-01-d0", "t": "The impact of the problem", "th": "ผลกระทบของปัญหา", "w": "Impact เป็นองค์ประกอบที่ต้องมี"}, {"id": "E3-01-d1", "t": "Data and numbers", "th": "ข้อมูลและตัวเลข", "w": "สไลด์แนะนำให้ใช้ข้อมูลและตัวเลข"}, {"id": "E3-01-d2", "t": "The current state", "th": "สถานะปัจจุบัน (current state)", "w": "Current State เป็นองค์ประกอบที่ต้องมี"}, {"id": "E3-01-a", "t": "The solution", "th": "วิธีแก้ปัญหา (solution)", "w": "สไลด์: ห้ามระบุวิธีแก้ปัญหา ให้เน้นที่ปัญหา"}], "answer": "E3-01-a", "ref": "Ch3 p3"}, {"id": "E3-02", "set": "E", "ch": 3, "q": "In the 5W1H technique, the question \"Who faces this problem?\" identifies:", "q_th": "ในเทคนิค 5W1H คำถาม \"ใครเผชิญปัญหานี้?\" ใช้ระบุสิ่งใด", "options": [{"id": "E3-02-d0", "t": "When the problem happens", "th": "ปัญหาเกิดขึ้นเมื่อไร", "w": "นั่นคือ When"}, {"id": "E3-02-d1", "t": "Where in the system it happens", "th": "ปัญหาเกิดที่ส่วนไหนของระบบ", "w": "นั่นคือ Where"}, {"id": "E3-02-d2", "t": "Why the problem matters", "th": "ทำไมปัญหานี้จึงสำคัญ", "w": "นั่นคือ Why"}, {"id": "E3-02-a", "t": "The target users", "th": "กลุ่มผู้ใช้เป้าหมาย", "w": "Who = ใครคือผู้เผชิญปัญหา/กลุ่มเป้าหมาย"}], "answer": "E3-02-a", "ref": "Ch3 p5"}, {"id": "E3-03", "set": "E", "ch": 3, "q": "In Don Norman's Emotional Design, the \"Visceral\" level is about:", "q_th": "ใน Emotional Design ของ Don Norman ระดับ \"Visceral\" เกี่ยวกับเรื่องใด", "options": [{"id": "E3-03-a", "t": "The first impression at first sight", "th": "ความประทับใจแรกเห็น", "w": "Visceral = ความรู้สึกแรกเห็น สวยงาม ดึงดูด น่าเชื่อถือ"}, {"id": "E3-03-d0", "t": "Feelings while using the product", "th": "ความรู้สึกขณะใช้ผลิตภัณฑ์", "w": "นั่นคือ Behavioral"}, {"id": "E3-03-d1", "t": "Pride and loyalty after use", "th": "ความภูมิใจและความภักดีหลังใช้งาน", "w": "นั่นคือ Reflective"}, {"id": "E3-03-d2", "t": "The price of the product", "th": "ราคาของผลิตภัณฑ์", "w": "ไม่ใช่ระดับของ Norman"}], "answer": "E3-03-a", "ref": "Ch3 p29"}, {"id": "E3-04", "set": "E", "ch": 3, "q": "Which is NOT one of the four pain point categories taught in the course?", "q_th": "ข้อใด \"ไม่ใช่\" หนึ่งใน 4 หมวดของ pain point ที่สอนในคอร์ส", "options":  "Ch3 p24"}, {"id": "E3-07", "set": "E", "ch": 3, "q": "Having to type the same information again and again because there is no automation is which pain point?", "q_th": "การต้องพิมพ์ข้อมูลเดิมซ้ำ ๆ เพราะไม่มีระบบอัตโนมัติ เป็น pain point ประเภทใด", "options": [{"id": "E3-07-d0", "t": "Support", "th": "Support", "w": "Support เกี่ยวกับความช่วยเหลือ/ข้อมูลไม่ชัด"}, {"id": "E3-07-a", "t": "Productivity", "th": "Productivity", "w": "Productivity: เสียเวลา ไม่มีระบบอัตโนมัติ ต้องกรอกซ้ำ"}, {"id": "E3-07-d1", "t": "Design", "th": "Design", "w": "Design เกี่ยวกับหน้าตา/การจัดวาง"}, {"id": "E3-07-d2", "t": "Reflective", "th": "Reflective", "w": "เป็นระดับอารมณ์ ไม่ใช่ pain point"}], "answer": "E3-07-a", "ref": "Ch3 p30"}, {"id": "E3-08", "set": "E", "ch": 3, "q": "Adding a small animation, such as a button changing color on hover, is called:", "q_th": "การใส่แอนิเมชันเล็ก ๆ เช่น ปุ่มเปลี่ยนสีเมื่อเอาเมาส์ไปวาง เรียกว่า", "options": [{"id": "E3-08-a", "t": "Micro-interaction", "th": "Micro-interaction", "w": "สไลด์: Micro-interactions ใส่แอนิเมชันขนาดเล็ก เช่น ปุ่มเปลี่ยนสีเมื่อ hover"}, {"id": "E3-08-d0", "t": "Frictionless flow", "th": "Frictionless flow", "w": "คือการย่อขั้นตอนให้กระชับ"}, {"id": "E3-08-d1", "t": "Accessibility", "th": "Accessibility", "w": "คือการออกแบบให้ทุกคนเข้าถึงได้"}, {"id": "E3-08-d2", "t": "Personalization", "th": "Personalization", "w": "คือการปรับให้ตรงกับความสนใจของแต่ละคน"}], "answer": "E3-08-a", "ref": "Ch3 p36"}, {"id": "E3-09", "set": "E", "ch": 3, "q": "The Empathy Map is a tool from which approach?", "q_th": "Empathy Map เป็นเครื่องมือของแนวคิดใด", "options": [{"id": "E3-09-d0", "t": "Statistics", "th": "สถิติ", "w": "ไม่ใช่เครื่องมือสถิติ"}, {"id": "E3-09-d1", "t": "Agile Scrum", "th": "Agile Scrum", "w": "ไม่ได้สอนในคอร์สว่ามาจาก Scrum"}, {"id": "E3-09-d2", "t": "PDPA", "th": "PDPA", "w": "PDPA เป็นกฎหมายข้อมูลส่วนบุคคล"}, {"id": "E3-09-a", "t": "Design Thinking", "th": "Design Thinking", "w": "สไลด์: Empathy Map เป็นเครื่องมือในกลุ่ม Design Thinking"}], "answer": "E3-09-a", "ref": "Ch3 p34"}, {"id": "E3-10", "set": "E", "ch": 3, "q": "What is a main purpose of a user journey?", "q_th": "วัตถุประสงค์หลักของ user journey คืออะไร", "options": [{"id": "E3-10-d0", "t": "To calculate the app's Net Promoter Score", "th": "เพื่อคำนวณ Net Promoter Score ของแอป", "w": "NPS เป็นเรื่องการวัดผล (Ch9)"}, {"id": "E3-10-d1", "t": "To get approval from the ethics committee", "th": "เพื่อขออนุมัติจากคณะกรรมการจริยธรรม", "w": "เป็นเรื่องจริยธรรมวิจัย (Ch4)"}, {"id": "E3-10-d2", "t": "To write the program code", "th": "เพื่อเขียนโค้ดโปรแกรม", "w": "ไม่ใช่วัตถุประสงค์ของ journey"}, {"id": "E3-10-a", "t": "To find pain points that make users quit", "th": "เพื่อหา pain point ที่ทำให้ผู้ใช้เลิกใช้กลางคัน", "w": "สไลด์: ค้นหา pain points ที่ทำให้ผู้ใช้ออกกลางคัน"}], "answer": "E3-10-a", "ref": "Ch3 p10"}, {"id": "E4-01", "set": "E", "ch": 4, "q": "In an Expedited review, the protocol is reviewed by:", "q_th": "ในการพิจารณาแบบ Expedited ใครเป็นผู้พิจารณาโครงร่าง", "options": [{"id": "E4-01-d0", "t": "The full committee in a large meeting", "th": "คณะกรรมการทั้งหมดในที่ประชุมใหญ่", "w": "นั่นคือ Full Board"}, {"id": "E4-01-a", "t": "2–3 members online, no full meeting", "th": "กรรมการ 2–3 ท่านแบบออนไลน์ ไม่ต้องประชุมใหญ่", "w": "สไลด์: ส่งกรรมการ 2–3 ท่านพิจารณาออนไลน์"}, {"id": "E4-01-d1", "t": "The researcher alone", "th": "ผู้วิจัยพิจารณาเองคนเดียว", "w": "นักวิจัยตัดสินเองไม่ได้"}, {"id": "E4-01-d2", "t": "Nobody, it is approved automatically", "th": "ไม่มีใคร อนุมัติอัตโนมัติ", "w": "ไม่มีการอนุมัติอัตโนมัติ"}], "answer": "E4-01-a", "ref": "Ch4 p14"}, {"id": "E4-02", "set": "E", "ch": 4, "q": "Which of the following is a vulnerable group in research?", "q_th": "ข้อใดเป็นกลุ่มเปราะบางในงานวิจัย", "options": [{"id": "E4-02-a", "t": "Prisoners", "th": "นักโทษ", "w": "นักโทษเป็นกลุ่มเปราะบาง (45 CFR 46 Subpart C)"}, {"id": "E4-02-d0", "t": "Healthy adult volunteers", "th": "อาสาสมัครผู้ใหญ่ที่สุขภาพดี", "w": "มีความสามารถและอิสระในการตัดสินใจ"}, {"id": "E4-02-d1", "t": "Professional designers", "th": "ดีไซเนอร์มืออาชีพ", "w": "ไม่ใช่กลุ่มเปราะบางตามสไลด์"}, {"id": "E4-02-d2", "t": "University staff with no link to the researcher", "th": "บุคลากรมหาวิทยาลัยที่ไม่มีความเกี่ยวข้องกับผู้วิจัย", "w": "ไม่มีความสัมพันธ์เชิงอำนาจ จึงไม่เข้าข่าย"}], "answer": "E4-02-a", "ref": "Ch4 p11, p28"}, {"id": "E4-03", "set": "E", "ch": 4, "q": "Under 45 CFR 46, Subpart D gives additional protection for:", "q_th": "ตาม 45 CFR 46 Subpart D ให้ความคุ้มครองเพิ่มเติมแก่กลุ่มใด", "options": [{"id": "E4-03-d0", "t": "Prisoners", "th": "นักโทษ", "w": "นั่นคือ Subpart C"}, {"id": "E4-03-d1", "t": "Pregnant women and fetuses", "th": "หญิงตั้งครรภ์และทารกในครรภ์", "w": "นั่นคือ Subpart B"}, {"id": "E4-03-a", "t": "Children", "th": "เด็ก", "w": "Subpart D = กลุ่มเด็ก"}, {"id": "E4-03-d2", "t": "General rules for all subjects", "th": "กฎทั่วไปสำหรับอาสาสมัครทุกคน", "w": "นั่นคือ Subpart A"}], "answer": "E4-03-a", "ref": "Ch4 p28"}, {"id": "E4-04", "set": "E", "ch": 4, "q": "Under PDPA, the maximum CRIMINAL penalty is:", "q_th": "ตาม PDPA โทษทาง \"อาญา\" สูงสุดคือ", "options": [{"id": "E4-04-d0", "t": "A fine up to 5 million baht", "th": "ปรับไม่เกิน 5 ล้านบาท", "w": "นั่นคือโทษทางปกครอง"}, {"id": "E4-04-d1", "t": "Compensation up to 2 times the actual damages", "th": "ชดใช้ค่าเสียหายเพิ่มได้ไม่เกิน 2 เท่าของความเสียหายจริง", "w": "นั่นคือโทษทางแพ่ง"}, {"id": "E4-04-d2", "t": "A warning letter only", "th": "ตักเตือนเป็นหนังสือเท่านั้น", "w": "ไม่ตรงกับสไลด์"}, {"id": "E4-04-a", "t": "Prison up to 1 year or fine up to 1M baht", "th": "จำคุกไม่เกิน 1 ปี หรือปรับไม่เกิน 1 ล้านบาท", "w": "สไลด์: ทางอาญา จำคุกสูงสุด 1 ปี หรือปรับสูงสุด 1 ล้านบาท"}], "answer": "E4-04-a", "ref": "Ch4 p88"}, {"id": "E4-05", "set": "E", "ch": 4, "q": "Under PDPA, the organization that decides what personal data is processed, why and how is the:", "q_th": "ตาม PDPA องค์กรที่ตัดสินใจว่าจะประมวลผลข้อมูลส่วนบุคคลอะไร เพื่ออะไร และอย่างไร เรียกว่า", "options": [{"id": "E4-05-d0", "t": "Data Subject", "th": "Data Subject", "w": "Data Subject คือเจ้าของข้อมูล"}, {"id": "E4-05-a", "t": "Data Controller", "th": "Data Controller", "w": "Data Controller: ผู้ตัดสินใจเรื่องการประมวลผลข้อมูล และรับผิดชอบหลักตาม PDPA"}, {"id": "E4-05-d1", "t": "Ethics Committee", "th": "Ethics Committee", "w": "เป็นคณะกรรมการจริยธรรมวิจัย ไม่ใช่องค์ประกอบ PDPA"}, {"id": "E4-05-d2", "t": "Legally Authorized Representative", "th": "Legally Authorized Representative", "w": "เป็นผู้แทนโดยชอบธรรมในการให้ความยินยอม"}], "answer": "E4-05-a", "ref": "Ch4 p87"}, {"id": "E4-06", "set": "E", "ch": 4, "q": "The Belmont principle that aims to maximize benefits and minimize harm is:", "q_th": "หลัก Belmont ที่มุ่งสร้างประโยชน์สูงสุดและลดอันตรายให้น้อยที่สุดคือ", "options": [{"id": "E4-06-d0", "t": "Justice", "th": "Justice", "w": "Justice เน้นความเท่าเทียมในการคัดเลือก"}, {"id": "E4-06-a", "t": "Beneficence", "th": "Beneficence", "w": "Beneficence: สร้างประโยชน์สูงสุด ลดความเสี่ยงให้น้อยที่สุด"}, {"id": "E4-06-d1", "t": "Respect for Persons", "th": "Respect for Persons", "w": "เน้นสิทธิการตัดสินใจและความยินยอม"}, {"id": "E4-06-d2", "t": "Confidentiality", "th": "Confidentiality", "w": "เป็นการรักษาความลับ ไม่ใช่หลักใน Belmont 3 ข้อ"}], "answer": "E4-06-a", "ref": "Ch4 p58"}, {"id": "E4-07", "set": "E", "ch": 4, "q": "\"Waive consent\" can be used only when:", "q_th": "\"Waive consent\" ใช้ได้เฉพาะเมื่อ", "options": [{"id": "E4-07-d0", "t": "The researcher decides it is easier", "th": "ผู้วิจัยตัดสินว่าทำแบบนี้สะดวกกว่า", "w": "ไม่ใช่การทำโดยพละการ"}, {"id": "E4-07-d1", "t": "The participants are children", "th": "ผู้เข้าร่วมเป็นเด็ก", "w": "เด็กยังต้องขอความยินยอมจากผู้ปกครอง"}, {"id": "E4-07-a", "t": "The ethics committee approves it", "th": "คณะกรรมการจริยธรรมอนุมัติ", "w": "สไลด์: ต้องผ่านการพิจารณาและอนุมัติจากคณะกรรมการจริยธรรมก่อนเสมอ"}, {"id": "E4-07-d2", "t": "The study is a clinical drug trial", "th": "เป็นการทดลองยาทางคลินิก", "w": "การทดลองยาเป็นความเสี่ยงสูง ต้องขอความยินยอม"}], "answer": "E4-07-a", "ref": "Ch4 p103"}, {"id": "E4-08", "set": "E", "ch": 4, "q": "Which of the following is considered NON-private information?", "q_th": "ข้อใดถือเป็นข้อมูลที่ \"ไม่ใช่\" ข้อมูลส่วนบุคคล (non-private)", "options": [{"id": "E4-08-d0", "t": "National ID number", "th": "เลขบัตรประชาชน", "w": "ระบุตัวบุคคลได้ จึงเป็นข้อมูลส่วนบุคคล"}, {"id": "E4-08-a", "t": "A deceased person's data", "th": "ข้อมูลของผู้เสียชีวิต", "w": "สไลด์: ข้อมูลผู้เสียชีวิตเป็น Non-Private Info"}, {"id": "E4-08-d1", "t": "Fingerprint data", "th": "ข้อมูลลายนิ้วมือ", "w": "ข้อมูลชีวมิติ (Biometric) เป็นข้อมูลส่วนบุคคล"}, {"id": "E4-08-d2", "t": "Home address", "th": "ที่อยู่บ้าน", "w": "ข้อมูลที่อยู่ระบุตัวบุคคลได้"}], "answer": "E4-08-a", "ref": "Ch4 p79"}, {"id": "E4-09", "set": "E", "ch": 4, "q": "Explaining the purpose, risks and benefits of a study in simple language before participants decide is called:", "q_th": "การอธิบายวัตถุประสงค์ ความเสี่ยง และประโยชน์ของงานวิจัยด้วยภาษาง่าย ๆ ก่อนผู้เข้าร่วมตัดสินใจ เรียกว่า", "options": [{"id": "E4-09-d0", "t": "Data Controller", "th": "Data Controller", "w": "เป็นผู้ควบคุมข้อมูลตาม PDPA"}, {"id": "E4-09-d1", "t": "Full Board review", "th": "Full Board review", "w": "เป็นประเภทการพิจารณาโครงการ"}, {"id": "E4-09-a", "t": "Informed Consent", "th": "Informed Consent", "w": "การให้ข้อมูลเพื่อขอความยินยอม (Informed Consent)"}, {"id": "E4-09-d2", "t": "Breach of confidentiality", "th": "Breach of confidentiality", "w": "คือการเปิดเผยข้อมูลโดยไม่ได้รับอนุญาต"}], "answer": "E4-09-a", "ref": "Ch4 p52"}, {"id": "E4-10", "set": "E", "ch": 4, "q": "The researcher's human-subject ethics training certificate must NOT expire within the next:", "q_th": "ใบประกาศอบรมจริยธรรมการวิจัยในมนุษย์ของผู้วิจัยต้อง \"ไม่หมดอายุ\" ภายในระยะเวลาเท่าใดข้างหน้า", "options": [{"id": "E4-10-d0", "t": "1 week", "th": "1 สัปดาห์", "w": "ไม่ตรงกับสไลด์"}, {"id": "E4-10-d1", "t": "3 years", "th": "3 ปี", "w": "ไม่ตรงกับส {"id": "E9-09-d0", "t": "Exactly one group", "th": "1 กลุ่มเท่านั้น", "w": "ใช้ one-sample t-test"}, {"id": "E9-09-d1", "t": "Exactly two groups only", "th": "2 กลุ่มเท่านั้น", "w": "ใช้ t-test"}, {"id": "E9-09-d2", "t": "Two categorical variables' frequencies", "th": "ความถี่ของตัวแปรเชิงกลุ่ม 2 ตัว", "w": "ใช้ Chi-square"}, {"id": "E9-09-a", "t": "Three or more groups", "th": "ตั้งแต่ 3 กลุ่มขึ้นไป", "w": "สไลด์: ANOVA เปรียบเทียบค่าเฉลี่ยตั้งแต่ 3 กลุ่มขึ้นไป"}], "answer": "E9-09-a", "ref": "Ch9 p32"}, {"id": "E9-10", "set": "E", "ch": 9, "q": "Logistic regression produces an output that is:", "q_th": "Logistic regression ให้ผลลัพธ์แบบใด", "options": [{"id": "E9-10-d0", "t": "Any continuous number such as weight", "th": "ตัวเลขต่อเนื่องใด ๆ เช่น น้ำหนัก", "w": "นั่นคือ linear regression"}, {"id": "E9-10-a", "t": "A value from 0 to 1 to classify yes/no", "th": "ค่าระหว่าง 0 ถึง 1 เพื่อจำแนก ใช่/ไม่ใช่", "w": "Logistic: ค่าระหว่าง 0–1 จำแนกคำตอบ เช่น ใช่/ไม่ใช่ ซื้อ/ไม่ซื้อ"}, {"id": "E9-10-d1", "t": "Always a negative value", "th": "ค่าติดลบเสมอ", "w": "ไม่ถูกต้อง"}, {"id": "E9-10-d2", "t": "A ranking from 1 to 10", "th": "อันดับตั้งแต่ 1 ถึง 10", "w": "ไม่ใช่ผลของ logistic regression"}], "answer": "E9-10-a", "ref": "Ch9 p63"}]}, "S": {"name": "Standard", "questions": [{"id": "S2-01", "set": "S", "ch": 2, "q": "According to the course, what is the correct order of the three stages of perception?", "q_th": "ตามที่สอนในคอร์ส ลำดับที่ถูกต้องของ 3 ขั้นตอนของการรับรู้ (Perception) คือข้อใด", "options": [{"id": "S2-01-a", "t": "Selection → Organization → Interpretation", "th": "Selection → Organization → Interpretation", "w": "สไลด์ระบุ 3 ขั้นเรียงตามนี้: สมองเลือกสิ่งเร้า → จัดกลุ่ม → ตีความด้วยประสบการณ์เดิม"}, {"id": "S2-01-d0", "t": "Organization → Selection → Interpretation", "th": "Organization → Selection → Interpretation", "w": "ต้องเลือก (Selection) ก่อนจึงจะจัดระเบียบได้"}, {"id": "S2-01-d1", "t": "Selection → Interpretation → Organization", "th": "Selection → Interpretation → Organization", "w": "Interpretation เป็นขั้นสุดท้าย ไม่ใช่ขั้นกลาง"}, {"id": "S2-01-d2", "t": "Input → Process → Output", "th": "Input → Process → Output", "w": "นี่คือโมเดล information processing ของ Cognitive Psychology ไม่ใช่ขั้นของ Perception"}], "answer": "S2-01-a", "ref": "Ch2 p5"}, {"id": "S2-02", "set": "S", "ch": 2, "q": "An e-commerce site shows thousands of products on its home page and users struggle to choose. Grouping products into categories (Fashion > Women > T-shirts) applies which law?", "q_th": "เว็บ E-commerce แสดงสินค้าหลายพันชิ้นบนหน้าแรกจนผู้ใช้เลือกไม่ถูก การจัดสินค้าเป็นหมวดหมู่ (แฟชั่น > ผู้หญิง > เสื้อยืด) เป็นการใช้กฎใด", "options": [{"id": "S2-02-a", "t": "Hick's Law", "th": "Hick's Law", "w": "Hick's Law: เวลาตัดสินใจเพิ่มตามจำนวน/ความซับซ้อนของตัวเลือก → แก้ด้วย Categorization (ตัวอย่างตรงจากสไลด์)"}, {"id": "S2-02-d0", "t": "Fitts's Law", "th": "Fitts's Law", "w": "Fitts เกี่ยวกับขนาดและระยะของเป้าหมาย ไม่ใช่จำนวนตัวเลือก"}, {"id": "S2-02-d1", "t": "Tesler's Law", "th": "Tesler's Law", "w": "Tesler เรื่องย้ายความซับซ้อนไปให้ระบบ ไม่ใช่ลดตัวเลือก"}, {"id": "S2-02-d2", "t": "Jakob's Law", "th": "Jakob's Law", "w": "Jakob เรื่องความคุ้นเคยกับเว็บอื่น ไม่ใช่จำนวนตัวเลือก"}], "answer": "S2-02-a", "ref": "Ch2 p47–49"}, {"id": "S2-03", "set": "S", "ch": 2, "q": "Following Fitts's Law, how should a \"Delete account\" button be designed?", "q_th": "ตาม Fitts's Law ปุ่ม \"ลบบัญชี\" (Delete account) ควรออกแบบอย่างไร", "options": [{"id": "S2-03-a", "t": "Small and far from the primary buttons", "th": "เล็ก และอยู่ห่างจากปุ่มหลัก", "w": "สไลด์: ปุ่มลบ/ยกเลิกควรเล็กและอยู่ห่างปุ่มหลัก ป้องกันการกดพลาด"}, {"id": "S2-03-d0", "t": "Large and placed at the screen corner so it is easy to reach", "th": "ใหญ่ และวางไว้มุมจอเพื่อให้กดง่าย", "w": "มุมจอ+ใหญ่ ใช้กับปุ่มที่อยากให้กดบ่อย (CTA) ไม่ใช่ปุ่มอันตราย"}, {"id": "S2-03-d1", "t": "Placed in the middle of the menu so it is remembered least", "th": "วางไว้กลางเมนูเพื่อให้ถูกจำน้อยที่สุด", "w": "นี่ปนกับ Serial Position Effect ไม่ใช่หลัก Fitts"}, {"id": "S2-03-d2", "t": "Bright red and the same size as the CTA so users notice it", "th": "สีแดงสดและขนาดเท่า CTA เพื่อให้ผู้ใช้สังเกตเห็น", "w": "ทำให้เด่นเท่า CTA เพิ่มโอกาสกดพลาด ขัดกับสไลด์"}], "answer": "S2-03-a", "ref": "Ch2 p53"}, {"id": "S2-04", "set": "S", "ch": 2, "q": "Miller's Law states that short-term memory can hold about how many items at once?", "q_th": "Miller's Law ระบุว่าความจำระยะสั้นจุข้อมูลได้ประมาณกี่ชิ้นพร้อมกัน", "options": [{"id": "S2-04-d0", "t": "3 ± 1 items", "th": "3 ± 1 ชิ้น", "w": "ไม่ใช่ตัวเลขที่สอนในคอร์ส"}, {"id": "S2-04-d1", "t": "10 ± 3 items", "th": "10 ± 3 ชิ้น", "w": "มากเกินกว่าที่ Miller ระบุ"}, {"id": "S2-04-a", "t": "7 ± 2 items (5 to 9)", "th": "7 ± 2 ชิ้น (5 ถึง 9)", "w": "สไลด์: ความจำระยะสั้นจุได้ประมาณ 7 ± 2 ชิ้น"}, {"id": "S2-04-d2", "t": "Unlimited, if the items are chunked", "th": "ไม่จำกัด ถ้าแบ่งข้อมูลเป็นกลุ่ม (chunk)", "w": "Chunking ช่วยให้จำง่ายขึ้น แต่ความจุยังจำกัดอยู่"}], "answer": "S2-04-a", "ref": "Ch2 p57"}, {"id": "S2-05", "set": "S", "ch": 2, "q": "A ride-hailing app hides route calculation and pricing so users only enter pickup and drop-off points. Which law does this illustrate?", "q_th": "แอปเรียกรถซ่อนการคำนวณเส้นทางและราคาไว้ ผู้ใช้กรอกแค่จุดรับและจุดส่ง เป็นตัวอย่างของกฎใด", "options": [{"id": "S2-05-d0", "t": "Parkinson's Law", "th": "Parkinson's Law", "w": "Parkinson พูดถึงเวลา/จำนวนขั้นตอน ไม่ใช่การย้ายความซับซ้อน"}, {"id": "S2-05-d1", "t": "Miller's Law", "th": "Miller's Law", "w": "Miller เรื่องความจุความจำ 7±2"}, {"id": "S2-05-a", "t": "Tesler's Law", "th": "Tesler's Law", "w": "Tesler: ความซับซ้อนมีอยู่เสมอ ทางเลือกคือให้ระบบรับภาระแทนผู้ใช้ (ตัวอย่าง Uber ในสไลด์)"}, {"id": "S2-05-d2", "t": "Fitts's Law", "th": "Fitts's Law", "w": "Fitts เรื่องขนาด/ระยะของปุ่ม"}], "answer": "S2-05-a", "ref": "Ch2 p67–68"}, {"id": "S2-06", "set": "S", "ch": 2, "q": "A pop-up's decline button reads \"No thanks, I don't like saving money.\" Which dark pattern is this?", "q_th": "ปุ่มปฏิเสธในป๊อปอัปเขียนว่า \"ไม่ล่ะ ฉันไม่ชอบประหยัดเงิน\" เป็น dark pattern แบบใด", "options": [{"id": "S2-06-d0", "t": "Nagging", "th": "Nagging", "w": "Nagging คือรบกวนซ้ำ ๆ จนยอม ไม่ใช่ถ้อยคำทำให้รู้สึกผิด"}, {"id": "S2-06-d1", "t": "Trick Question", "th": "Trick Question", "w": "Trick Question คือคำถามกำกวมสับขาหลอก"}, {"id": "S2-06-d2", "t": "False Urgency", "th": "False Urgency", "w": "False Urgency คือสร้างความเร่งด่วน เช่น countdown"}, {"id": "S2-06-a", "t": "Confirm Shaming", "th": "Confirm Shaming", "w": "ใช้ถ้อยคำทำให้ผู้ใช้รู้สึกผิด/อายเมื่อปฏิเสธ = Confirm Shaming"}], "answer": "S2-06-a", "ref": "Ch2 p14"}, {"id": "S2-07", "set": "S", "ch": 2, "q": "A flight site shows a fare of 2,500 THB, then adds seat-selection, baggage and card fees one by one on the payment page. Which dark pattern is this?", "q_th": "เว็บจองตั๋วเครื่องบินแสดงราคา 2,500 บาท แล้วค่อย ๆ บวกค่าเลือกที่นั่ง ค่าสัมภาระ และค่าธรรมเนียมบัตรทีละรายการในหน้าชำระเงิน เป็น dark pattern แบบใด", "options": [{"id": "S2-07-d0", "t": "Basket Sneaking", "th": "Basket Sneaking", "w": "Basket Sneaking คือแอบใส่สินค้า/บริการเสริมลงตะกร้า เช่น ติ๊กประกันไว้ให้"}, {"id": "S2-07-d1", "t": "Bait & Switch", "th": "Bait & Switch", "w": "Bait & Switch คือโฆษณาข้อเสนอหนึ่งแต่ให้อีกอย่าง เช่น ลด 90% แต่ของหมด"}, {"id": "S2-07-a", "t": "Drip Pricing", "th": "Drip Pricing", "w": "แสดงราคาเริ่มต้นถูก แล้วค่อย ๆ บวกค่าธรรมเนียมตอน check-out = Drip Pricing (ตัวอย่างตรงจากสไลด์)"}, {"id": "S2-07-d2", "t": "Subscription Trap", "th": "Subscription Trap", "w": "Subscription Trap คือหลอกให้ผูกสมัครรายเดือน"}], "answer": "S2-07-a", "ref": "Ch2 p13, p19"}, {"id": "S2-08", "set": "S", "ch": 2, "q": "A confusing, cluttered website layout that makes learning harder creates which type of cognitive load?", "q_th": "เลย์เอาต์เว็บที่สับสนและรกจนทำให้เรียนรู้ยากขึ้น ก่อให้เกิด cognitive load ประเภทใด", "options": [{"id": "S2-08-a", "t": "Extraneous load", "th": "Extraneous load", "w": "Extraneous = ภาระส่วนเกินจากการนำเสนอไม่ดี เช่น หน้าเว็บสับสน (ตัวอย่างจากสไลด์)"}, {"id": "S2-08-d0", "t": "Intrinsic load", "th": "Intrinsic load", "w": "Intrinsic คือความยากโดยธรรมชาติของงาน เช่น coding"}, {"id": "S2-08-d1", "t": "Germane load", "th": "Germane load", "w": "Germane คือภาระที่มีประโยชน์ในการเชื่อมความรู้เดิมกับใหม่"}, {"id": "S2-08-d2", "t": "Selective load", "th": "Selective load", "w": "ไม่มีประเภทนี้ในคอร์ส"}], "answer": "S2-08-a", "ref": "Ch2 p41"}, {"id": "S2-09", "set": "S", "ch": 2, "q": "In the Serial Position Effect, the Primacy Effect is explained by information being stored in:", "q_th": "ใน Serial Position Effect ปรากฏการณ์ Primacy Effect อธิบายว่าข้อมูลถูกเก็บไว้ที่ใด", "options": [{"id": "S2-09-d0", "t": "Short-term memory", "th": "ความจำระยะสั้น (Short-term memory)", "w": "Short-term memory อธิบาย Recency Effect (ตัวท้าย)"}, {"id": "S2-09-a", "t": "Long-term memory", "th": "ความจำระยะยาว (Long-term memory)", "w": "Primacy: ข้อมูลแรก ๆ มีเวลาให้สมองนำไปเก็บในความจำระยะยาว"}, {"id": "S2-09-d1", "t": "Sensory memory", "th": "ความจำจากประสาทสัมผัส (Sensory memory)", "w": "คอร์สไม่ได้อธิบายด้วย sensory memory"}, {"id": "S2-09-d2", "t": "Working memory overload", "th": "Working memory ที่ล้นเกิน (overload)", "w": "ไม่ใช่คำอธิบายในสไลด์ และ overload ทำให้จำได้น้อยลง"}], "answer": "S2-09-a", "ref": "Ch2 p76"}, {"id": "S2-10", "set": "S", "ch": 2, "q": "Which mental model acts as the \"bridge\" that translates a complex system into a UI matching how users think?", "q_th": "Mental model ใดทำหน้าที่เป็น \"สะพาน\" แปลงระบบที่ซับซ้อนให้เป็น UI ที่ตรงกับวิธีคิดของผู้ใช้", "options": [{"id": "S2-10-a", "t": "Designer's Conceptual Model", "th": "Designer's Conceptual Model", "w": "สไลด์: Designer's Conceptual Model คือสะพานเชื่อม แปลงระบบซับซ้อนให้เป็น UI ที่ตรงกับความคิดผู้ใช้"}, {"id": "S2-10-d0", "t": "User Mental Model", "th": "User Mental Model", "w": "คือสิ่งที่ผู้ใช้คาดหวัง ไม่ใช่สะพานที่ดีไซเนอร์สร้าง"}, {"id": "S2-10-d1", "t": "System/Implementation Model", "th": "System/Implementation Model", "w": "คือวิธีที่ระบบทำงานจริงตาม code/database"}, {"id": "S2-10-d2", "t": "Decision Matrix", "th": "Decision Matrix", "w": "เป็นเครื่องมือให้น้ำหนักตัดสินใจ ไม่ใช่ mental model"}], "answer": "S2-10-a", "ref": "Ch2 p71"}, {"id": "S3-01", "set": "S", "ch": 3, "q": "Which of the following is the BEST problem statement according to the course guideline?", "q_th": "ข้อใดเป็น problem statement ที่ดีที่สุดตามแนวทางของคอร์ส", "options": [{"id": "S3-01-d0", "t": "We need to add a search button to the app", "th": "เราต้องเพิ่มปุ่มค้นหาในแอป", "w": "เป็นวิธีแก้ (solution) ซึ่งสไลด์ห้ามใส่ลงใน problem statement"}, {"id": "S3-01-a", "t": "Customers cannot find product information, so 30% leave the app", "th": "ลูกค้าหาข้อมูลสินค้าไม่เจอ ทำให้ 30% ออกจากแอป", "w": "บอกปัญหา + ตัวเลข/ผลกระทบ และไม่ใส่วิธีแก้ ตรงตามหลักการ"}, {"id": "S3-01-d1", "t": "The app should be redesigned using a new color theme", "th": "แอปควรออกแบบใหม่ด้วยธีมสีใหม่", "w": "เป็นทางออก ไม่ใช่ปัญหา และไม่มีหลักฐาน"}, {"id": "S3-01-d2", "t": "Users probably feel something is wrong with the app", "th": "ผู้ใช้น่าจะรู้สึกว่าแอปมีอะไรผิดปกติ", "w": "คลุมเครือ ไม่มีข้อมูล/ตัวเลขยืนยัน"}], "answer": "S3-01-a", "ref": "Ch3 p3"}, {"id": "S3-02", "set": "S", "ch": 3, "q": "The three main components of a problem statement are:", "q_th": "องค์ประกอบหลัก 3 อย่างของ problem statement คือ", "options": [{"id": "S3-02-d0", "t": "Persona, Process, Action", "th": "Persona, Process, Action", "w": "เป็นส่วนของ User Journey Map"}, {"id": "S3-02-d1", "t": "Think, Say, Does", "th": "Think, Say, Does", "w": "เป็นส่วนของ Empathy Map"}, {"id": "S3-02-a", "t": "Current State, Desired State, Impact", "th": "Current State, Desired State, Impact", "w": "สไลด์ระบุองค์ประกอบหลัก 3 อย่างนี้"}, {"id": "S3-02-d2", "t": "Goals, Signals, Metrics", "th": "Goals, Signals, Metrics", "w": "เป็น GSM ของ HEART (Ch9)"}], "answer": "S3-02-a", "ref": "Ch3 p3"}, {"id": "S3-03", "set": "S", "ch": 3, "q": "What is the correct sequence of a User Journey Map in this course?", "q_th": "ลำดับที่ถูกต้องของ User Journey Map ในคอร์สนี้คือ", "options": [{"id": "S3-03-d0", "t": "Process → Persona → Emotion → Action → Impact", "th": "Process → Persona → Emotion → Action → Impact", "w": "ต้องเริ่มที่ Persona ก่อน"}, {"id": "S3-03-d1", "t": "Persona → Action → Process → Idea → Emotion", "th": "Persona → Action → Process → Idea → Emotion", "w": "Process มาก่อน Action และ Idea/Impact อยู่ท้ายสุด"}, {"id": "S3-03-d2", "t": "Data Gathering → Analysis & Synthesis → Persona Creation", "th": "Data Gathering → Analysis & Synthesis → Persona Creation", "w": "นี่คือ Persona Process ไม่ใช่ Journey Map"}, {"id": "S3-03-a", "t": "Persona → Process → Action → Emotion/Pain points → Idea/Impact", "th": "Persona → Process → Action → Emotion/Pain points → Idea/Impact", "w": "ลำดับตรงตามแผนภาพสไลด์"}], "answer": "S3-03-a", "ref": "Ch3 p11"}, {"id": "S3-04", "set": "S", "ch": 3, "q": "A user persona is best described as:", "q_th": "ข้อใดอธิบาย user persona ได้ดีที่สุด", "options": [{"id": "S3-04-d0", "t": "A real customer selected to represent all users", "th": "ลูกค้าจริงหนึ่งคนที่ถูกเลือกมาเป็นตัวแทนผู้ใช้ทั้งหมด", "w": "persona ไม่ใช่ลูกค้าจริงคนหนึ่ง"}, {"id": "S3-04-d1", "t": "An imaginary user invented from the designer's assumptions", "th": "ผู้ใช้ในจินตนาการที่ดีไซเนอร์คิดขึ้นเองจากสมมติฐาน", "w": "ต้องอ้างอิงข้อมูลจริง ไม่ใช่สมมติจากความคิดดีไซเนอร์"}, {"id": "S3-04-d2", "t": "A list of all features the product must have", "th": "รายการฟีเจอร์ทั้งหมดที่ผลิตภัณฑ์ต้องมี", "w": "นั่นคือ requirement/feature list"}, {"id": "S3-04-a", "t": "A fictional person created based on real user data", "th": "บุคคลสมมุติที่สร้างขึ้นจากข้อมูลผู้ใช้จริง", "w": "สไลด์: บุคคลสมมุติที่อ้างอิงจากข้อมูลจริง"}], "answer": "S3-04-a", "ref": "Ch3 p14"}, {"id": "S3-05", "set": "S", "ch": 3, "q": "A user feels proud and loyal to a brand after using its app. According to Don Norman's Emotional Design, this is which level?", "q_th": "ผู้ใช้รู้สึกภูมิใจและภักดีต่อแบรนด์หลังใช้แอป ตาม Emotional Design ของ Don Norman เป็นระดับใด", "options": [{"id": "S3-05-d0", "t": "Visceral", "th": "Visceral", "w": "Visceral = ความรู้สึกแรกเห็น สวย น่าเชื่อถือ"}, {"id": "S3-05-d1", "t": "Behavioral", "th": "Behavioral", "w": "Behavioral = ความรู้สึกขณะใช้งาน ใช้ง่าย เร็ว"}, {"id": "S3-05-a", "t": "Reflective", "th": "Reflective", "w": "Reflective = ความรู้สึกหลังใช้งาน ภูมิใจ ภักดีต่อแบรนด์"}, {"id": "S3-05-d2", "t": "Emotional Impact", "th": "Emotional Impact", "w": "เป็นส่วนหนึ่งของ problem statement ไม่ใช่ระดับของ Norman"}], "answer": "S3-05-a", "ref": "Ch3 p29"}, {"id": "S3-06", "set": "S", "ch": 3, "q": "An error page only says \"An error occurred\" with no guidance and there is no clear customer support channel. Which type of pain point is this?", "q_th": "หน้า error เขียนแค่ว่า \"เกิดข้อผิดพลาด\" โดยไม่บอกวิธีแก้ และไม่มีช่องทางติดต่อฝ่ายบริการลูกค้าที่ชัดเจน เป็น pain point ประเภทใด", "options": [{"id": "S3-06-d0", "t": "Productivity pain point", "th": "Productivity pain point", "w": "Productivity เน้นเสียเวลา กรอกซ้ำ ระบบช้า"}, {"id": "S3-06-a", "t": "Support pain point", "th": "Support pain point", "w": "Support: ข้อมูลไม่ชัด error ไม่บอกวิธีแก้ ไม่มีช่องทางช่วยเหลือ (ตัวอย่างตรงจากสไลด์)"}, {"id": "S3-06-d1", "t": "Process pain point", "th": "Process pain point", "w": "Process เน้นขั้นตอนซับซ้อน เช่น checkout หลายหน้า"}, {"id": "S3-06-d2", "t": "Design pain point", "th": "Design pain point", "w": "Design เน้นหน้าตา contrast ปุ่มเล็ก icon ไม่สื่อ"}], "answer": "S3-06-a", "ref": "Ch3 p31"}, {"id": "S3-07", "set": "S", "ch": 3, "q": "An Empathy Map places the user at the center surrounded by which four quadrants?", "q_th": "Empathy Map วางผู้ใช้ไว้ตรงกลาง ล้อมรอบด้วย 4 ช่องใด", "options": [{"id": "S3-07-d0", "t": "Who, What, Where, When", "th": "Who, What, Where, When", "w": "นั่นคือ 5W1H สำหรับ problem statement"}, {"id": "S3-07-a", "t": "Think, Say, Does, Feel", "th": "Think, Say, Does, Feel", "w": "แผนภาพสไลด์: Think / Does / Say / Feel รอบ User"}, {"id": "S3-07-d1", "t": "Before, During, After, Goal", "th": "Before, During, After, Goal", "w": "Before/During/After คือ Process ใน Journey"}, {"id": "S3-07-d2", "t": "Visceral, Behavioral, Reflective, Action", "th": "Visceral, Behavioral, Reflective, Action", "w": "3 ระดับแรกคือ Emotion ของ Norman"}], "answer": "S3-07-a", "ref": "Ch3 p13, p34"}, {"id": "S3-08", "set": "S", "ch": 3, "q": "In the scenario of a user journey, the \"Trigger\" refers to:", "q_th": "ใน scenario ของ user journey คำว่า \"Trigger\" หมายถึง", "options": [{"id": "S3-08-d0", "t": "The persona who performs the actions in the journey", "th": "persona ที่เป็นผู้กระทำใน journey", "w": "นั่นคือ Actor"}, {"id": "S3-08-a", "t": "The event that makes the user start using the product", "th": "เหตุการณ์ที่ทำให้ผู้ใช้เริ่มเข้ามาใช้ผลิตภัณฑ์", "w": "สไลด์: Trigger = เหตุการณ์ที่ทำให้ user เข้ามาใช้งาน"}, {"id": "S3-08-d1", "t": "The context or environment while the product is used", "th": "บริบทหรือสภาพแวดล้อมขณะใช้ผลิตภัณฑ์", "w": "นั่นคือ Environment"}, {"id": "S3-08-d2", "t": "The final goal the user wants to achieve", "th": "เป้าหมายสุดท้ายที่ผู้ใช้อยากทำให้สำเร็จ", "w": "นั่นคือ Goals"}], "answer": "S3-08-a", "ref": "Ch3 p25"}, {"id": "S3-09", "set": "S", "ch": 3, "q": "In the User Persona Process, \"Interviews, Questionnaire, Surveys, Observation\" belong to which step?", "q_th": "ใน User Persona Process ขั้นตอนที่ใช้ \"Interviews, Questionnaire, Surveys, Observation\" คือขั้นใด", "options": [{"id": "S3-09-a", "t": "Data Gathering", "th": "Data Gathering", "w": "ขั้นแรก: เก็บข้อมูลด้วย Interviews, Questionnaire, Surveys, Observation"}, {"id": "S3-09-d0", "t": "Analysis & Synthesis", "th": "Analysis & Synthesis", "w": "ขั้นนี้สรุป pain points, goals, behaviors"}, {"id": "S3-09-d1", "t": "Persona Creation", "th": "Persona Creation", "w": "ขั้นนี้เขียน general details, personality, needs ฯลฯ"}, {"id": "S3-09-d2", "t": "Idea / Impact", "th": "Idea / Impact", "w": "เป็นช่วงท้ายของ Journey Map"}], "answer": "S3-09-a", "ref": "Ch3 p17"}, {"id": "S3-10", "set": "S", "ch": 3, "q": "In the Action stage of a journey, the phase where users know possible solutions and begin comparing options is called:", "q_th": "ในขั้น Action ของ journey ช่วงที่ผู้ใช้รู้ทางแก้ปัญหาแล้วและเริ่มเปรียบเทียบตัวเลือกเรียกว่า", "options": [{"id": "S3-10-d0", "t": "Awareness", "th": "Awareness", "w": "Awareness: เพิ่งเริ่มรู้ว่าตนมีปัญหา"}, {"id": "S3-10-a", "t": "Consideration", "th": "Consideration", "w": "Consideration: ผู้ใช้รู้วิธีแก้และเปรียบเทียบตัวเลือก ต้องนำเสนอจุดเด่น/รีวิว"}, {"id": "S3-10-d1", "t": "Difficulty", "th": "Difficulty", "w": "Difficulty: จุดที่ผู้ใช้สับสน/ติดขัด"}, {"id": "S3-10-d2", "t": "Retention", "th": "Retention", "w": "Retention เป็นมิติของ HEART (Ch9)"}], "answer": "S3-10-a", "ref": "Ch3 p27"}, {"id": "S4-01", "set": "S", "ch": 4, "q": "The three basic ethical principles of the Belmont Report are:", "q_th": "หลักจริยธรรมพื้นฐาน 3 ข้อของ Belmont Report คือ", "options": [{"id": "S4-01-d0", "t": "Autonomy, Privacy, Consent", "th": "Autonomy, Privacy, Consent", "w": "เป็นองค์ประกอบย่อย ไม่ใช่ 3 หลักของ Belmont"}, {"id": "S4-01-d1", "t": "Exemption, Expedited, Full Board", "th": "Exemption, Expedited, Full Board", "w": "เป็นประเภทการพิจารณาโครงการ"}, {"id": "S4-01-d2", "t": "Distributive, Procedural, Corrective", "th": "Distributive, Procedural, Corrective", "w": "เป็นประเภทของ Justice"}, {"id": "S4-01-a", "t": "Respect for Persons, Beneficence, Justice", "th": "Respect for Persons, Beneficence, Justice", "w": "3 หลักจริยธรรมพื้นฐานตาม Belmont Report"}], "answer": "S4-01-a", "ref": "Ch4 p47"}, {"id": "S4-02", "set": "S", "ch": 4, "q": "A study uses an anonymous general satisfaction questionnaire with no or very low risk. Which review type fits?", "q_th": "งานวิจัยใช้แบบสอบถามความพึงพอใจทั่วไปแบบไม่ระบุตัวตน ไม่มีความเสี่ยงหรือเสี่ยงต่ำมาก ควรใช้การพิจารณาประเภทใด", "options": [{"id": "S4-02-d0", "t": "Expedited", "th": "Expedited", "w": "Expedited ใช้กับความเสี่ยงต่ำ เช่น เจาะเลือดน้อย/สัมภาษณ์เชิงลึก"}, {"id": "S4-02-a", "t": "Exemption", "th": "Exemption", "w": "ความเสี่ยงไม่มี/ต่ำมาก เช่นแบบสอบถามความพึงพอใจไม่ระบุชื่อ → Exemption"}, {"id": "S4-02-d1", "t": "Full Board", "th": "Full Board", "w": "Full Board สำหรับความเสี่ยงสูงหรือกลุ่มเปราะบาง"}, {"id": "S4-02-d2", "t": "Waive Consent", "th": "Waive Consent", "w": "เป็นการยกเว้นขั้นตอนขอความยินยอม ไม่ใช่ประเภทการพิจารณา"}], "answer": "S4-02-a", "ref": "Ch4 p14"}, {"id": "S4-03", "set": "S", "ch": 4, "q": "A research project tests a new drug on children. Which review type is required?", "q_th": "โครงการวิจัยทดลองยาใหม่ในเด็ก ต้องใช้การพิจารณาประเภทใด", "options": [{"id": "S4-03-d0", "t": "Exemption", "th": "Exemption", "w": "ห้ามขอ Exempt เมื่อเป็นกลุ่มเปราะบางหรือความเสี่ยงสูง"}, {"id": "S4-03-a", "t": "Full Board", "th": "Full Board", "w": "ความเสี่ยงสูง + กลุ่มเปราะบาง (เด็ก) → ประชุมกรรมการเต็มคณะ"}, {"id": "S4-03-d1", "t": "Expedited", "th": "Expedited", "w": "Expedited ใช้กับความเสี่ยงต่ำเท่านั้น"}, {"id": "S4-03-d2", "t": "Not Subject to Ethical Review", "th": "Not Subject to Ethical Review", "w": "เกี่ยวข้องกับการทดลองในมนุษย์โดยตรง จึงต้องผ่านการพิจารณา"}], "answer": "S4-03-a", "ref": "Ch4 p11–12"}, {"id": "S4-04", "set": "S", "ch": 4, "q": "According to the course rules, ethics approval must be requested at least how long before data collection?", "q_th": "ตามกฎของคอร์ส ต้องยื่นขอรับรองจริยธรรมล่วงหน้าอย่างน้อยกี่เดือนก่อนเก็บข้อมูล", "options": [{"id": "S4-04-a", "t": "3 months", "th": "3 เดือน", "w": "สไลด์: ขอรับรองก่อนเริ่มเก็บข้อมูลอย่างน้อย 3 เดือน (และขอย้อนหลังไม่ได้)"}, {"id": "S4-04-d0", "t": "6 months", "th": "6 เดือน", "w": "6 เดือนคือเงื่อนไขอายุ certificate ที่ต้องไม่หมดอายุ"}, {"id": "S4-04-d1", "t": "1 month", "th": "1 เดือน", "w": "ไม่ใช่ตัวเลขในสไลด์"}, {"id": "S4-04-d2", "t": "It can be requested after data collection", "th": "ขอหลังเก็บข้อมูลแล้วได้", "w": "ขอรับรองย้อนหลังไม่ได้"}], "answer": "S4-04-a", "ref": "Ch4 p5"}, {"id": "S4-05", "set": "S", "ch": 4, "q": "A researcher selects only poor participants for a risky experiment because they are easy to recruit. Which Belmont principle is mainly violated?", "q_th": "นักวิจัยเลือกเฉพาะคนยากจนเข้าการทดลองที่มีความเสี่ยงเพราะหาคนง่าย ละเมิดหลัก Belmont ข้อใดเป็นหลัก", "options": [{"id": "S4-05-d0", "t": "Beneficence", "th": "Beneficence", "w": "Beneficence เน้นชั่งน้ำหนักประโยชน์/ความเสี่ยง แต่ประเด็นหลักคือการเลือกกลุ่มอย่างไม่เป็นธรรม"}, {"id": "S4-05-d1", "t": "Respect for Persons", "th": "Respect for Persons", "w": "เน้น autonomy และ consent ไม่ใช่ความเป็นธรรมในการคัดเลือก"}, {"id": "S4-05-d2", "t": "Confidentiality", "th": "Confidentiality", "w": "ไม่เกี่ยวกับการรักษาความลับ"}, {"id": "S4-05-a", "t": "Justice", "th": "Justice", "w": "Justice: ต้องคัดเลือกอาสาสมัครอย่างเท่าเทียม ไม่เจาะจงกลุ่มด้อยโอกาสเพื่อความสะดวก"}], "answer": "S4-05-a", "ref": "Ch4 p63"}, {"id": "S4-06", "set": "S", "ch": 4, "q": "For a child aged 7–12, what consent documents are needed?", "q_th": "เด็กอายุ 7–12 ปี ต้องใช้เอกสารยินยอมอะไรบ้าง", "options": [{"id": "S4-06-d0", "t": "Only the parent signs; the child is not asked", "th": "ผู้ปกครองลงนามอย่างเดียว ไม่ต้องถามเด็ก", "w": "ใช้กับเด็กอายุต่ำกว่า 7 ปี"}, {"id": "S4-06-a", "t": "A child assent form plus parent/guardian consent", "th": "Assent form ภาษาเด็ก + ความยินยอมจากผู้ปกครอง", "w": "7–12 ปี: เอกสารภาษาเด็ก (Assent) + ผู้ปกครองลงนาม"}, {"id": "S4-06-d1", "t": "Only the child signs an adult consent form", "th": "เด็กลงนามในใบยินยอมแบบผู้ใหญ่คนเดียว", "w": "เด็กยังต้องมีผู้ปกครองลงนามร่วม"}, {"id": "S4-06-d2", "t": "No consent is needed for minors in UX research", "th": "งานวิจัย UX ไม่ต้องขอความยินยอมจากผู้เยาว์", "w": "ขัดกับหลักการคุ้มครองกลุ่มเปราะบาง"}], "answer": "S4-06-a", "ref": "Ch4 p101"}, {"id": "S4-07", "set": "S", "ch": 4, "q": "In low-risk UX research, a participant shows agreement simply by continuing the task or returning a questionnaire. This is called:", "q_th": "ในงานวิจัย UX ที่ความเสี่ยงต่ำ ผู้เข้าร่วมแสดงความยินยอมเพียงแค่ทำงานต่อหรือส่งแบบสอบถามคืน เรียกว่า", "options": [{"id": "S4-07-d0", "t": "Waive Consent", "th": "Waive Consent", "w": "Waive คือได้รับยกเว้นไม่ต้องขอความยินยอมเลย (ต้องผ่านกรรมการ)"}, {"id": "S4-07-d1", "t": "Assent", "th": "Assent", "w": "Assent คือการรับฟังความสมัครใจของเด็ก/ผู้เปราะบาง"}, {"id": "S4-07-a", "t": "Consent by Action", "th": "Consent by Action", "w": "ยินยอมด้วยการกระทำแทนการลงชื่อ ใช้กับความเสี่ยงต่ำมาก และต้องไม่เก็บ identifier"}, {"id": "S4-07-d2", "t": "Written Consent", "th": "Written Consent", "w": "ลายลักษณ์อักษรต้องมีการลงนาม"}], "answer": "S4-07-a", "ref": "Ch4 p100"}, {"id": "S4-08", "set": "S", "ch": 4, "q": "Thailand's PDPA came into force on which date, and which law was it modeled on?", "q_th": "PDPA ของไทยบังคับใช้วันที่เท่าไร และถอดแบบมาจากกฎหมายใด", "options": [{"id": "S4-08-d0", "t": "1 June 2019, modeled on HIPAA", "th": "1 มิถุนายน 2562 ต้นแบบคือ HIPAA", "w": "ปีและกฎหมายต้นแบบไม่ตรง"}, {"id": "S4-08-d1", "t": "1 January 2022, modeled on the Belmont Report", "th": "1 มกราคม 2565 ต้นแบบคือ Belmont Report", "w": "Belmont Report เป็นหลักจริยธรรมวิจัย ไม่ใช่กฎหมายข้อมูล"}, {"id": "S4-08-a", "t": "1 June 2022 (B.E. 2565), modeled on the EU GDPR", "th": "1 มิถุนายน 2565 (ค.ศ. 2022) ต้นแบบคือ GDPR ของ EU", "w": "สไลด์: ประกาศใช้ 1 มิ.ย. 2565 และถอดแบบจาก GDPR"}, {"id": "S4-08-d2", "t": "1 June 2022, modeled on 45 CFR 46", "th": "1 มิถุนายน 2565 ต้นแบบคือ 45 CFR 46", "w": "45 CFR 46 เป็นข้อบังคับสหรัฐฯ เรื่องคุ้มครองอาสาสมัคร"}], "answer": "S4-08-a", "ref": "Ch4 p84–85"}, {"id": "S4-09", "set": "S", "ch": 4, "q": "Which of the following is classified as sensitive personal data?", "q_th": "ข้อใดเป็นข้อมูลส่วนบุคคลที่อ่อนไหว (sensitive personal data)", "options": [{"id": "S4-09-d0", "t": "Work email address", "th": "อีเมลที่ใช้ทำงาน", "w": "อีเมลที่ใช้ทำงานเป็น non-private info"}, {"id": "S4-09-d1", "t": "Full name", "th": "ชื่อ-นามสกุล", "w": "ชื่อ-นามสกุลเป็นข้อมูลส่วนบุคคลทั่วไป ไม่ใช่อ่อนไหว"}, {"id": "S4-09-d2", "t": "Company registration number", "th": "เลขทะเบียนบริษัท", "w": "เลขที่บริษัทเป็น non-private info"}, {"id": "S4-09-a", "t": "Religious belief", "th": "ความเชื่อทางศาสนา", "w": "ศาสนา/ความเชื่อ เป็นข้อมูลอ่อนไหว (Sensitive Data)"}], "answer": "S4-09-a", "ref": "Ch4 p80, p84"}, {"id": "S4-10", "set": "S", "ch": 4, "q": "A student agrees to join a study only because their own lecturer asked them and they feel unable to refuse. This is which NBAC vulnerability?", "q_th": "นักศึกษายอมเข้าร่วมวิจัยเพียงเพราะอาจารย์ของตนเป็นคนชวนและรู้สึกปฏิเสธไม่ได้ เป็นความเปราะบางแบบใดตาม NBAC", "options": [{"id": "S4-10-a", "t": "Deferential Vulnerability", "th": "Deferential Vulnerability", "w": "เปราะบางจากความเกรงใจผู้มีสถานะสูงกว่า เช่น นักศึกษา-อาจารย์"}, {"id": "S4-10-d0", "t": "Economic Vulnerability", "th": "Economic Vulnerability", "w": "เกี่ยวกับรายได้/ฐานะทางเศรษฐกิจ"}, {"id": "S4-10-d1", "t": "Medical Vulnerability", "th": "Medical Vulnerability", "w": "เกี่ยวกับการเจ็บป่วยรุนแรง"}, {"id": "S4-10-d2", "t": "Cognitive or Communicative Vulnerability", "th": "Cognitive or Communicative Vulnerability", "w": "เกี่ยวกับความบกพร่องในการรับรู้/สื่อสาร"}], "answer": "S4-10-a", "ref": "Ch4 p29, p32"}, {"id": "S5-01", "set": "S", "ch": 5, "q": "The 10 Usability Heuristics taught in the course were created by:", "q_th": "10 Usability Heuristics ที่สอนในคอร์สคิดค้นโดยใคร", "options": [{"id": "S5-01-d0", "t": "Don Norman", "th": "Don Norman", "w": "Don Norman สอนเรื่อง Emotional Design (Visceral/Behavioral/Reflective)"}, {"id": "S5-01-d1", "t": "Larry Tesler", "th": "Larry Tesler", "w": "Tesler คือเจ้าของ Tesler's Law"}, {"id": "S5-01-d2", "t": "George Miller", "th": "George Miller", "w": "Miller คือเจ้าของกฎ 7 ± 2"}, {"id": "S5-01-a", "t": "Jakob Nielsen", "th": "Jakob Nielsen", "w": "สไลด์: หลักการ 10 ข้อคิดค้นโดย Jakob Nielsen"}], "answer": "S5-01-a", "ref": "Ch5 p2"}, {"id": "S5-02", "set": "S", "ch": 5, "q": "Graying out the \"Submit\" button until all required fields are filled is an example of which heuristic?", "q_th": "การทำปุ่ม \"Submit\" เป็นสีเทาจนกว่าจะกรอกช่องที่จำเป็นครบ เป็นตัวอย่างของ heuristic ใด", "options": [{"id": "S5-02-a", "t": "Error prevention", "th": "Error prevention", "w": "ดักไม่ให้เกิดความผิดพลาดตั้งแต่แรก ตัวอย่าง: ปุ่มสีเทาเมื่อข้อมูลไม่ครบ"}, {"id": "S5-02-d0", "t": "Visibility of system status", "th": "Visibility of system status", "w": "เป็นการแจ้งสถานะระบบ เช่น loading"}, {"id": "S5-02-d1", "t": "Help users recognize, diagnose, and recover from errors", "th": "Help users recognize, diagnose, and recover from errors", "w": "ใช้หลังเกิด error แล้ว"}, {"id": "S5-02-d2", "t": "Aesthetic and minimalist design", "th": "Aesthetic and minimalist design", "w": "เกี่ยวกับการตัดสิ่งไม่จำเป็นออก"}], "answer": "S5-02-a", "ref": "Ch5 p12"}, {"id": "S5-03", "set": "S", "ch": 5, "q": "A search box that suggests possible queries as the user types supports which heuristic?", "q_th": "ช่องค้นหาที่แนะนำคำค้นขณะผู้ใช้พิมพ์ สนับสนุน heuristic ใด", "options": [{"id": "S5-03-a", "t": "Recognition rather than recall", "th": "Recognition rather than recall", "w": "แสดงตัวเลือกให้เห็น ผู้ใช้ไม่ต้องจำเอง (ตัวอย่าง search suggestion)"}, {"id": "S5-03-d0", "t": "Flexibility and efficiency of use", "th": "Flexibility and efficiency of use", "w": "ตัวอย่างหลักคือ keyboard shortcut สำหรับผู้ใช้ชำนาญ"}, {"id": "S5-03-d1", "t": "Consistency and standards", "th": "Consistency and standards", "w": "เกี่ยวกับความเหมือนกันของปุ่ม/คำ"}, {"id": "S5-03-d2", "t": "User control and freedom", "th": "User control and freedom", "w": "เกี่ยวกับ undo/ยกเลิก/ออก"}], "answer": "S5-03-a", "ref": "Ch5 p14–16"}, {"id": "S5-04", "set": "S", "ch": 5, "q": "When writing tasks for a usability test, the course requires tasks to be:", "q_th": "ในการเขียน task สำหรับ usability test คอร์สกำหนดให้ task ต้อง", "options": [{"id": "S5-04-d0", "t": "Leading, so participants finish faster", "th": "ชี้นำ เพื่อให้ผู้เข้าร่วมทำเสร็จเร็วขึ้น", "w": "ห้ามใช้คำชี้นำ"}, {"id": "S5-04-d1", "t": "Open-ended with no clear success criteria", "th": "ปลายเปิด ไม่มีเกณฑ์ความสำเร็จชัดเจน", "w": "ต้องวัดผลได้ชัดเจน"}, {"id": "S5-04-a", "t": "Non-leading, with a binary (success/fail) outcome", "th": "ไม่ชี้นำ (non-leading) และวัดผลได้แบบ binary (สำเร็จ/ไม่สำเร็จ)", "w": "สไลด์: ห้ามชี้นำ และต้องวัดผลได้ว่าสำเร็จหรือไม่สำเร็จ"}, {"id": "S5-04-d2", "t": "Identical to the trial example", "th": "เหมือนกับตัวอย่างใน trial ทุกประการ", "w": "trial ต้องไม่เกี่ยวกับข้อมูลจริงที่ทดสอบ"}], "answer": "S5-04-a", "ref": "Ch5 p31"}, {"id": "S5-05", "set": "S", "ch": 5, "q": "In A/B testing, version B (variation) should differ from version A (control) by:", "q_th": "ใน A/B testing เวอร์ชัน B (variation) ควรต่างจากเวอร์ชัน A (control) อย่างไร", "options": [{"id": "S5-05-a", "t": "Only one changed variable", "th": "เปลี่ยนตัวแปรเพียงหนึ่งอย่าง", "w": "B คือรูปแบบใหม่ที่ปรับตัวแปร 1 อย่าง เพื่อสรุปผลได้ชัด"}, {"id": "S5-05-d0", "t": "As many changes as possible", "th": "เปลี่ยนให้มากที่สุดเท่าที่ทำได้", "w": "เปลี่ยนหลายอย่างจะไม่รู้ว่าตัวไหนส่งผล"}, {"id": "S5-05-d1", "t": "Nothing; both should be identical", "th": "ไม่ต่างเลย ทั้งสองต้องเหมือนกัน", "w": "ถ้าเหมือนกันจะไม่มีอะไรให้เปรียบเทียบ"}, {"id": "S5-05-d2", "t": "A completely different user group selected by the designer", "th": "ใช้กลุ่มผู้ใช้ที่ต่างกันโดยสิ้นเชิงซึ่งดีไซเนอร์เลือกเอง", "w": "ต้องสุ่มผู้ใช้ ไม่ใช่ให้ดีไซเนอร์เลือก"}], "answer": "S5-05-a", "ref": "Ch5 p42"}, {"id": "S5-06", "set": "S", "ch": 5, "q": "T-shirt sizes S, M, L are an example of which type of data?", "q_th": "ไซส์เสื้อ S, M, L เป็นตัวอย่างของข้อมูลประเภทใด", "options": [{"id": "S5-06-d0", "t": "Nominal", "th": "Nominal", "w": "Nominal แบ่งกลุ่มได้แต่เรียงลำดับไม่ได้ เช่น เพศ สี"}, {"id": "S5-06-d1", "t": "Discrete", "th": "Discrete", "w": "Discrete เป็นข้อมูลเชิงปริมาณแบบนับ"}, {"id": "S5-06-d2", "t": "Continuous", "th": "Continuous", "w": "Continuous เป็นการวัดค่า เช่น น้ำหนัก"}, {"id": "S5-06-a", "t": "Ordinal", "th": "Ordinal", "w": "แบ่งกลุ่มได้และเรียงลำดับได้ = Ordinal (ตัวอย่างจากสไลด์)"}], "answer": "S5-06-a", "ref": "Ch5 p35"}, {"id": "S5-07", "set": "S", "ch": 5, "q": "A focus group typically consists of about how many participants?", "q_th": "Focus group โดยทั่วไปมีผู้เข้าร่วมประมาณกี่คน", "options": [{"id": "S5-07-d0", "t": "1 person", "th": "1 คน", "w": "นั่นคือการสัมภาษณ์ตัวต่อตัว"}, {"id": "S5-07-d1", "t": "2–3 people", "th": "2–3 คน", "w": "น้อยกว่าที่สไลด์ระบุ"}, {"id": "S5-07-d2", "t": "100+ people", "th": "100 คนขึ้นไป", "w": "จำนวนมากเหมาะกับ questionnaire"}, {"id": "S5-07-a", "t": "6–10 people", "th": "6–10 คน", "w": "สไลด์: กลุ่มเล็ก ประมาณ 6–10 คน มีผู้สังเกตการณ์บันทึก"}], "answer": "S5-07-a", "ref": "Ch5 p52"}, {"id": "S5-08", "set": "S", "ch": 5, "q": "A user enters a wrong password and the internet disconnects during login. Mapping this scenario is part of the:", "q_th": "ผู้ใช้กรอกรหัสผ่านผิดและอินเทอร์เน็ตหลุดระหว่างล็อกอิน การวางแผนรองรับสถานการณ์นี้เป็นส่วนของ", "options": [{"id": "S5-08-d0", "t": "Happy path", "th": "Happy path", "w": "Happy path คือทุกอย่างถูกต้องราบรื่น"}, {"id": "S5-08-d1", "t": "User story", "th": "User story", "w": "User story คือคำอธิบายความต้องการสั้น ๆ จากมุมผู้ใช้"}, {"id": "S5-08-a", "t": "Unhappy path", "th": "Unhappy path", "w": "Unhappy path = เส้นทางเมื่อเกิดข้อผิดพลาด ต้องมีข้อความและทางออกให้ผู้ใช้"}, {"id": "S5-08-d2", "t": "Benchmark comparison", "th": "Benchmark comparison", "w": "เป็นวิธีวัดของ Jakob's Law"}], "answer": "S5-08-a", "ref": "Ch5 p62–63"}, {"id": "S5-09", "set": "S", "ch": 5, "q": "Which set lists the three characteristics of a good sample group?", "q_th": "ข้อใดคือคุณลักษณะ 3 ข้อของกลุ่มตัวอย่างที่ดี", "options": [{"id": "S5-09-d0", "t": "Large budget, fast recruitment, convenience", "th": "งบประมาณมาก หาคนได้เร็ว และสะดวก", "w": "เป็นเรื่องความสะดวก ไม่ใช่คุณภาพกลุ่มตัวอย่าง"}, {"id": "S5-09-d1", "t": "Same gender, same age, same job", "th": "เพศเดียวกัน อายุเท่ากัน อาชีพเดียวกัน", "w": "ทำให้ไม่เป็นตัวแทน"}, {"id": "S5-09-d2", "t": "Friends of the researcher, volunteers, students", "th": "เพื่อนของผู้วิจัย อาสาสมัคร และนักศึกษา", "w": "อาจเกิดอคติและเป็น deferential vulnerability"}, {"id": "S5-09-a", "t": "Representativeness, adequate size, reliability", "th": "เป็นตัวแทน (Representativeness) ขนาดเพียงพอ และเชื่อถือได้", "w": "ลักษณะกลุ่มตัวอย่างที่ดี 3 ข้อตามสไลด์"}], "answer": "S5-09-a", "ref": "Ch5 p29"}, {"id": "S5-10", "set": "S", "ch": 5, "q": "When applying Fitts's Law in usability testing, a high Error Rate on a button most likely indicates that:", "q_th": "เมื่อใช้ Fitts's Law ใน usability testing ถ้าปุ่มหนึ่งมี Error Rate สูง น่าจะบ่งชี้ว่า", "options": [{"id": "S5-10-d0", "t": "There are too many choices on the menu", "th": "เมนูมีตัวเลือกมากเกินไป", "w": "เป็นประเด็นของ Hick's Law"}, {"id": "S5-10-d1", "t": "The user's mental model matches the design", "th": "mental model ของผู้ใช้ตรงกับดีไซน์", "w": "ถ้าตรงกันจะไม่ควรผิดบ่อย"}, {"id": "S5-10-d2", "t": "The task was a happy path", "th": "task นั้นเป็น happy path", "w": "ไม่เกี่ยวกับ error rate ของขนาดปุ่ม"}, {"id": "S5-10-a", "t": "The target is too small or too far away", "th": "เป้าหมายเล็กเกินไปหรืออยู่ไกลเกินไป", "w": "สไลด์: กดผิดบ่อย แสดงว่าอาจเล็กเกินไปหรืออยู่ไกล"}], "answer": "S5-10-a", "ref": "Ch5 p43"}, {"id": "S8-01", "set": "S", "ch": 8, "q": "A wireframe is best compared to:", "q_th": "Wireframe เปรียบได้ดีที่สุดกับ", "options": [{"id": "S8-01-a", "t": "A blueprint of the layout", "th": "พิมพ์เขียวของเลย์เอาต์", "w": "สไลด์: wireframe เปรียบเสมือนพิมพ์เขียว/แบบแปลน เน้น layout"}, {"id": "S8-01-d0", "t": "A fully interactive app ready for launch", "th": "แอปที่โต้ตอบได้เต็มรูปแบบพร้อมเปิดตัว", "w": "นั่นคือของจริงหรือ prototype ขั้นสูง"}, {"id": "S8-01-d1", "t": "A polished marketing poster with brand colors", "th": "โปสเตอร์การตลาดที่ตกแต่งด้วยสีแบรนด์", "w": "wireframe ปกติไม่มีสีหรือกราฟิกสวยงาม"}, {"id": "S8-01-d2", "t": "A database schema for the system", "th": "แผนผังฐานข้อมูลของระบบ", "w": "ไม่ใช่งานออกแบบหน้าจอ"}], "answer": "S8-01-a", "ref": "Ch8 p2"}, {"id": "S8-02", "set": "S", "ch": 8, "q": "Which wireframe type is the fastest to create and is used to test basic concepts and screen flow?", "q_th": "Wireframe ประเภทใดสร้างได้เร็วที่สุดและใช้ทดสอบแนวคิดและการไหลของหน้าจอเบื้องต้น", "options": [{"id": "S8-02-d0", "t": "Mid-fidelity wireframe", "th": "Mid-fidelity wireframe", "w": "ใช้ทดสอบ usability ใช้เวลาปานกลาง"}, {"id": "S8-02-a", "t": "Low-fidelity wireframe", "th": "Low-fidelity wireframe", "w": "Low-Fi: วาดมือ/หยาบ เร็วที่สุด ใช้ทดสอบแนวคิดและ flow เบื้องต้น"}, {"id": "S8-02-d1", "t": "High-fidelity wireframe", "th": "High-fidelity wireframe", "w": "ช้าที่สุด ใช้ทดสอบความรู้สึกและส่ง dev"}, {"id": "S8-02-d2", "t": "Mockup", "th": "Mockup", "w": "mockup เน้นความสวยสมจริง ไม่ใช่เร็วที่สุด"}], "answer": "S8-02-a", "ref": "Ch8 p12"}, {"id": "S8-03", "set": "S", "ch": 8, "q": "A prototype that implements only the payment feature, fully connected to the real database, is a:", "q_th": "Prototype ที่ทำเฉพาะฟีเจอร์ชำระเงินและเชื่อมฐานข้อมูลจริงเต็มรูปแบบ คือ", "options": [{"id": "S8-03-d0", "t": "Horizontal prototype", "th": "Horizontal prototype", "w": "Horizontal: กว้าง เห็นทุกหน้าจอ แต่ไม่ประมวลผลจริง"}, {"id": "S8-03-a", "t": "Vertical prototype", "th": "Vertical prototype", "w": "Vertical: scope แคบ ฟีเจอร์เดียวแต่ทำงานจริง ต่อ backend"}, {"id": "S8-03-d1", "t": "Paper prototype", "th": "Paper prototype", "w": "ทำจากกระดาษ ไม่ต่อฐานข้อมูล"}, {"id": "S8-03-d2", "t": "Mockup", "th": "Mockup", "w": "mockup อาจกดอะไรไม่ได้เลย"}], "answer": "S8-03-a", "ref": "Ch8 p24"}, {"id": "S8-04", "set": "S", "ch": 8, "q": "The course compares a horizontal prototype to:", "q_th": "คอร์สเปรียบ horizontal prototype กับอะไร", "options": [{"id": "S8-04-d0", "t": "A single bathroom where water and toilet really work", "th": "ห้องน้ำห้องเดียวที่เปิดน้ำและกดชักโครกได้จริง", "w": "นั่นคืออุปมาของ Vertical prototype"}, {"id": "S8-04-a", "t": "A model house: every room visible, nothing works", "th": "บ้านจำลอง: เห็นทุกห้อง แต่ใช้งานจริงไม่ได้", "w": "Horizontal = เห็นภาพรวมทุกห้อง แต่ใช้งานจริงไม่ได้"}, {"id": "S8-04-d1", "t": "A blueprint drawn on paper", "th": "พิมพ์เขียวที่วาดบนกระดาษ", "w": "ใกล้เคียง wireframe/paper มากกว่า"}, {"id": "S8-04-d2", "t": "A finished house ready to live in", "th": "บ้านที่สร้างเสร็จพร้อมอยู่", "w": "เป็นผลิตภัณฑ์จริง ไม่ใช่ prototype"}], "answer": "S8-04-a", "ref": "Ch8 p24"}, {"id": "S8-05", "set": "S", "ch": 8, "q": "Which statement correctly describes a mockup?", "q_th": "ข้อใดอธิบาย mockup ได้ถูกต้อง", "options": [{"id": "S8-05-d0", "t": "A rough hand sketch with boxes and lines", "th": "ภาพร่างมือหยาบ ๆ ด้วยกล่องและเส้น", "w": "นั่นคือ low-fi wireframe/sketch"}, {"id": "S8-05-a", "t": "A realistic visual that may not be clickable", "th": "ภาพเสมือนจริงที่อาจกดอะไรไม่ได้", "w": "สไลด์: mockup เพิ่มความสวย สมจริง แต่อาจกดอะไรไม่ได้/แค่ demo"}, {"id": "S8-05-d1", "t": "A working model connected to the backend", "th": "แบบจำลองที่ใช้งานได้และเชื่อมต่อ backend", "w": "นั่นคือ vertical/working prototype"}, {"id": "S8-05-d2", "t": "A list of user requirements", "th": "รายการความต้องการของผู้ใช้", "w": "นั่นคือ user story/requirement"}], "answer": "S8-05-a", "ref": "Ch8 p29"}, {"id": "S8-06", "set": "S", "ch": 8, "q": "What is the typical order of design artifacts shown in the course?", "q_th": "ลำดับทั่วไปของชิ้นงานออกแบบที่แสดงในคอร์สคือ", "options": [{"id": "S8-06-d0", "t": "Wireframe → Sketch → Prototype → Mockup", "th": "Wireframe → Sketch → Prototype → Mockup", "w": "sketch มาก่อน และ prototype อยู่ท้ายสุด"}, {"id": "S8-06-d1", "t": "Prototype → Mockup → Wireframe → Sketch", "th": "Prototype → Mockup → Wireframe → Sketch", "w": "กลับลำดับทั้งหมด"}, {"id": "S8-06-a", "t": "Sketch → Wireframe → Mockup → Prototype", "th": "Sketch → Wireframe → Mockup → Prototype", "w": "ลำดับตามสไลด์ p30"}, {"id": "S8-06-d2", "t": "Sketch → Prototype → Wireframe → Mockup", "th": "Sketch → Prototype → Wireframe → Mockup", "w": "prototype ต้องมาหลัง wireframe/mockup"}], "answer": "S8-06-a", "ref": "Ch8 p30"}, {"id": "S8-07", "set": "S", "ch": 8, "q": "Which of the following is NOT one of the 8 components of visual hierarchy listed in the course?", "q_th": "ข้อใด \"ไม่ใช่\" หนึ่งใน 8 องค์ประกอบของ visual hierarchy ตามที่คอร์สระบุ", "options": [{"id": "S8-07-d0", "t": "Whitespace", "th": "Whitespace", "w": "อยู่ในรายการ 8 องค์ประกอบ"}, {"id": "S8-07-d1", "t": "Repetition", "th": "Repetition", "w": "อยู่ในรายการ 8 องค์ประกอบ"}, {"id": "S8-07-d2", "t": "Alignment", "th": "Alignment", "w": "อยู่ในรายการ 8 องค์ประกอบ"}, {"id": "S8-07-a", "t": "Animation", "th": "Animation", "w": "8 องค์ประกอบ: Size, Color, Contrast, Alignment, Repetition, Proximity, Whitespace, Texture & Style ไม่มี Animation"}], "answer": "S8-07-a", "ref": "Ch8 p31"}, {"id": "S8-08", "set": "S", "ch": 8, "q": "Which is one of the 4 factors for selecting the right wireframe tool?", "q_th": "ข้อใดเป็นหนึ่งใน 4 ปัจจัยในการเลือกเครื่องมือทำ wireframe", "options": [{"id": "S8-08-d0", "t": "Popularity on social media", "th": "ความนิยมบนโซเชียลมีเดีย", "w": "ไม่ใช่ปัจจัยในสไลด์"}, {"id": "S8-08-d1", "t": "The color theme of the tool", "th": "ธีมสีของเครื่องมือ", "w": "ไม่ใช่ปัจจัยในสไลด์"}, {"id": "S8-08-a", "t": "Learnability & ease of use for the team", "th": "Learnability & ease of use สำหรับทีม", "w": "4 factors: Project Type & Goals, Cost, Tool Capabilities, Learnability & Ease of use"}, {"id": "S8-08-d2", "t": "The number of developers in the company", "th": "จำนวน developer ในบริษัท", "w": "สไลด์พูดถึง team size ภายใต้ Cost แต่ไม่ใช่ปัจจัยหลัก 1 ใน 4"}], "answer": "S8-08-a", "ref": "Ch8 p15–16"}, {"id": "S8-09", "set": "S", "ch": 8, "q": "Before creating a wireframe, the course says to consider User, Context and Content. Designing large buttons and voice control for Google Maps because people use it while driving relates to:", "q_th": "ก่อนสร้าง wireframe คอร์สให้คำนึงถึง User, Context และ Content การออกแบบปุ่มใหญ่และสั่งงานด้วยเสียงให้ Google Maps เพราะคนใช้ขณะขับรถ เกี่ยวข้องกับข้อใด", "options": [{"id": "S8-09-a", "t": "Context", "th": "Context", "w": "Context = บริบทการใช้งาน สถานการณ์ สภาพแวดล้อม (ตัวอย่าง Google Maps ขณะขับรถ)"}, {"id": "S8-09-d0", "t": "Content", "th": "Content", "w": "Content = เนื้อหา/ข้อมูลที่ต้องแสดงและการจัดลำดับ"}, {"id": "S8-09-d1", "t": "User", "th": "User", "w": "User = ใครใช้ ความต้องการ pain point"}, {"id": "S8-09-d2", "t": "Status quo bias", "th": "Status quo bias", "w": "เป็นอคติยึดติดสภาพเดิม ไม่ใช่ปัจจัยก่อนทำ wireframe"}], "answer": "S8-09-a", "ref": "Ch8 p51"}, {"id": "S8-10", "set": "S", "ch": 8, "q": "Status Quo Bias refers to:", "q_th": "Status Quo Bias หมายถึง", "options": [{"id": "S8-10-a", "t": "Preferring to keep the current state because it feels safest", "th": "การชอบคงสภาพเดิมไว้เพราะรู้สึกว่าปลอดภัยที่สุด", "w": "อคติยึดติดสภาพเดิม มองว่าสถานะปัจจุบันปลอดภัยที่สุด"}, {"id": "S8-10-d0", "t": "The tendency to remember the first and last items", "th": "แนวโน้มที่จะจำรายการแรกและรายการสุดท้าย", "w": "นั่นคือ Serial Position Effect"}, {"id": "S8-10-d1", "t": "The tendency to notice items that stand out", "th": "แนวโน้มที่จะสังเกตสิ่งที่โดดเด่น", "w": "นั่นคือ Von Restorff/Isolation Effect"}, {"id": "S8-10-d2", "t": "Ignoring anything that looks like an advertisement", "th": "การเมินทุกอย่างที่ดูเหมือนโฆษณา", "w": "นั่นคือ Banner Blindness"}], "answer": "S8-10-a", "ref": "Ch8 p38"}, {"id": "S9-01", "set": "S", "ch": 9, "q": "In the HEART framework, which dimension is measured with churn rate?", "q_th": "ใน HEART framework มิติใดวัดด้วย churn rate", "options": [{"id": "S9-01-d0", "t": "Adoption", "th": "Adoption", "w": "Adoption วัดผู้ใช้ใหม่/อัตราใช้ฟีเจอร์ใหม่"}, {"id": "S9-01-d1", "t": "Engagement", "th": "Engagement", "w": "Engagement วัดความถี่และระยะเวลาใช้งาน"}, {"id": "S9-01-a", "t": "Retention", "th": "Retention", "w": "Retention วัดการกลับมาใช้ซ้ำและลดการเลิกใช้ (Churn Rate)"}, {"id": "S9-01-d2", "t": "Happiness", "th": "Happiness", "w": "Happiness วัดความพึงพอใจ เช่น NPS, CSAT"}], "answer": "S9-01-a", "ref": "Ch9 p2"}, {"id": "S9-02", "set": "S", "ch": 9, "q": "In a survey, 60% are Promoters, 25% Passives and 15% Detractors. What is the NPS?", "q_th": "ในแบบสำรวจ มี Promoters 60%, Passives 25% และ Detractors 15% ค่า NPS เท่ากับเท่าไร", "options": [{"id": "S9-02-d0", "t": "60", "th": "60", "w": "ลืมหัก Detractors"}, {"id": "S9-02-d1", "t": "20", "th": "20", "w": "นำ Passives มาลบด้วยซึ่งผิดสูตร"}, {"id": "S9-02-d2", "t": "85", "th": "85", "w": "บวก Passives เข้าไปซึ่งผิดสูตร"}, {"id": "S9-02-a", "t": "45", "th": "45", "w": "NPS = %Promoters − %Detractors = 60 − 15 = 45 (Passive ไม่นำมาคิด)"}], "answer": "S9-02-a", "ref": "Ch9 p10–11"}, {"id": "S9-03", "set": "S", "ch": 9, "q": "Which metric asks \"How easy was it…?\" and measures the effort customers spend?", "q_th": "ตัวชี้วัดใดถามว่า \"ง่ายแค่ไหน…?\" และวัดความพยายามที่ลูกค้าต้องใช้", "options": [{"id": "S9-03-d0", "t": "CSAT", "th": "CSAT", "w": "CSAT ถาม \"Are you satisfied with…?\""}, {"id": "S9-03-a", "t": "CES", "th": "CES", "w": "CES วัดระดับความพยายาม \"How easy was it\""}, {"id": "S9-03-d1", "t": "NPS", "th": "NPS", "w": "NPS ถาม \"Would you recommend us?\""}, {"id": "S9-03-d2", "t": "FCR", "th": "FCR", "w": "FCR วัดการแก้ปัญหาได้ตั้งแต่ติดต่อครั้งแรก"}], "answer": "S9-03-a", "ref": "Ch9 p13–16"}, {"id": "S9-04", "set": "S", "ch": 9, "q": "How is the CSAT score calculated?", "q_th": "คะแนน CSAT คำนวณอย่างไร", "options": [{"id": "S9-04-d0", "t": "% Promoters − % Detractors", "th": "% Promoters − % Detractors", "w": "นั่นคือสูตร NPS"}, {"id": "S9-04-d1", "t": "Sum of responses ÷ total number of responses", "th": "ผลรวมคะแนน ÷ จำนวนคำตอบทั้งหมด", "w": "นั่นคือสูตร CES"}, {"id": "S9-04-a", "t": "(Number of satisfied responses ÷ total responses) × 100", "th": "(จำนวนคำตอบที่พึงพอใจ ÷ จำนวนคำตอบทั้งหมด) × 100", "w": "สูตรจากสไลด์ satisfied = คะแนน 4–5 บนสเกล 1–5"}, {"id": "S9-04-d2", "t": "(Issues resolved at first contact − reopened) ÷ total issues × 100", "th": "(เรื่องที่แก้ได้ในการติดต่อครั้งแรก − เรื่องที่ถูกเปิดใหม่) ÷ เรื่องทั้งหมด × 100", "w": "นั่นคือสูตร FCR"}], "answer": "S9-04-a", "ref": "Ch9 p8"}, {"id": "S9-05", "set": "S", "ch": 9, "q": "A team wants to know whether the average sign-up time of 30 users is significantly lower than the 60-second target. Which test should be used?", "q_th": "ทีมอยากรู้ว่าเวลาสมัครสมาชิกเฉลี่ยของผู้ใช้ 30 คน ต่ำกว่าเป้า 60 วินาทีอย่างมีนัยสำคัญหรือไม่ ควรใช้สถิติใด", "options": [{"id": "S9-05-d0", "t": "Independent samples t-test", "th": "Independent samples t-test", "w": "ใช้กับ 2 กลุ่มที่เป็นอิสระต่อกัน"}, {"id": "S9-05-d1", "t": "Paired t-test", "th": "Paired t-test", "w": "ใช้กับกลุ่มเดิมวัด 2 ครั้ง"}, {"id": "S9-05-a", "t": "One-sample t-test", "th": "One-sample t-test", "w": "เปรียบเทียบค่าเฉลี่ย 1 กลุ่มกับค่าเป้าหมายที่กำหนดไว้"}, {"id": "S9-05-d2", "t": "Chi-square test", "th": "Chi-square test", "w": "ใช้กับข้อมูลเชิงกลุ่ม (category) ไม่ใช่ค่าเฉลี่ยเวลา"}], "answer": "S9-05-a", "ref": "Ch9 p22–23"}, {"id": "S9-06", "set": "S", "ch": 9, "q": "The same 10 users complete checkout on the old design (pre-test) and then on the new design (post-test). Which test compares their mean times?", "q_th": "ผู้ใช้กลุ่มเดิม 10 คนทำ checkout บนดีไซน์เก่า (pre-test) แล้วทำบนดีไซน์ใหม่ (post-test) ควรใช้สถิติใดเปรียบเทียบเวลาเฉลี่ย", "options": [{"id": "S9-06-a", "t": "Paired samples t-test", "th": "Paired samples t-test", "w": "กลุ่มเดิมวัด 2 ครั้ง (pre/post) → Paired t-test"}, {"id": "S9-06-d0", "t": "Independent samples t-test", "th": "Independent samples t-test", "w": "ใช้เมื่อเป็นคนละกลุ่ม"}, {"id": "S9-06-d1", "t": "One-way ANOVA", "th": "One-way ANOVA", "w": "ใช้เมื่อเปรียบเทียบตั้งแต่ 3 กลุ่ม"}, {"id": "S9-06-d2", "t": "Pearson correlation", "th": "Pearson correlation", "w": "วัดความสัมพันธ์ ไม่ใช่เปรียบเทียบค่าเฉลี่ย"}], "answer": "S9-06-a", "ref": "Ch9 p29–31"}, {"id": "S9-07", "set": "S", "ch": 9, "q": "To compare the mean task time across three CTA button colors (red, green, blue), which test is appropriate?", "q_th": "ต้องการเปรียบเทียบเวลาทำงานเฉลี่ยของปุ่ม CTA 3 สี (แดง เขียว น้ำเงิน) ควรใช้สถิติใด", "options": [{"id": "S9-07-d0", "t": "Independent samples t-test", "th": "Independent samples t-test", "w": "t-test เปรียบเทียบได้แค่ 2 กลุ่ม"}, {"id": "S9-07-d1", "t": "Chi-square test", "th": "Chi-square test", "w": "ใช้กับข้อมูลความถี่เชิงกลุ่ม"}, {"id": "S9-07-d2", "t": "Linear regression", "th": "Linear regression", "w": "ใช้ทำนายแนวโน้ม ไม่ใช่เปรียบเทียบค่าเฉลี่ยหลายกลุ่ม"}, {"id": "S9-07-a", "t": "One-way ANOVA (F-test)", "th": "One-way ANOVA (F-test)", "w": "ANOVA ใช้เปรียบเทียบค่าเฉลี่ยตั้งแต่ 3 กลุ่ม (1 ตัวแปรอิสระ = สีปุ่ม)"}], "answer": "S9-07-a", "ref": "Ch9 p32"}, {"id": "S9-08", "set": "S", "ch": 9, "q": "In a t-test, a p-value of 0.03 with a significance level of 0.05 means:", "q_th": "ใน t-test ค่า p-value = 0.03 ที่ระดับนัยสำคัญ 0.05 หมายความว่า", "options": [{"id": "S9-08-d0", "t": "There is no significant difference between groups", "th": "ไม่มีความแตกต่างอย่างมีนัยสำคัญระหว่างกลุ่ม", "w": "จะเป็นเช่นนั้นเมื่อ p > 0.05"}, {"id": "S9-08-d1", "t": "The null hypothesis must be accepted", "th": "ต้องยอมรับสมมติฐานหลัก (H₀)", "w": "p < 0.05 จึงปฏิเสธ H₀"}, {"id": "S9-08-a", "t": "The difference is statistically significant", "th": "มีความแตกต่างอย่างมีนัยสำคัญทางสถิติ", "w": "p < 0.05 → แตกต่างอย่างมีนัยสำคัญทางสถิติ (ปฏิเสธ H₀)"}, {"id": "S9-08-d2", "t": "The sample size was too small to compute", "th": "ขนาดกลุ่มตัวอย่างน้อยเกินกว่าจะคำนวณได้", "w": "p-value ไม่ได้บอกเรื่องนี้"}], "answer": "S9-08-a", "ref": "Ch9 p21"}, {"id": "S9-09", "set": "S", "ch": 9, "q": "Which correlation method is suitable for ranked (ordinal) data or data with many outliers?", "q_th": "วิธีหาสหสัมพันธ์แบบใดเหมาะกับข้อมูลเชิงอันดับ (ordinal) หรือข้อมูลที่มี outliers มาก", "options": [{"id": "S9-09-d0", "t": "Pearson correlation", "th": "Pearson correlation", "w": "Pearson เหมาะกับข้อมูลเชิงปริมาณ ความสัมพันธ์เชิงเส้น outliers ไม่มาก"}, {"id": "S9-09-a", "t": "Spearman correlation", "th": "Spearman correlation", "w": "Spearman เหมาะกับข้อมูลอันดับ (ranking) หรือข้อมูลไม่ปกติ/มี outliers มาก"}, {"id": "S9-09-d1", "t": "Paired t-test", "th": "Paired t-test", "w": "ไม่ใช่การวัดความสัมพันธ์"}, {"id": "S9-09-d2", "t": "Two-way ANOVA", "th": "Two-way ANOVA", "w": "เปรียบเทียบค่าเฉลี่ยกับ 2 ตัวแปรอิสระ"}], "answer": "S9-09-a", "ref": "Ch9 p59"}, {"id": "S9-10", "set": "S", "ch": 9, "q": "A team records click vs no-click counts for a green and a red purchase button. Which statistic tests whether button color and clicking are related?", "q_th": "ทีมบันทึกจำนวนคนที่คลิก/ไม่คลิกของปุ่มสั่งซื้อสีเขียวและสีแดง สถิติใดใช้ทดสอบว่าสีปุ่มสัมพันธ์กับการคลิกหรือไม่", "options": [{"id": "S9-10-d0", "t": "One-sample t-test", "th": "One-sample t-test", "w": "ใช้กับค่าเฉลี่ย 1 กลุ่มเทียบค่าเป้าหมาย"}, {"id": "S9-10-d1", "t": "Repeated measures ANOVA", "th": "Repeated measures ANOVA", "w": "ใช้กับกลุ่มเดิมวัดหลายเงื่อนไข"}, {"id": "S9-10-d2", "t": "Logistic regression", "th": "Logistic regression", "w": "เป็นการทำนายความน่าจะเป็น ไม่ใช่เครื่องมือที่สไลด์ใช้ในกรณีนี้"}, {"id": "S9-10-a", "t": "Chi-square test", "th": "Chi-square test", "w": "ข้อมูลเชิงกลุ่ม (คลิก/ไม่คลิก × สี) เปรียบเทียบ observed กับ expected → Chi-square"}], "answer": "S9-10-a", "ref": "Ch9 p55–56"}]}, "H": {"name": "Hard", "questions": [{"id": "H2-01", "set": "H", "ch": 2, "q": "A banking app adds a settings page where users choose to receive only finance and mail notifications. Users now open notifications willingly. Which selective perception process does this design leverage MOST directly?", "q_th": "แอปธนาคารเพิ่มหน้าตั้งค่าให้ผู้ใช้เลือกรับแจ้งเตือนเฉพาะเรื่องการเงินและอีเมล ตอนนี้ผู้ใช้เปิดอ่านแจ้งเตือนอย่างเต็มใจ ดีไซน์นี้ใช้ selective perception แบบใด \"โดยตรงที่สุด\"", "options": [{"id": "H2-01-a", "t": "Selective Exposure", "th": "Selective Exposure", "w": "ผู้ใช้เลือกเปิดรับข้อมูลที่ตนเลือกเอง: Notification Control คือตัวอย่าง Selective Exposure ในสไลด์"}, {"id": "H2-01-d0", "t": "Selective Attention", "th": "Selective Attention", "w": "Attention คือการดึงโฟกัสบนหน้าจอ (contrast, จุดแดง) ไม่ใช่การให้ผู้ใช้เลือกช่องทางรับข้อมูล"}, {"id": "H2-01-d1", "t": "Selective Retention", "th": "Selective Retention", "w": "Retention คือการเลือกจดจำ ไม่ใช่การเลือกรับ"}, {"id": "H2-01-d2", "t": "Selective Comprehension", "th": "Selective Comprehension", "w": "Comprehension คือการตีความข้อความ เช่น error message ที่เข้าใจง่าย"}], "answer": "H2-01-a", "ref": "Ch2 p28–29"}, {"id": "H2-02", "set": "H", "ch": 2, "q": "Users skip a 6-page onboarding tutorial and later forget how to use features. Which redesign BEST fits the course's psychology recommendation?", "q_th": "ผู้ใช้กดข้าม tutorial 6 หน้าตอนเริ่มใช้งาน แล้วลืมวิธีใช้ฟีเจอร์ในภายหลัง การออกแบบใหม่แบบใดตรงกับคำแนะนำเชิงจิตวิทยาของคอร์ส \"มากที่สุด\"", "options": [{"id": "H2-02-d0", "t": "Make the tutorial mandatory so users cannot skip it", "th": "บังคับดู tutorial จนจบ ห้ามกดข้าม", "w": "บังคับดูไม่ได้แก้ปัญหาการจำ และเพิ่ม friction"}, {"id": "H2-02-d1", "t": "Add more animations to make the tutorial pages memorable", "th": "เพิ่มแอนิเมชันให้หน้า tutorial น่าจดจำขึ้น", "w": "ยังเป็น tutorial ยาวตอนเริ่ม ผู้ใช้ยังลืมเมื่อถึงเวลาใช้จริง"}, {"id": "H2-02-a", "t": "Show contextual hints when each feature is needed", "th": "แสดง contextual hints ตอนที่ต้องใช้ฟีเจอร์นั้น", "w": "สมองเก็บความจำเฉพาะตอนต้องใช้จริง → สไลด์แนะนำ Contextual Hints"}, {"id": "H2-02-d2", "t": "Move all tutorial content into a long FAQ page", "th": "ย้ายเนื้อหา tutorial ทั้งหมดไปไว้ในหน้า FAQ ยาว ๆ", "w": "ผู้ใช้ต้องไปหาเอง ไม่ตรงจังหวะที่ต้องการ"}], "answer": "H2-02-a", "ref": "Ch2 p33–35"}, {"id": "H2-03", "set": "H", "ch": 2, "q": "A pop-up advertisement has a close (X) button that is pale and blends into the background, so many users tap the ad instead. Which dark pattern BEST describes this?", "q_th": "โฆษณาป๊อปอัปมีปุ่มปิด (X) สีซีดกลืนไปกับพื้นหลัง ทำให้ผู้ใช้จำนวนมากกดโดนโฆษณาแทน dark pattern ใดอธิบายได้ \"ดีที่สุด\"", "options": [{"id": "H2-03-d0", "t": "Disguised Advertisement", "th": "Disguised Advertisement", "w": "Disguised Ad คือโฆษณาที่ปลอมเป็นเนื้อหา แต่กรณีนี้โฆษณาชัดเจน ปัญหาอยู่ที่ปุ่มปิดถูกซ่อน"}, {"id": "H2-03-d1", "t": "Nagging", "th": "Nagging", "w": "Nagging คือการรบกวนซ้ำ ๆ จนยอม"}, {"id": "H2-03-d2", "t": "Bait & Switch", "th": "Bait & Switch", "w": "Bait & Switch คือสัญญาข้อเสนอหนึ่งแต่ให้อีกอย่าง"}, {"id": "H2-03-a", "t": "Interface Interference", "th": "Interface Interference", "w": "สไลด์ระบุ Hidden Close Button/Misdirection ไว้ใต้ Interface Interference"}], "answer": "H2-03-a", "ref": "Ch2 p17"}, {"id": "H2-04", "set": "H", "ch": 2, "q": "A team notices that the more steps a sign-up form has, the longer users take and the more likely they quit. They add autofill, split the form into short pages, and remove optional fields such as title and gender. Which law is the team MAINLY applying?", "q_th": "ทีมสังเกตว่ายิ่งฟอร์มสมัครมีขั้นตอนเยอะ ผู้ใช้ยิ่งใช้เวลานานและเลิกกลางคัน จึงเพิ่ม autofill แบ่งฟอร์มเป็นหน้าสั้น ๆ และตัดฟิลด์ที่ไม่จำเป็นเช่นคำนำหน้าชื่อและเพศ ทีมกำลังใช้กฎใด \"เป็นหลัก\"", "options": [{"id": "H2-04-d0", "t": "Tesler's Law", "th": "Tesler's Law", "w": "Tesler เน้นย้ายความซับซ้อนที่จำเป็นไปให้ระบบ แต่เหตุผลในโจทย์คือเวลา/จำนวนขั้นตอน"}, {"id": "H2-04-a", "t": "Parkinson's Law", "th": "Parkinson's Law", "w": "สไลด์ Parkinson: ขั้นตอนเยอะ ผู้ใช้ใช้เวลานานและเลิกทำ → Autofill, แบ่งหน้าจอ, ตัดฟิลด์ไม่จำเป็น (ตรงตามสไลด์)"}, {"id": "H2-04-d1", "t": "Fitts's Law", "th": "Fitts's Law", "w": "ไม่เกี่ยวกับขนาดหรือระยะของปุ่ม"}, {"id": "H2-04-d2", "t": "Jakob's Law", "th": "Jakob's Law", "w": "ไม่เกี่ยวกับความคุ้นเคยกับเว็บอื่น"}], "answer": "H2-04-a", "ref": "Ch2 p64"}, {"id": "H2-05", "set": "H", "ch": 2, "q": "In a settings list where every item has the same font and color, the designer makes \"Delete all data\" stand out ONLY by surrounding it wit
