h extra white space. Which isolation method is this?", "q_th": "ในรายการตั้งค่าที่ทุกรายการใช้ฟอนต์และสีเดียวกัน ดีไซเนอร์ทำให้ \"ลบข้อมูลทั้งหมด\" โดดเด่น \"เพียงแค่\" เว้นพื้นที่ว่างรอบ ๆ มากขึ้น นี่คือ isolation วิธีใด", "options": [{"id": "H2-05-a", "t": "Spatial isolation", "th": "Spatial isolation", "w": "ใช้พื้นที่ว่าง/ระยะห่างทำให้เด่น = Spatial Isolation"}, {"id": "H2-05-d0", "t": "Perceptual isolation", "th": "Perceptual isolation", "w": "Perceptual ใช้ความต่างทางกายภาพ เช่น สี ขนาด ซึ่งโจทย์ไม่ได้เปลี่ยน"}, {"id": "H2-05-d1", "t": "Conceptual/Semantic isolation", "th": "Conceptual/Semantic isolation", "w": "Semantic คือความหมายต่าง แต่โจทย์ระบุว่าใช้แค่ white space"}, {"id": "H2-05-d2", "t": "Sequential isolation", "th": "Sequential isolation", "w": "Sequential คือเหตุการณ์ผิดจังหวะเวลา"}], "answer": "H2-05-a", "ref": "Ch2 p79"}, {"id": "H2-06", "set": "H", "ch": 2, "q": "Weights: Ease of use = 4, Speed = 5, Space = 4. Raw scores (Ease, Speed, Space): X = (3, 5, 4), Y = (5, 4, 3), Z = (4, 4, 4). Using the course's decision matrix, which option should be chosen?", "q_th": "น้ำหนัก: ใช้ง่าย = 4, ความเร็ว = 5, พื้นที่ = 4 คะแนนดิบ (ใช้ง่าย, ความเร็ว, พื้นที่): X = (3, 5, 4), Y = (5, 4, 3), Z = (4, 4, 4) ตาม decision matrix ของคอร์ส ควรเลือกตัวเลือกใด", "options": [{"id": "H2-06-d0", "t": "Option Y, with a weighted total of 52", "th": "ตัวเลือก Y ได้คะแนนถ่วงน้ำหนักรวม 52", "w": "คำนวณถูกแต่ได้ 52 น้อยกว่า X"}, {"id": "H2-06-d1", "t": "Option Z, with a weighted total of 52", "th": "ตัวเลือก Z ได้คะแนนถ่วงน้ำหนักรวม 52", "w": "Z ได้ 52 น้อยกว่า X"}, {"id": "H2-06-a", "t": "Option X, with a weighted total of 53", "th": "ตัวเลือก X ได้คะแนนถ่วงน้ำหนักรวม 53", "w": "X = 3×4+5×5+4×4 = 12+25+16 = 53 สูงสุด (Y = 20+20+12 = 52, Z = 16+20+16 = 52)"}, {"id": "H2-06-d2", "t": "No choice, all three tie at 12 raw points", "th": "เลือกไม่ได้ เพราะทั้งสามเสมอกันที่ 12 คะแนนดิบ", "w": "ลืมคูณน้ำหนัก (W × S) ซึ่งเป็นหัวใจของ decision matrix"}], "answer": "H2-06-a", "ref": "Ch2 p73–74"}, {"id": "H2-07", "set": "H", "ch": 2, "q": "A button looks grey and disabled, but it actually works when users tap it. Which affordance type is this?", "q_th": "ปุ่มหนึ่งดูเป็นสีเทาเหมือนกดไม่ได้ แต่จริง ๆ กดใช้งานได้ เป็น affordance ประเภทใด", "options": [{"id": "H2-07-d0", "t": "False affordance", "th": "False affordance", "w": "False คือดูเหมือนทำสิ่งหนึ่งได้แต่จริง ๆ เป็นอีกการกระทำ/กดไม่ได้"}, {"id": "H2-07-a", "t": "Negative affordance", "th": "Negative affordance", "w": "สไลด์: Negative Affordance = ดูเหมือน inactive แต่จริง ๆ active"}, {"id": "H2-07-d1", "t": "Hidden affordance", "th": "Hidden affordance", "w": "Hidden คือโผล่เฉพาะเมื่อผู้ใช้ต้องการ เช่น hover"}, {"id": "H2-07-d2", "t": "Pattern affordance", "th": "Pattern affordance", "w": "Pattern คือรูปแบบที่คุ้นเคยตามธรรมเนียม"}], "answer": "H2-07-a", "ref": "Ch2 p39"}, {"id": "H2-08", "set": "H", "ch": 2, "q": "A new system's onboarding explicitly compares each screen with the old system so users can connect new knowledge with what they already know. This design intentionally supports which load?", "q_th": "Onboarding ของระบบใหม่เปรียบเทียบแต่ละหน้าจอกับระบบเก่าอย่างชัดเจน เพื่อให้ผู้ใช้เชื่อมความรู้ใหม่กับสิ่งที่รู้อยู่แล้ว ดีไซน์นี้ตั้งใจส่งเสริม load ประเภทใด", "options": [{"id": "H2-08-a", "t": "Germane load", "th": "Germane load", "w": "Germane: ความพยายามจัดระเบียบและเชื่อมความรู้ใหม่กับเดิม (ตัวอย่าง ระบบเดิมกับระบบใหม่)"}, {"id": "H2-08-d0", "t": "Intrinsic load", "th": "Intrinsic load", "w": "Intrinsic คือความยากในตัวงาน ออกแบบเปลี่ยนไม่ได้โดยตรง"}, {"id": "H2-08-d1", "t": "Extraneous load", "th": "Extraneous load", "w": "Extraneous เป็นภาระส่วนเกินที่ต้องลด ไม่ใช่สิ่งที่ตั้งใจเพิ่ม"}, {"id": "H2-08-d2", "t": "Cognitive overload", "th": "Cognitive overload", "w": "Overload คือภาวะข้อมูลมากเกินซึ่งต้องป้องกัน"}], "answer": "H2-08-a", "ref": "Ch2 p41"}, {"id": "H2-09", "set": "H", "ch": 2, "q": "A SaaS pricing page shows five plans. The team wants users to remember both the cheapest plan and the recommended best-value plan. Based on the Serial Position Effect as taught, how should these be placed?", "q_th": "หน้าราคาของ SaaS แสดง 5 แพ็กเกจ ทีมอยากให้ผู้ใช้จำได้ทั้งแพ็กเกจถูกที่สุดและแพ็กเกจแนะนำที่คุ้มที่สุด ตาม Serial Position Effect ที่สอน ควรวางอย่างไร", "options": [{"id": "H2-09-d0", "t": "Both plans in the middle of the row", "th": "วางทั้งสองแพ็กเกจไว้ตรงกลางแถว", "w": "ตรงกลางคือส่วนที่ลืมง่ายที่สุด"}, {"id": "H2-09-d1", "t": "Recommended plan in the middle, cheapest plan last", "th": "แพ็กเกจแนะนำไว้ตรงกลาง แพ็กเกจถูกที่สุดไว้ท้าย", "w": "ตำแหน่งกลางลืมง่าย ขัดกับสไลด์"}, {"id": "H2-09-a", "t": "Cheapest plan first, recommended plan last", "th": "แพ็กเกจถูกที่สุดไว้แรก แพ็กเกจแนะนำไว้ท้ายสุด", "w": "สไลด์: มักวางแพ็กเกจถูกสุดไว้ตัวแรก และคุ้มค่า/แนะนำที่สุดไว้ตัวสุดท้าย"}, {"id": "H2-09-d2", "t": "Random order each visit so no plan is favored", "th": "สุ่มลำดับทุกครั้งที่เข้าเว็บเพื่อไม่ให้เอนเอียง", "w": "ทำให้ใช้ประโยชน์จาก primacy/recency ไม่ได้"}], "answer": "H2-09-a", "ref": "Ch2 p77"}, {"id": "H2-10", "set": "H", "ch": 2, "q": "Users drag files to a trash icon expecting them to be deleted, but the system only archives them, causing confusion. What is the BEST explanation?", "q_th": "ผู้ใช้ลากไฟล์ไปที่ไอคอนถังขยะโดยคาดว่าไฟล์จะถูกลบ แต่ระบบแค่เก็บถาวร (archive) ทำให้สับสน คำอธิบายใด \"ดีที่สุด\"", "options": [{"id": "H2-10-d0", "t": "The user and system models match, so it is purely a Hick's Law problem", "th": "user model กับ system model ตรงกัน จึงเป็นปัญหา Hick's Law ล้วน ๆ", "w": "สองโมเดลไม่ตรงกัน และไม่เกี่ยวกับจำนวนตัวเลือก"}, {"id": "H2-10-d1", "t": "The icon creates a germane load that helps learning", "th": "ไอคอนสร้าง germane load ที่ช่วยการเรียนรู้", "w": "ความสับสนไม่ใช่ภาระที่เป็นประโยชน์"}, {"id": "H2-10-a", "t": "A user-model vs system-model gap that the UI failed to bridge", "th": "ช่องว่างระหว่าง user model กับ system model ที่ UI เชื่อมไม่สำเร็จ", "w": "ผู้ใช้คาดหวังอย่างหนึ่ง (User model) ระบบทำอีกอย่าง (System model) และ UI ไม่ได้เชื่อมช่องว่าง"}, {"id": "H2-10-d2", "t": "It is selective retention, because users forget the archive feature", "th": "เป็น selective retention เพราะผู้ใช้ลืมฟีเจอร์ archive", "w": "ปัญหาคือความคาดหวังผิดตั้งแต่ต้น ไม่ใช่การลืม"}], "answer": "H2-10-a", "ref": "Ch2 p71"}, {"id": "H3-01", "set": "H", "ch": 3, "q": "Which problem statement BEST follows all the course guidelines (user, problem, evidence, impact, no solution)?", "q_th": "problem statement ใดทำตามแนวทางของคอร์สครบที่สุด (มีผู้ใช้ ปัญหา หลักฐาน ผลกระทบ และไม่มี solution)", "options": [{"id": "H3-01-a", "t": "At lunch, office workers spend 8+ min comparing promos; 40% order late or pay full price", "th": "ช่วงพักเที่ยง พนักงานออฟฟิศใช้เวลา 8 นาทีขึ้นไปเทียบโปรโมชัน 40% สั่งช้าหรือจ่ายราคาเต็ม", "w": "มีผู้ใช้ ปัญหา ตัวเลขยืนยัน และผลกระทบ โดยไม่ระบุวิธีแก้"}, {"id": "H3-01-d0", "t": "Office workers on lunch break need a promotion filter in the app so they can compare deals faster", "th": "พนักงานออฟฟิศช่วงพักเที่ยงต้องการตัวกรองโปรโมชันในแอปเพื่อเทียบดีลได้เร็วขึ้น", "w": "ใส่ solution (filter) ซึ่งสไลด์ห้าม"}, {"id": "H3-01-d1", "t": "The food app is confusing and many users are generally not happy with it at all", "th": "แอปสั่งอาหารสับสน และผู้ใช้จำนวนมากไม่ค่อยพอใจกับมันเลย", "w": "ไม่มีกลุ่มผู้ใช้ชัดเจนและไม่มีข้อมูล/ตัวเลข"}, {"id": "H3-01-d2", "t": "Add a 'best deal' badge on every menu item to cut comparison time for office workers by 50%", "th": "เพิ่มป้าย 'ดีลที่ดีที่สุด' ทุกเมนูเพื่อลดเวลาเปรียบเทียบของพนักงานออฟฟิศลง 50%", "w": "เป็นทางออก ไม่ใช่ปัญหา"}], "answer": "H3-01-a", "ref": "Ch3 p3–8"}, {"id": "H3-02", "set": "H", "ch": 3, "q": "Under deadline pressure, a team skips research and builds personas from a brainstorming session. What is the MAIN risk according to the course?", "q_th": "เพราะเดดไลน์บีบ ทีมข้ามการทำวิจัยแล้วสร้าง persona จากการระดมสมอง ความเสี่ยง \"หลัก\" ตามที่คอร์สสอนคืออะไร", "options": [{"id": "H3-02-d0", "t": "The personas will be too detailed to be useful", "th": "persona จะละเอียดเกินกว่าจะใช้งานได้", "w": "ปัญหาไม่ใช่ความละเอียด แต่คือไม่มีฐานข้อมูลจริง"}, {"id": "H3-02-d1", "t": "Personas always require ethics Full Board approval", "th": "persona ต้องผ่านการพิจารณาจริยธรรมแบบ Full Board เสมอ", "w": "ไม่ได้ระบุในคอร์ส"}, {"id": "H3-02-a", "t": "The personas lack real data, so designs may miss true pain points", "th": "persona ไม่ได้มาจากข้อมูลจริง ดีไซน์จึงอาจพลาด pain point ที่แท้จริง", "w": "persona ต้องเป็นบุคคลสมมุติที่อ้างอิงข้อมูลจริง ผ่าน Data Gathering → Analysis → Creation"}, {"id": "H3-02-d2", "t": "The team will need to calculate NPS before using them", "th": "ทีมต้องคำนวณ NPS ก่อนใช้ persona", "w": "NPS ไม่ใช่ขั้นตอนของการสร้าง persona"}], "answer": "H3-02-a", "ref": "Ch3 p14, p17"}, {"id": "H3-03", "set": "H", "ch": 3, "q": "Users say a shopping app \"looks clean and trustworthy\", but they complain checkout takes too many taps and they would not recommend it to friends. Which analysis is MOST accurate?", "q_th": "ผู้ใช้บอกว่าแอปช้อปปิ้ง \"ดูสะอาดตาและน่าเชื่อถือ\" แต่บ่นว่า checkout ต้องกดหลายครั้งเกินไป และจะไม่แนะนำให้เพื่อน การวิเคราะห์ใดแม่นยำที่สุด", "options": [{"id": "H3-03-d0", "t": "Behavioral level is satisfied, but Visceral is weak", "th": "ระดับ Behavioral ผ่าน แต่ Visceral ยังอ่อน", "w": "ผู้ใช้ชมหน้าตา แปลว่า Visceral ดี และบ่นเรื่องการใช้งาน"}, {"id": "H3-03-d1", "t": "All three emotional levels are satisfied", "th": "ผ่านครบทั้งสามระดับอารมณ์", "w": "มีคำบ่นเรื่องการใช้งานและไม่แนะนำต่อ"}, {"id": "H3-03-d2", "t": "Only the Reflective level matters, so the other complaints can be ignored", "th": "สำคัญแค่ระดับ Reflective จึงไม่ต้องสนใจคำบ่นอื่น", "w": "ทุกระดับมีผลต่อประสบการณ์"}, {"id": "H3-03-a", "t": "Visceral level is satisfied, but Behavioral and Reflective levels are weak", "th": "ระดับ Visceral ผ่าน แต่ระดับ Behavioral และ Reflective ยังอ่อน", "w": "ความประทับใจแรกเห็นดี (Visceral) แต่ตอนใช้งานแย่ (Behavioral) และไม่ภูมิใจ/ไม่แนะนำต่อ (Reflective)"}], "answer": "H3-03-a", "ref": "Ch3 p29"}, {"id": "H3-04", "set": "H", "ch": 3, "q": "Users must sign up before viewing product details, and refunds are only given as vouchers. Which pain point category is this, and which method does the course pair with it?", "q_th": "ผู้ใช้ต้องสมัครสมาชิกก่อนจึงดูรายละเอียดสินค้าได้ และคืนเงินเป็น voucher เท่านั้น นี่คือ pain point หมวดใด และคอร์สจับคู่กับวิธีใด", "options": [{"id": "H3-04-d0", "t": "Support pain point; add an FAQ page", "th": "Support pain point; เพิ่มหน้า FAQ", "w": "Support คือข้อมูล/ช่องทางช่วยเหลือไม่ชัด"}, {"id": "H3-04-a", "t": "Process pain point; use scenarios and task analysis", "th": "Process pain point; ใช้ scenario และ task analysis", "w": "สไลด์ Process: บังคับ sign up, คืนเงินยาก → สิ่งที่ช่วยได้คือ scenario และ task analysis"}, {"id": "H3-04-d1", "t": "Design pain point; increase color contrast", "th": "Design pain point; เพิ่ม contrast ของสี", "w": "Design คือหน้าตา/การจัดวาง"}, {"id": "H3-04-d2", "t": "Productivity pain point; upgrade the office computers", "th": "Productivity pain point; อัปเกรดคอมพิวเตอร์ในออฟฟิศ", "w": "Productivity คือเสียเวลา ระบบช้า กรอกซ้ำ"}], "answer": "H3-04-a", "ref": "Ch3 p32"}, {"id": "H3-05", "set": "H", "ch": 3, "q": "\"Nok, a 4th-year engineering student (A), opens the app at 7:50 a.m. because her class was moved (B), while standing on a crowded train (C).\" Map A, B and C to the scenario elements.", "q_th": "\"นก นักศึกษาวิศวะปี 4 (A) เปิดแอปตอน 7:50 น. เพราะคลาสถูกย้ายห้อง (B) ขณะยืนอยู่บนรถไฟฟ้าที่คนแน่น (C)\" จงจับคู่ A, B, C กับองค์ประกอบของ scenario", "options": [{"id": "H3-05-d0", "t": "A = Actor, B = Environment, C = Trigger", "th": "A = Actor, B = Environment, C = Trigger", "w": "สลับ Trigger กับ Environment"}, {"id": "H3-05-d1", "t": "A = Persona goal, B = Trigger, C = Action", "th": "A = Persona goal, B = Trigger, C = Action", "w": "Nok คือ Actor ไม่ใช่ goal และรถไฟคือ Environment"}, {"id": "H3-05-a", "t": "A = Actor, B = Trigger, C = Environment", "th": "A = Actor, B = Trigger, C = Environment", "w": "Actor สอดคล้อง persona, Trigger เหตุที่ทำให้เข้ามาใช้, Environment บริบทขณะใช้"}, {"id": "H3-05-d2", "t": "A = Trigger, B = Actor, C = Environment", "th": "A = Trigger, B = Actor, C = Environment", "w": "คนคือ Actor ส่วนเหตุการณ์คือ Trigger"}], "answer": "H3-05-a", "ref": "Ch3 p25"}, {"id": "H3-06", "set": "H", "ch": 3, "q": "A user already knows that budgeting apps exist and is now comparing three of them by reading reviews. What should the design emphasize at this stage?", "q_th": "ผู้ใช้รู้อยู่แล้วว่ามีแอปจัดการงบประมาณ และกำลังเปรียบเทียบ 3 แอปด้วยการอ่านรีวิว ดีไซน์ควรเน้นอะไรในขั้นนี้", "options": [{"id": "H3-06-d0", "t": "Education that helps the user realize they have a problem", "th": "ให้ความรู้เพื่อให้ผู้ใช้ตระหนักว่าตนมีปัญหา", "w": "นั่นคือ Awareness ซึ่งผู้ใช้ผ่านมาแล้ว"}, {"id": "H3-06-d1", "t": "A loyalty program for long-term retention", "th": "โปรแกรมสะสมแต้มเพื่อ retention ระยะยาว", "w": "ยังไม่ถึงขั้นหลังใช้งาน"}, {"id": "H3-06-d2", "t": "Error messages for the unhappy path", "th": "ข้อความ error สำหรับ unhappy path", "w": "ไม่เกี่ยวกับขั้น Consideration"}, {"id": "H3-06-a", "t": "Highlights, reviews and info that support the decision", "th": "จุดเด่น รีวิว และข้อมูลที่ช่วยการตัดสินใจ", "w": "นี่คือ Consideration: ต้องนำเสนอจุดเด่น รีวิว ข้อมูลสนับสนุนการตัดสินใจ"}], "answer": "H3-06-a", "ref": "Ch3 p27"}, {"id": "H3-07", "set": "H", "ch": 3, "q": "A team has finished interviews and has synthesized users' pain points, goals and behaviors. What is the NEXT step in the course's persona process?", "q_th": "ทีมสัมภาษณ์เสร็จแล้ว และสรุป pain points, goals และ behaviors ของผู้ใช้เรียบร้อย ขั้น \"ถัดไป\" ใน persona process ของคอร์สคืออะไร", "options": [{"id": "H3-07-d0", "t": "Run more surveys, because data gathering should always come last", "th": "ทำแบบสำรวจเพิ่ม เพราะ data gathering ควรทำเป็นขั้นสุดท้ายเสมอ", "w": "Data Gathering มาก่อน ไม่ใช่ขั้นสุดท้าย"}, {"id": "H3-07-d1", "t": "Go directly to high-fidelity wireframes and skip the persona", "th": "ไปทำ high-fidelity wireframe เลยโดยข้าม persona", "w": "ข้ามการสร้าง persona"}, {"id": "H3-07-a", "t": "Persona Creation (details, personality, needs, pain points, behavior)", "th": "Persona Creation (รายละเอียด บุคลิก ความต้องการ pain points พฤติกรรม)", "w": "ลำดับ Data Gathering → Analysis & Synthesis → Persona Creation"}, {"id": "H3-07-d2", "t": "Calculate the Customer Effort Score", "th": "คำนวณ Customer Effort Score", "w": "CES เป็นการวัดผลหลังมีระบบ"}], "answer": "H3-07-a", "ref": "Ch3 p17"}, {"id": "H3-08", "set": "H", "ch": 3, "q": "Returning customers must repeat the same four steps every time they reorder their usual meal. Which Idea/Impact approach from the course MOST directly targets this?", "q_th": "ลูกค้าประจำต้องกดซ้ำ 4 ขั้นตอนเดิมทุกครั้งที่สั่งเมนูประจำ แนวทาง Idea/Impact ใดของคอร์สแก้ตรงจุดที่สุด", "options": [{"id": "H3-08-a", "t": "Frictionless flow: cut repeated or unnecessary steps", "th": "Frictionless flow: ตัดขั้นตอนที่ซ้ำหรือไม่จำเป็น", "w": "Frictionless Flow = ย่อขั้นตอน ลดการทำซ้ำ ให้สำเร็จง่ายและเร็วที่สุด"}, {"id": "H3-08-d0", "t": "Micro-interactions: animate the buttons on hover", "th": "Micro-interactions: ทำแอนิเมชันปุ่มตอน hover", "w": "ช่วยเรื่อง feedback แต่ไม่ลดขั้นตอนซ้ำ"}, {"id": "H3-08-d1", "t": "Accessibility: support screen readers for all groups", "th": "Accessibility: รองรับ screen reader สำหรับทุกกลุ่ม", "w": "สำคัญแต่ไม่ตรงปัญหาการทำซ้ำ"}, {"id": "H3-08-d2", "t": "Visceral design: change the brand colors", "th": "Visceral design: เปลี่ยนสีแบรนด์", "w": "ไม่ใช่ Idea/Impact ที่แก้ปัญหานี้"}], "answer": "H3-08-a", "ref": "Ch3 p36"}, {"id": "H3-09", "set": "H", "ch": 3, "q": "A team has 12 interview transcripts and wants to summarize qualitative insights about what users think, feel, say and do before defining the persona. Which tool fits BEST?", "q_th": "ทีมมีบทสัมภาษณ์ 12 ชุด และอยากสรุป insight เชิงคุณภาพว่าผู้ใช้คิด รู้สึก พูด และทำอะไร ก่อนกำหนด persona เครื่องมือใดเหมาะที่สุด", "options": [{"id": "H3-09-d0", "t": "Usability test", "th": "Usability test", "w": "ใช้ทดสอบกับระบบ ไม่ใช่สังเคราะห์ข้อมูลสัมภาษณ์"}, {"id": "H3-09-d1", "t": "Decision matrix", "th": "Decision matrix", "w": "ใช้ให้น้ำหนักเลือกทางเลือก"}, {"id": "H3-09-a", "t": "Empathy Map", "th": "Empathy Map", "w": "Empathy Map สรุปข้อมูลเชิงคุณภาพ Think/Feel/Say/Does เพื่อเข้าใจผู้ใช้อย่างลึกซึ้ง"}, {"id": "H3-09-d2", "t": "Customer journey task analysis", "th": "Customer journey task analysis", "w": "เหมาะกับลำดับขั้นตอน/งาน ไม่ใช่สรุปความคิดความรู้สึก"}], "answer": "H3-09-a", "ref": "Ch3 p34"}, {"id": "H3-10", "set": "H", "ch": 3, "q": "\"Elderly users aged 65+ have trouble ordering food online because the text is small and payment is complex, so they cannot order by themselves.\" Using 5W1H, which element is MISSING?", "q_th": "\"ผู้สูงอายุ 65 ปีขึ้นไปมีปัญหาในการสั่งอาหารออนไลน์ เพราะตัวหนังสือเล็กและขั้นตอนจ่ายเงินซับซ้อน จึงสั่งเองไม่ได้\" ตาม 5W1H องค์ประกอบใด \"ขาด\" ไป", "options": [{"id": "H3-10-d0", "t": "Who", "th": "Who", "w": "ระบุแล้ว: ผู้สูงอายุ 65 ปีขึ้นไป"}, {"id": "H3-10-d1", "t": "What", "th": "What", "w": "ระบุแล้ว: ตัวหนังสือเล็ก ขั้นตอนจ่ายเงินซับซ้อน"}, {"id": "H3-10-a", "t": "When", "th": "When", "w": "มี Who (65+), What (ตัวหนังสือเล็ก/จ่ายเงินซับซ้อน), Where (ขั้นตอนสั่ง/จ่าย), Why/impact แต่ไม่มี When"}, {"id": "H3-10-d2", "t": "Why", "th": "Why", "w": "ระบุแล้ว: สั่งอาหารเองไม่ได้"}], "answer": "H3-10-a", "ref": "Ch3 p5, p7"}, {"id": "H4-01", "set": "H", "ch": 4, "q": "A researcher believes an anonymous online satisfaction survey is exempt, so she starts collecting data now and plans to submit the protocol afterwards. What is the BEST evaluation?", "q_th": "นักวิจัยเชื่อว่าแบบสอบถามความพึงพอใจออนไลน์แบบไม่ระบุตัวตนเข้าข่ายยกเว้น (exempt) จึงเริ่มเก็บข้อมูลทันทีและวางแผนยื่นโครงร่างทีหลัง การประเมินใด \"ดีที่สุด\"", "options": [{"id": "H4-01-d0", "t": "Correct: exempt studies never need to be submitted to anyone", "th": "ถูกต้อง: งานที่ exempt ไม่ต้องยื่นให้ใครเลย", "w": "ผิด: Exemption ยังต้องส่งให้กรรมการพิจารณา"}, {"id": "H4-01-d1", "t": "Correct, as long as she submits within 3 months after collecting", "th": "ถูกต้อง ตราบใดที่ยื่นภายใน 3 เดือนหลังเก็บข้อมูล", "w": "ขอย้อนหลังไม่ได้"}, {"id": "H4-01-a", "t": "Incorrect: exempt studies must still be approved first, never retroactively", "th": "ไม่ถูกต้อง: งานที่ exempt ก็ต้องได้รับอนุมัติก่อน และขอย้อนหลังไม่ได้", "w": "นักวิจัยยกเว้นตัวเองไม่ได้ ต้องยื่นโครงร่างก่อน และขอรับรองย้อนหลังไม่ได้"}, {"id": "H4-01-d2", "t": "Incorrect only because every survey always needs Full Board review", "th": "ไม่ถูกต้อง เพียงเพราะแบบสอบถามทุกชนิดต้องใช้ Full Board เสมอ", "w": "แบบสอบถามไม่ระบุตัวตนความเสี่ยงต่ำ ไม่จำเป็นต้อง Full Board"}], "answer": "H4-01-a", "ref": "Ch4 p5, p9"}, {"id": "H4-02", "set": "H", "ch": 4, "q": "A social scientist counts how many people throw waste into recycling bins at a train station, without identifying anyone, because approaching them would change their behavior. What is the MOST appropriate consent approach?", "q_th": "นักสังคมศาสตร์นับจำนวนคนที่ทิ้งขยะลงถังรีไซเคิลที่สถานีรถไฟฟ้า โดยไม่ระบุตัวบุคคล เพราะถ้าเข้าไปขอก่อนพฤติกรรมจะเปลี่ยน วิธีจัดการความยินยอมใดเหมาะสมที่สุด", "options": [{"id": "H4-02-d0", "t": "Skip consent; public observation never involves ethics", "th": "ไม่ต้องขอความยินยอม เพราะการสังเกตในที่สาธารณะไม่เกี่ยวกับจริยธรรม", "w": "ยังต้องได้รับอนุมัติจากกรรมการ ไม่ใช่ทำโดยพละการ"}, {"id": "H4-02-a", "t": "Request a waiver of consent from the ethics committee", "th": "ขอ waiver of consent จากคณะกรรมการจริยธรรม", "w": "ตัวอย่างตรงจากสไลด์ Waive Consent: สังเกตในที่สาธารณะ ไม่ระบุตัว และการขอก่อนจะเปลี่ยนพฤติกรรม ต้องผ่านกรรมการ"}, {"id": "H4-02-d1", "t": "Get written consent from every person before they throw waste", "th": "ขอใบยินยอมเป็นลายลักษณ์อักษรจากทุกคนก่อนทิ้งขยะ", "w": "ทำให้พฤติกรรมเปลี่ยนและไม่สมเหตุสมผล"}, {"id": "H4-02-d2", "t": "Use consent by action by asking them to fill a form", "th": "ใช้ consent by action โดยขอให้กรอกแบบฟอร์ม", "w": "ต้องเข้าไปติดต่อ ซึ่งเปลี่ยนพฤติกรรม"}], "answer": "H4-02-a", "ref": "Ch4 p103"}, {"id": "H4-03", "set": "H", "ch": 4, "q": "A UX team wants to test a health app with residents aged 75+ in a nursing home. Which plan BEST follows the course?", "q_th": "ทีม UX ต้องการทดสอบแอปสุขภาพกับผู้สูงอายุ 75 ปีขึ้นไปในสถานดูแลผู้สูงอายุ แผนใดทำตามคอร์สได้ดีที่สุด", "options": [{"id": "H4-03-d0", "t": "Request an exemption, because usability testing is low risk", "th": "ขอ exempt เพราะ usability testing ความเสี่ยงต่ำ", "w": "กลุ่มเปราะบางห้ามขอ Exempt"}, {"id": "H4-03-a", "t": "No exemption; large-print plain-language documents; short sessions", "th": "ไม่ขอ exempt; ใช้เอกสารตัวหนังสือใหญ่ ภาษาง่าย; แต่ละครั้งใช้เวลาสั้น", "w": "ผู้สูงอายุในสถานดูแลเป็นกลุ่มเปราะบาง (ห้ามขอ Exempt) และสไลด์แนะนำตัวหนังสือใหญ่ คำง่าย ไม่นานเกินไป"}, {"id": "H4-03-d1", "t": "Run one long 3-hour session to reduce travel for the residents", "th": "ทดสอบรวดเดียว 3 ชั่วโมงเพื่อลดการเดินทางของผู้สูงอายุ", "w": "ขัดกับคำแนะนำให้ไม่ติดต่อนานต่อครั้ง"}, {"id": "H4-03-d2", "t": "Ask the nursing home manager to consent for all residents", "th": "ให้ผู้จัดการสถานดูแลให้ความยินยอมแทนผู้สูงอายุทุกคน", "w": "ผู้สูงอายุที่ตัดสินใจได้ต้องให้ความยินยอมเอง และผู้จัดการมีอำนาจเหนือ"}], "answer": "H4-03-a", "ref": "Ch4 p11, p38"}, {"id": "H4-04", "set": "H", "ch": 4, "q": "A lecturer wants to recruit students from her own class for a usability study. How should she reduce undue influence?", "q_th": "อาจารย์ต้องการชวนนักศึกษาในคลาสของตนเองมาร่วม usability study ควรลดอิทธิพลที่ไม่เหมาะสมอย่างไร", "options": [{"id": "H4-04-d0", "t": "Offer bonus course grades to students who join", "th": "ให้คะแนนพิเศษกับนักศึกษาที่เข้าร่วม", "w": "เป็นสิ่งจูงใจเกินเหตุ เพิ่มการชักจูง"}, {"id": "H4-04-d1", "t": "Personally explain it in class and collect signatures immediately", "th": "อธิบายเองในห้องเรียนแล้วเก็บลายเซ็นทันที", "w": "ยังมีอิทธิพลจากผู้มีอำนาจ (Deferential vulnerability)"}, {"id": "H4-04-d2", "t": "Skip consent because students are adults", "th": "ไม่ต้องขอความยินยอมเพราะนักศึกษาเป็นผู้ใหญ่แล้ว", "w": "ผู้ใหญ่ก็ต้องให้ความยินยอมโดยสมัครใจ"}, {"id": "H4-04-a", "t": "Have a neutral third party explain the study and obtain consent", "th": "ให้บุคคลที่สามที่เป็นกลางชี้แจงงานวิจัยและขอความยินยอม", "w": "สไลด์: ผู้ขอความยินยอมต้องไม่มีความสัมพันธ์เชิงอำนาจ ให้บุคคลที่ 3 ชี้แจงแทน"}], "answer": "H4-04-a", "ref": "Ch4 p32, p44"}, {"id": "H4-05", "set": "H", "ch": 4, "q": "A participant who cannot read or write wants to join a low-risk study. How should consent be handled?", "q_th": "ผู้เข้าร่วมที่อ่านเขียนไม่ได้ต้องการเข้าร่วมงานวิจัยความเสี่ยงต่ำ ควรจัดการความยินยอมอย่างไร", "options": [{"id": "H4-05-a", "t": "Fingerprint or verbal consent plus one impartial witness", "th": "ใช้ลายนิ้วมือหรือยินยอมด้วยวาจา พร้อมพยานที่เป็นกลาง 1 คน", "w": "สไลด์: ใช้ลายนิ้วมือ/ยินยอมด้วยวาจา และมีพยานที่เป็นกลาง 1 คนลงนาม"}, {"id": "H4-05-d0", "t": "Exclude the participant because a signature is impossible", "th": "คัดออก เพราะลงลายมือชื่อไม่ได้", "w": "ยังเข้าร่วมได้ด้วยวิธีอื่น"}, {"id": "H4-05-d1", "t": "Let the researcher sign the form on the participant's behalf", "th": "ให้ผู้วิจัยลงนามแทนผู้เข้าร่วม", "w": "ผู้วิจัยมีส่วนได้เสีย ไม่ใช่พยานเป็นกลาง"}, {"id": "H4-05-d2", "t": "Skip the consent process entirely", "th": "ข้ามกระบวนการขอความยินยอมไปเลย", "w": "กระบวนการขอความยินยอมยังต้องมี"}], "answer": "H4-05-a", "ref": "Ch4 p39"}, {"id": "H4-06", "set": "H", "ch": 4, "q": "An ethics committee applies the same transparent, checkable criteria to every protocol without exception. Which type of justice is this?", "q_th": "คณะกรรมการจริยธรรมใช้เกณฑ์เดียวกันที่โปร่งใสและตรวจสอบได้กับทุกโครงร่างโดยไม่มีข้อยกเว้น นี่คือความยุติธรรมแบบใด", "options": [{"id": "H4-06-d0", "t": "Distributive justice", "th": "Distributive justice", "w": "Distributive = แบ่งประโยชน์และภาระอย่างเป็นธรรม"}, {"id": "H4-06-d1", "t": "Retributive/Corrective justice", "th": "Retributive/Corrective justice", "w": "Corrective = เยียวยาหรือลงโทษความผิด"}, {"id": "H4-06-a", "t": "Procedural justice", "th": "Procedural justice", "w": "Procedural = กฎ/ขั้นตอนโปร่งใส ตรวจสอบได้ ใช้เกณฑ์เดียวกันกับทุกคน"}, {"id": "H4-06-d2", "t": "Beneficence", "th": "Beneficence", "w": "เป็นหลัก Belmont อีกข้อ ไม่ใช่ประเภท justice"}], "answer": "H4-06-a", "ref": "Ch4 p64"}, {"id": "H4-07", "set": "H", "ch": 4, "q": "A study recruits low-income participants and offers each 10,000 THB for a one-hour interview. What does the course recommend instead?", "q_th": "งานวิจัยรับสมัครผู้มีรายได้น้อย และเสนอเงิน 10,000 บาทต่อการสัมภาษณ์ 1 ชั่วโมง คอร์สแนะนำให้ทำอย่างไรแทน", "options": [{"id": "H4-07-d0", "t": "Increase the payment so more people join the study quickly", "th": "เพิ่มค่าตอบแทนให้คนสมัครเร็วขึ้น", "w": "เป็นสิ่งล่อใจเกินควร โดยเฉพาะกลุ่มเปราะบางทางเศรษฐกิจ"}, {"id": "H4-07-a", "t": "Reasonable travel and time costs based on the daily minimum wage", "th": "ค่าเดินทางและค่าเสียเวลาที่เหมาะสม คิดจากค่าแรงขั้นต่ำรายวัน", "w": "Helsinki ข้อ 11: ตอบแทนอย่างเหมาะสม ไม่เป็นการจ้าง/จูงใจ เช่น ค่ารถ ค่าเสียเวลาตามค่าแรงขั้นต่ำ"}, {"id": "H4-07-d1", "t": "Pay nothing, because any compensation is always unethical", "th": "ไม่จ่ายเลย เพราะค่าตอบแทนทุกแบบผิดจริยธรรม", "w": "ค่าตอบแทนที่เหมาะสมทำได้"}, {"id": "H4-07-d2", "t": "Pay only participants who give positive answers", "th": "จ่ายเฉพาะผู้ที่ตอบในเชิงบวก", "w": "ไม่ยุติธรรมและทำให้ข้อมูลลำเอียง"}], "answer": "H4-07-a", "ref": "Ch4 p45, p69"}, {"id": "H4-08", "set": "H", "ch": 4, "q": "A staff member emails a promotion to 500 customers with all addresses in the CC field. What is the BEST description?", "q_th": "พนักงานส่งอีเมลโปรโมชันถึงลูกค้า 500 คน โดยใส่ทุกอีเมลไว้ในช่อง CC ข้อใดอธิบายได้ดีที่สุด", "options": [{"id": "H4-08-d0", "t": "Not a problem, because email addresses are non-private work data", "th": "ไม่เป็นปัญหา เพราะอีเมลเป็นข้อมูลที่ทำงานซึ่งไม่ใช่ข้อมูลส่วนตัว", "w": "อีเมลลูกค้าเป็นข้อมูลส่วนบุคคล ไม่ใช่อีเมลที่ทำงานของบริษัท"}, {"id": "H4-08-d1", "t": "Acceptable as long as the email is only a promotion", "th": "ยอมรับได้ ถ้าเป็นแค่อีเมลโปรโมชัน", "w": "วัตถุประสงค์การตลาดไม่ทำให้การเปิดเผยถูกต้อง"}, {"id": "H4-08-d2", "t": "Only a research-ethics issue, not related to PDPA", "th": "เป็นแค่ปัญหาจริยธรรมการวิจัย ไม่เกี่ยวกับ PDPA", "w": "เป็นประเด็น PDPA โดยตรง"}, {"id": "H4-08-a", "t": "A breach of confidentiality under PDPA; BCC should have been used", "th": "เป็นการละเมิดความลับตาม PDPA ควรใช้ BCC", "w": "ทุกคนเห็นอีเมลลูกค้าคนอื่น = เปิดเผยข้อมูลส่วนบุคคลโดยไม่ได้รับอนุญาต (เคสในสไลด์)"}], "answer": "H4-08-a", "ref": "Ch4 p81, p95"}, {"id": "H4-09", "set": "H", "ch": 4, "q": "A website requires a national ID number and religion before users can read general articles. Which PDPA principle is MAINLY violated?", "q_th": "เว็บไซต์บังคับให้กรอกเลขบัตรประชาชนและศาสนาก่อนอ่านบทความทั่วไป ละเมิดหลัก PDPA ข้อใด \"เป็นหลัก\"", "options": [{"id": "H4-09-d0", "t": "The right to data portability", "th": "สิทธิในการโอนย้ายข้อมูล (data portability)", "w": "ไม่ได้สอนในคอร์สและไม่ใช่ประเด็นหลัก"}, {"id": "H4-09-d1", "t": "Procedural justice of the ethics committee", "th": "Procedural justice ของคณะกรรมการจริยธรรม", "w": "เป็นเรื่องจริยธรรมวิจัย"}, {"id": "H4-09-d2", "t": "The rule that consent forms must be in child language", "th": "กฎที่ว่าใบยินยอมต้องเป็นภาษาเด็ก", "w": "ไม่เกี่ยวกับกรณีนี้"}, {"id": "H4-09-a", "t": "Collecting more data than necessary (data minimization)", "th": "เก็บข้อมูลเกินความจำเป็น (data minimization)", "w": "PDPA: ใช้ข้อมูลน้อยที่สุด/เฉพาะที่จำเป็น ตัวอย่างนี้อยู่ในสไลด์"}], "answer": "H4-09-a", "ref": "Ch4 p84, p91, p96"}, {"id": "H4-10", "set": "H", "ch": 4, "q": "During a drug study, an interim analysis shows the new drug clearly benefits participants. According to GCP, what may the researcher do?", "q_th": "ระหว่างการวิจัยยา ผลวิเคราะห์ระหว่างโครงการ (interim analysis) พบว่ายาใหม่ให้ประโยชน์ชัดเจน ตาม GCP ผู้วิจัยทำอะไรได้", "options": [{"id": "H4-10-a", "t": "Stop early or give the control group the drug, then report it", "th": "ยุติก่อนกำหนด หรือให้กลุ่มควบคุมได้รับยา แล้วรายงานคณะกรรมการ", "w": "สไลด์ GCP: ยุติก่อนกำหนดหรือปรับให้กลุ่มเปรียบเทียบได้รับยา และรายงานคณะกรรมการ"}, {"id": "H4-10-d0", "t": "Continue giving the placebo to finish as planned", "th": "ให้ยาหลอกต่อจนจบตามแผน", "w": "ไม่สมควรให้ยาหลอกต่อเมื่อพบประโยชน์ชัดเจน"}, {"id": "H4-10-d1", "t": "Change the protocol quietly without telling the committee", "th": "แก้โครงร่างเงียบ ๆ โดยไม่แจ้งคณะกรรมการ", "w": "ต้องรายงานการเปลี่ยนแปลงทุกครั้ง"}, {"id": "H4-10-d2", "t": "Publish the results and destroy the safety data", "th": "เผยแพร่ผลแล้วทำลายข้อมูลความปลอดภัย", "w": "ขัดกับการกำกับดูแลข้อมูล (DSMB)"}], "answer": "H4-10-a", "ref": "Ch4 p70"}, {"id": "H5-01", "set": "H", "ch": 5, "q": "A banking app shows \"Error 0x80004005\" when a transfer fails. Which heuristic is MOST violated, and what is the best fix?", "q_th": "แอปธนาคารแสดง \"Error 0x80004005\" เมื่อโอนเงินไม่สำเร็จ ละเมิด heuristic ใดมากที่สุด และควรแก้อย่างไร", "options": [{"id": "H5-01-d0", "t": "Error prevention: hide the error so users are not worried", "th": "Error prevention: ซ่อน error ไว้ ผู้ใช้จะได้ไม่กังวล", "w": "Error prevention คือป้องกันก่อนเกิด และการซ่อน error ยิ่งแย่"}, {"id": "H5-01-a", "t": "Recognize/diagnose/recover: explain the cause plainly and offer retry", "th": "Recognize/diagnose/recover: อธิบายสาเหตุด้วยภาษาง่าย และมีปุ่มลองใหม่", "w": "ต้องบอกด้วยภาษาง่าย (diagnose) และมีวิธี/ปุ่มแก้ไข (recover)"}, {"id": "H5-01-d1", "t": "Visibility of system status: show a loading spinner instead", "th": "Visibility of system status: แสดง loading spinner แทน", "w": "spinner ไม่ช่วยให้ผู้ใช้เข้าใจและแก้ error"}, {"id": "H5-01-d2", "t": "Help and documentation: tell users to read the full manual", "th": "Help and documentation: ให้ผู้ใช้ไปอ่านคู่มือฉบับเต็ม", "w": "ควรแก้ที่ข้อความ error ตรงจุด ไม่ใช่ส่งไปอ่านคู่มือ"}], "answer": "H5-01-a", "ref": "Ch5 p20"}, {"id": "H5-02", "set": "H", "ch": 5, "q": "Which usability test task is written BEST according to the course?", "q_th": "task สำหรับ usability test ข้อใดเขียนได้ดีที่สุดตามที่คอร์สสอน", "options": [{"id": "H5-02-d0", "t": "\"Tap the blue Transfer button at the bottom and send 500 THB to Ann.\"", "th": "\"กดปุ่ม Transfer สีฟ้าด้านล่าง แล้วโอน 500 บาทให้แอน\"", "w": "ชี้นำ (บอกปุ่ม/ตำแหน่ง) ทำให้ไม่ได้ทดสอบจริง"}, {"id": "H5-02-a", "t": "\"You owe Ann 500 THB for dinner. Please pay her back using the app.\"", "th": "\"คุณติดเงินแอน 500 บาทค่าอาหารเย็น ช่วยโอนคืนให้เขาผ่านแอปหน่อย\"", "w": "มี scenario ให้อิน ไม่ชี้นำ และวัดผลได้ชัดว่าโอนสำเร็จหรือไม่ (binary outcome)"}, {"id": "H5-02-d1", "t": "\"Explore the app freely for ten minutes and then tell us what you think.\"", "th": "\"ลองเล่นแอปอย่างอิสระ 10 นาที แล้วบอกเราว่าคิดอย่างไร\"", "w": "ไม่มีเป้าหมาย วัดสำเร็จ/ไม่สำเร็จไม่ได้"}, {"id": "H5-02-d2", "t": "\"Don't you agree that the new transfer feature is quick and easy to use?\"", "th": "\"คุณเห็นด้วยไหมว่าฟีเจอร์โอนเงินใหม่ใช้งานเร็วและง่าย?\"", "w": "เป็นคำถามชี้นำ ไม่ใช่ task"}], "answer": "H5-02-a", "ref": "Ch5 p31"}, {"id": "H5-03", "set": "H", "ch": 5, "q": "To warm participants up, a researcher uses one of the real test questions as the trial round. What is the problem?", "q_th": "เพื่อให้ผู้เข้าร่วมคุ้นเคย นักวิจัยใช้คำถามทดสอบจริงข้อหนึ่งเป็นรอบ trial ปัญหาคืออะไร", "options": [{"id": "H5-03-d0", "t": "There is no problem; trials should match real questions exactly", "th": "ไม่มีปัญหา trial ควรเหมือนคำถามจริงทุกประการ", "w": "ขัดกับสไลด์"}, {"id": "H5-03-d1", "t": "The trial should be skipped entirely", "th": "ควรข้าม trial ไปเลย", "w": "สไลด์แนะนำให้มี trial"}, {"id": "H5-03-d2", "t": "The trial should be given after the real test", "th": "ควรทำ trial หลังการทดสอบจริง", "w": "trial ต้องทำก่อนเพื่อให้รู้รูปแบบคำถาม"}, {"id": "H5-03-a", "t": "Trial items must not include real questions (learning effect)", "th": "trial ต้องไม่มีคำถามจริง (เกิดการเรียนรู้ทำให้ผลเอนเอียง)", "w": "สไลด์: Trial design ห้ามมีคำถามจริงปรากฏ เพื่อป้องกันการเรียนรู้"}], "answer": "H5-03-a", "ref": "Ch5 p32, p59"}, {"id": "H5-04", "set": "H", "ch": 5, "q": "A team wants to understand in depth WHY a few loyal users stopped using a feature, including their feelings and reasons. Which method fits BEST?", "q_th": "ทีมต้องการเข้าใจเชิงลึกว่า \"ทำไม\" ผู้ใช้ประจำไม่กี่คนเลิกใช้ฟีเจอร์หนึ่ง รวมถึงความรู้สึกและเหตุผล วิธีใดเหมาะที่สุด", "options": [{"id": "H5-04-d0", "t": "Large-scale questionnaire", "th": "แบบสอบถามขนาดใหญ่", "w": "เหมาะกับคนจำนวนมาก แต่เจาะลึกเหตุผลได้น้อยกว่า"}, {"id": "H5-04-d1", "t": "Observation without interaction", "th": "การสังเกตโดยไม่มีปฏิสัมพันธ์", "w": "ไม่ได้ถามเหตุผลหรือความรู้สึก"}, {"id": "H5-04-d2", "t": "Controlled experiment", "th": "การทดลองแบบควบคุมตัวแปร", "w": "เน้นวัดผลของตัวแปร ไม่ใช่เหตุผลเชิงลึก"}, {"id": "H5-04-a", "t": "In-depth interview", "th": "In-depth interview (สัมภาษณ์เชิงลึก)", "w": "การสัมภาษณ์เจาะลึกความรู้สึกและเหตุผล อ่านอารมณ์ผู้ตอบได้"}], "answer": "H5-04-a", "ref": "Ch5 p50–53"}, {"id": "H5-05", "set": "H", "ch": 5, "q": "A team compares a menu with 12 options against a menu with 5 options to apply Hick's Law. Which measures BEST fit?", "q_th": "ทีมเปรียบเทียบเมนูที่มี 12 ตัวเลือกกับเมนูที่มี 5 ตัวเลือก เพื่อประยุกต์ Hick's Law ตัวชี้วัดใดเหมาะที่สุด", "options": [{"id": "H5-05-d0", "t": "Churn rate and the number of subscription renewals per month", "th": "Churn rate และจำนวนการต่ออายุสมาชิกต่อเดือน", "w": "เป็น metric ของ Retention (HEART)"}, {"id": "H5-05-d1", "t": "Thumb-zone reach and the physical size of each button", "th": "การเอื้อมถึงของ thumb zone และขนาดจริงของแต่ละปุ่ม", "w": "เป็นแนวคิดของ Fitts's Law"}, {"id": "H5-05-d2", "t": "The Net Promoter Score of each menu version only", "th": "NPS ของแต่ละเวอร์ชันเมนูเท่านั้น", "w": "วัด loyalty ไม่ได้วัดผลของจำนวนตัวเลือก"}, {"id": "H5-05-a", "t": "Decision time, hesitation/accuracy and task success of A vs B", "th": "เวลาตัดสินใจ ความลังเล/ความแม่นยำ และอัตราความสำเร็จของ A เทียบ B", "w": "สไลด์ Hick (usability testing): Time on Task, Hesitation/accuracy, Task Success Rate เปรียบเทียบแบบ"}], "answer": "H5-05-a", "ref": "Ch5 p39"}, {"id": "H5-06", "set": "H", "ch": 5, "q": "A mobile team analyzes heatmaps, thumb-zone reach and the mis-tap rate of the Checkout button. Which law are they validating?", "q_th": "ทีมมือถือวิเคราะห์ heatmap การเอื้อมถึงของ thumb zone และอัตราการกดพลาดของปุ่ม Checkout ทีมกำลังตรวจสอบกฎใด", "options": [{"id": "H5-06-d0", "t": "Hick's Law", "th": "Hick's Law", "w": "Hick เน้นจำนวนตัวเลือกและเวลาตัดสินใจ"}, {"id": "H5-06-a", "t": "Fitts's Law", "th": "Fitts's Law", "w": "Heatmap & Click Tracking, Thumb zone, Error Rate อยู่ใต้แนวคิดเก็บข้อมูลของ Fitts"}, {"id": "H5-06-d1", "t": "Miller's Law", "th": "Miller's Law", "w": "Miller เน้นภาระความจำ"}, {"id": "H5-06-d2", "t": "Tesler's Law", "th": "Tesler's Law", "w": "Tesler เน้นความซับซ้อน"}], "answer": "H5-06-a", "ref": "Ch5 p41–44"}, {"id": "H5-07", "set": "H", "ch": 5, "q": "A redesign is tested with a benchmark comparison against the existing design to check whether it still matches what users expect to find. This mainly validates:", "q_th": "ดีไซน์ใหม่ถูกทดสอบด้วย benchmark comparison เทียบกับดีไซน์เดิม เพื่อดูว่ายังตรงกับสิ่งที่ผู้ใช้คาดหวังว่าจะเจอหรือไม่ เป็นการตรวจสอบกฎใดเป็นหลัก", "options": [{"id": "H5-07-a", "t": "Jakob's Law", "th": "Jakob's Law", "w": "Jakob: Mental Model, Familiarity, User Expectation, Benchmark Comparison (new vs existing)"}, {"id": "H5-07-d0", "t": "Parkinson's Law", "th": "Parkinson's Law", "w": "Parkinson เน้นเวลาและความพยายาม"}, {"id": "H5-07-d1", "t": "Tesler's Law", "th": "Tesler's Law", "w": "Tesler เน้นทำให้เรียบง่าย/ย้ายความซับซ้อน"}, {"id": "H5-07-d2", "t": "Miller's Law", "th": "Miller's Law", "w": "Miller เน้น chunk และความจำ"}], "answer": "H5-07-a", "ref": "Ch5 p46"}, {"id": "H5-08", "set": "H", "ch": 5, "q": "When prioritizing unhappy cases, which factor is NOT one of the course's criteria?", "q_th": "ในการจัดลำดับความสำคัญของ unhappy case ข้อใด \"ไม่ใช่\" เกณฑ์ของคอร์ส", "options": [{"id": "H5-08-d0", "t": "How often the case is likely to happen", "th": "โอกาสที่เคสนั้นจะเกิดบ่อยแค่ไหน", "w": "เป็นเกณฑ์ในสไลด์"}, {"id": "H5-08-d1", "t": "What percentage of users would be affected", "th": "มีผู้ใช้กี่เปอร์เซ็นต์ที่ได้รับผลกระทบ", "w": "เป็นเกณฑ์ในสไลด์"}, {"id": "H5-08-a", "t": "The designer's personal preference for a color", "th": "ความชอบสีส่วนตัวของดีไซเนอร์", "w": "เกณฑ์ในสไลด์: ความถี่ที่จะเกิด, % ผู้ใช้ที่ได้รับผลกระทบ, ผลต่อผู้ใช้, resource ในการแก้"}, {"id": "H5-08-d2", "t": "What resources are needed to fix it", "th": "ต้องใช้ทรัพยากรเท่าไรในการแก้", "w": "เป็นเกณฑ์ในสไลด์"}], "answer": "H5-08-a", "ref": "Ch5 p65"}, {"id": "H5-09", "set": "H", "ch": 5, "q": "A team starts mapping flows by listing every possible server outage before any main flow is drawn. What does the course's process recommend instead?", "q_th": "ทีมเริ่ม mapping flows ด้วยการไล่ลิสต์ทุกกรณีที่เซิร์ฟเวอร์อาจล่ม ก่อนจะวาด flow หลักเลย กระบวนการของคอร์สแนะนำให้ทำอย่างไรแทน", "options": [{"id": "H5-09-d0", "t": "Start with unhappy paths only, since happy paths are optional anyway", "th": "เริ่มที่ unhappy path อย่างเดียว เพราะ happy path ไม่จำเป็นอยู่แล้ว", "w": "ทุกระบบต้องมีทั้ง happy และ unhappy และเริ่มที่ happy"}, {"id": "H5-09-a", "t": "Finish all happy flows first, then screen actions/constraints, then failures", "th": "ทำ happy flow ให้ครบก่อน แล้วดู action/ข้อจำกัดของแต่ละหน้าจอ จากนั้นค่อยดูความล้มเหลว", "w": "ลำดับสไลด์: 1 happy flow ให้ครบ → 2 ขั้นตอน/หน้าจอ → 3–4 สิ่งที่ user ทำและข้อจำกัด → 5–6 ระบบหลังบ้าน/ภายนอกล่ม"}, {"id": "H5-09-d1", "t": "Skip flow mapping and go straight to high-fidelity design", "th": "ข้าม flow mapping แล้วไปทำ high-fidelity design เลย", "w": "ข้ามการวางแผนรองรับข้อผิดพลาด"}, {"id": "H5-09-d2", "t": "Map only the external system downtime and nothing else", "th": "วางแผนเฉพาะช่วงที่ระบบภายนอกปิดปรับปรุง ไม่ต้องทำอย่างอื่น", "w": "เป็นเพียงขั้นหนึ่งในกระบวนการ"}], "answer": "H5-09-a", "ref": "Ch5 p64"}, {"id": "H5-10", "set": "H", "ch": 5, "q": "To test an app for elderly users, a researcher recruits three designer friends because they are easy to reach. What is the BEST critique?", "q_th": "เพื่อทดสอบแอปสำหรับผู้สูงอายุ นักวิจัยชวนเพื่อนดีไซเนอร์ 3 คนเพราะติดต่อง่าย คำวิจารณ์ใดดีที่สุด", "options": [{"id": "H5-10-d0", "t": "It is ideal, because experts find more problems than real users", "th": "ดีที่สุดแล้ว เพราะผู้เชี่ยวชาญเจอปัญหามากกว่าผู้ใช้จริง", "w": "ไม่ใช่ตัวแทนผู้สูงอายุ"}, {"id": "H5-10-a", "t": "Not representative of the target users; small size not justified", "th": "ไม่เป็นตัวแทนของผู้ใช้เป้าหมาย และไม่มีเหตุผลรองรับจำนวนที่น้อย", "w": "กลุ่มตัวอย่างที่ดีต้องเป็นตัวแทน ขนาดเหมาะสม และต้องอธิบายเหตุผลเมื่อจำนวนน้อย"}, {"id": "H5-10-d1", "t": "The only problem is that three is an odd number", "th": "ปัญหาเดียวคือ 3 เป็นเลขคี่", "w": "ไม่ใช่ประเด็น"}, {"id": "H5-10-d2", "t": "It is fine as long as they sign consent forms", "th": "ใช้ได้ ตราบใดที่พวกเขาเซ็นใบยินยอม", "w": "consent ไม่ได้แก้ปัญหาความเป็นตัวแทน"}], "answer": "H5-10-a", "ref": "Ch5 p26, p29"}, {"id": "H8-01", "set": "H", "ch": 8, "q": "Developers need final screens for handoff, and the team wants to test users' emotional response to the visual design. Which artifact fits BEST?", "q_th": "Developer ต้องการหน้าจอสุดท้ายสำหรับส่งมอบ และทีมอยากทดสอบความรู้สึกของผู้ใช้ต่อดีไซน์ภาพ ชิ้นงานใดเหมาะที่สุด", "options": [{"id": "H8-01-d0", "t": "Low-fidelity paper sketch", "th": "ภาพร่าง low-fidelity บนกระดาษ", "w": "เหมาะกับแนวคิดช่วงแรก"}, {"id": "H8-01-d1", "t": "Mid-fidelity grayscale wireframe", "th": "Mid-fidelity wireframe โทนเทา", "w": "ใช้ทดสอบ usability ของปุ่ม/ฟังก์ชัน ยังไม่มีภาพจริง"}, {"id": "H8-01-a", "t": "High-fidelity wireframe/prototype", "th": "High-fidelity wireframe/prototype", "w": "High-Fi: ทดสอบความรู้สึกผู้ใช้ (UX) และส่งต่อให้ developer"}, {"id": "H8-01-d2", "t": "A list of user stories", "th": "รายการ user stories", "w": "ไม่ใช่หน้าจอสำหรับทดสอบอารมณ์"}], "answer": "H8-01-a", "ref": "Ch8 p10, p12"}, {"id": "H8-02", "set": "H", "ch": 8, "q": "Stakeholders want to click through all 20 screens early to review navigation and adjust the visual style. No real data processing is needed. Which prototype should be built?", "q_th": "ผู้มีส่วนได้ส่วนเสียต้องการคลิกดูครบทั้ง 20 หน้าจอตั้งแต่ต้น เพื่อรีวิวการนำทางและปรับสไตล์ภาพ โดยไม่ต้องประมวลผลข้อมูลจริง ควรสร้าง prototype แบบใด", "options": [{"id": "H8-02-d0", "t": "Vertical prototype", "th": "Vertical prototype", "w": "Vertical ทำฟีเจอร์เดียวลึกถึงฐานข้อมูล ใช้เวลานาน"}, {"id": "H8-02-d1", "t": "Working model connected to production", "th": "Working model ที่เชื่อมระบบใช้งานจริง", "w": "เกินความจำเป็น"}, {"id": "H8-02-d2", "t": "Feasibility prototype for one algorithm", "th": "Feasibility prototype สำหรับอัลกอริทึมเดียว", "w": "ทดสอบความเป็นไปได้ทางเทคนิค ไม่ใช่ภาพรวม"}, {"id": "H8-02-a", "t": "Horizontal prototype", "th": "Horizontal prototype", "w": "Horizontal: กว้าง เห็นทุกหน้าจอ สร้างเร็ว ปรับสไตล์ได้เร็ว แต่ไม่ประมวลผลจริง"}], "answer": "H8-02-a", "ref": "Ch8 p24, p26"}, {"id": "H8-03", "set": "H", "ch": 8, "q": "A team must run an unmoderated remote test and automatically log every click. Why is a paper prototype a poor choice?", "q_th": "ทีมต้องทดสอบระยะไกลแบบไม่มีผู้ดำเนินการ (unmoderated remote) และต้องบันทึกทุกการคลิกอัตโนมัติ ทำไม paper prototype จึงไม่เหมาะ", "options": [{"id": "H8-03-d0", "t": "Paper prototypes are always high-fidelity", "th": "Paper prototype เป็น high-fidelity เสมอ", "w": "paper เป็น Lo-Fi"}, {"id": "H8-03-d1", "t": "Paper prototypes take longer to make than coded apps", "th": "Paper prototype ใช้เวลาสร้างนานกว่าแอปที่เขียนโค้ด", "w": "paper ทำเร็ว"}, {"id": "H8-03-d2", "t": "Paper prototypes cannot show more than one screen", "th": "Paper prototype แสดงได้แค่หน้าจอเดียว", "w": "สลับชิ้นกระดาษจำลองหลายหน้าจอได้"}, {"id": "H8-03-a", "t": "It needs in-person testing and cannot auto-record clicks", "th": "ต้องทดสอบแบบเจอหน้า และบันทึกการคลิกอัตโนมัติไม่ได้", "w": "สไลด์: paper ต้องทดสอบแบบต่อหน้า บันทึกการคลิกอัตโนมัติไม่ได้"}], "answer": "H8-03-a", "ref": "Ch8 p23"}, {"id": "H8-04", "set": "H", "ch": 8, "q": "Static UI screens placed side by side in Figma, not yet linked to each other, are BEST described as:", "q_th": "หน้าจอ UI แบบภาพนิ่งที่วางเรียงกันใน Figma แต่ยังไม่ได้ลิงก์ถึงกัน อธิบายได้ดีที่สุดว่า", "options": [{"id": "H8-04-a", "t": "Digital, but not yet interactive", "th": "เป็น digital แต่ยังไม่ interactive", "w": "อยู่บนซอฟต์แวร์ = digital แต่ยังไม่ต่อลิงก์ จึงยังไม่ interactive (ตัวอย่างในสไลด์)"}, {"id": "H8-04-d0", "t": "An interactive clickable prototype", "th": "เป็น interactive prototype ที่คลิกได้", "w": "ยังคลิกไปหน้าอื่นไม่ได้"}, {"id": "H8-04-d1", "t": "A paper prototype", "th": "A paper prototype", "w": "ไม่ได้ทำจากกระดาษ"}, {"id": "H8-04-d2", "t": "A vertical prototype", "th": "A vertical prototype", "w": "ไม่ได้ต่อระบบหลังบ้าน"}], "answer": "H8-04-a", "ref": "Ch8 p25"}, {"id": "H8-05", "set": "H", "ch": 8, "q": "A designer uses the same title style and the same icon treatment on every feature card so users can recognize them as one family. Which visual hierarchy component is MAINLY used?", "q_th": "ดีไซเนอร์ใช้สไตล์หัวข้อและรูปแบบไอคอนเดียวกันในการ์ดฟีเจอร์ทุกใบ เพื่อให้ผู้ใช้รู้ว่าเป็นกลุ่มเดียวกัน ใช้องค์ประกอบ visual hierarchy ใด \"เป็นหลัก\"", "options": [{"id": "H8-05-d0", "t": "Alignment", "th": "Alignment", "w": "การจัดแนว ไม่ใช่การใช้รูปแบบซ้ำ"}, {"id": "H8-05-d1", "t": "Contrast", "th": "Contrast", "w": "คือความต่าง ซึ่งตรงข้ามกับโจทย์"}, {"id": "H8-05-d2", "t": "Whitespace", "th": "Whitespace", "w": "คือพื้นที่ว่าง"}, {"id": "H8-05-a", "t": "Repetition", "th": "Repetition", "w": "ใช้องค์ประกอบซ้ำเพื่อสร้างความสม่ำเสมอและเป็นกลุ่มเดียวกัน"}], "answer": "H8-05-a", "ref": "Ch8 p31, p44"}, {"id": "H8-06", "set": "H", "ch": 8, "q": "In the course's visual hierarchy analysis, the question \"Do the objects relate to each other?\" is linked to which concept?", "q_th": "ในการวิเคราะห์ visual hierarchy ของคอร์ส คำถาม \"วัตถุเหล่านี้เกี่ยวข้องกันไหม?\" เชื่อมโยงกับแนวคิดใด", "options": [{"id": "H8-06-d0", "t": "Miller's Law (memory)", "th": "Miller's Law (ความจำ)", "w": "คู่กับคำถาม \"what do you remember?\""}, {"id": "H8-06-a", "t": "Proximity (grouping)", "th": "Proximity (การจัดกลุ่ม)", "w": "สไลด์ p36: Relate to Proximity \"Grouping\""}, {"id": "H8-06-d1", "t": "Hick's Law (decision & choice)", "th": "Hick's Law (การตัดสินใจและการเลือก)", "w": "คู่กับคำถาม \"what will you choose?\""}, {"id": "H8-06-d2", "t": "Information Architecture (process)", "th": "Information Architecture (ลำดับขั้นตอน)", "w": "คู่กับคำถาม \"Right process?\""}], "answer": "H8-06-a", "ref": "Ch8 p34–37"}, {"id": "H8-07", "set": "H", "ch": 8, "q": "A settings page offers 15 plan options, and most users never change the pre-selected default. What BEST explains this?", "q_th": "หน้าตั้งค่ามีแพ็กเกจให้เลือก 15 แบบ และผู้ใช้ส่วนใหญ่ไม่เคยเปลี่ยนจากค่าเริ่มต้นที่ระบบเลือกไว้ ข้อใดอธิบายได้ดีที่สุด", "options": [{"id": "H8-07-d0", "t": "Recency effect, because the default is shown last", "th": "Recency effect เพราะค่าเริ่มต้นแสดงไว้ท้ายสุด", "w": "default ไม่จำเป็นต้องอยู่ท้าย และไม่ใช่เรื่องความจำ"}, {"id": "H8-07-d1", "t": "Von Restorff effect, because the default looks different", "th": "Von Restorff effect เพราะค่าเริ่มต้นดูแตกต่าง", "w": "โจทย์ไม่ได้บอกว่ามันเด่น"}, {"id": "H8-07-d2", "t": "Banner blindness, because users ignore ads", "th": "Banner blindness เพราะผู้ใช้เมินโฆษณา", "w": "ไม่ใช่โฆษณา"}, {"id": "H8-07-a", "t": "Status quo bias, reinforced by a difficult choice (Hick's Law)", "th": "Status quo bias เสริมด้วยการเลือกที่ยาก (Hick's Law)", "w": "อคติยึดติดสภาพเดิม และสไลด์เชื่อมกับ Hick's Law (Decision & Choice)"}], "answer": "H8-07-a", "ref": "Ch8 p38"}, {"id": "H8-08", "set": "H", "ch": 8, "q": "In the course's \"Wireframe in 6 Steps\", what comes immediately AFTER research and requirements?", "q_th": "ใน \"Wireframe in 6 Steps\" ของคอร์ส ขั้นใดมา \"ถัดจาก\" research and requirements ทันที", "options": [{"id": "H8-08-d0", "t": "User flow mapping", "th": "User flow mapping", "w": "เป็นขั้นที่ 3"}, {"id": "H8-08-a", "t": "Information architecture and content inventory", "th": "Information architecture and content inventory", "w": "ลำดับ: 1 Research → 2 IA & content inventory → 3 User flow → 4 Sketching → 5 Digital wireframes → 6 Documentation/handoff"}, {"id": "H8-08-d1", "t": "Initial sketching and layout exploration", "th": "Initial sketching and layout exploration", "w": "เป็นขั้นที่ 4"}, {"id": "H8-08-d2", "t": "Documentation and developer handoff", "th": "Documentation and developer handoff", "w": "เป็นขั้นสุดท้าย"}], "answer": "H8-08-a", "ref": "Ch8 p19"}, {"id": "H8-09", "set": "H", "ch": 8, "q": "A student team has zero budget, needs real-time collaboration, and cannot spend time learning a new tool. Which of the 4 tool-selection factors is NOT explicitly considered here?", "q_th": "ทีมนักศึกษาไม่มีงบเลย ต้องทำงานร่วมกันแบบเรียลไทม์ และไม่มีเวลาเรียนรู้เครื่องมือใหม่ ปัจจัยใดใน 4 ปัจจัยการเลือกเครื่องมือที่ \"ไม่ได้\" ถูกพิจารณาในสถานการณ์นี้", "options": [{"id": "H8-09-d0", "t": "Cost", "th": "Cost", "w": "zero budget = Cost"}, {"id": "H8-09-d1", "t": "Tool capabilities", "th": "Tool capabilities", "w": "real-time collaboration = capability"}, {"id": "H8-09-a", "t": "Project type & goals", "th": "Project type & goals", "w": "โจทย์กล่าวถึง Cost (ไม่มีงบ), Tool capabilities (collaboration), Learnability แต่ไม่ได้พูดถึงประเภท/เป้าหมายโปรเจกต์"}, {"id": "H8-09-d2", "t": "Learnability & ease of use", "th": "Learnability & ease of use", "w": "ไม่มีเวลาเรียนรู้ = learnability"}], "answer": "H8-09-a", "ref": "Ch8 p15–16"}, {"id": "H8-10", "set": "H", "ch": 8, "q": "For the course's food-ordering case study (goal: order within 3 steps), which screen arrangement matches the planned menu?", "q_th": "ใน case study แอปสั่งอาหารของคอร์ส (เป้าหมาย: สั่งได้ภายใน 3 ขั้นตอน) การจัดหน้าจอแบบใดตรงกับเมนูที่วางแผนไว้", "options": [{"id": "H8-10-d0", "t": "Home: payment and confirm → Menu: search box → Checkout: food categories", "th": "Home: จ่ายเงินและยืนยัน → Menu: ช่องค้นหา → Checkout: หมวดอาหาร", "w": "วางองค์ประกอบผิดหน้าจอ"}, {"id": "H8-10-d1", "t": "Home: add-ons → Menu: order summary → Checkout: search box and categories", "th": "Home: ของเพิ่ม → Menu: สรุปรายการ → Checkout: ช่องค้นหาและหมวดหมู่", "w": "ลำดับไม่สมเหตุสมผล"}, {"id": "H8-10-d2", "t": "One single screen that shows every element at once to save taps", "th": "หน้าจอเดียวที่แสดงทุกองค์ประกอบพร้อมกันเพื่อลดการกด", "w": "ขัดเป้าหมายแบ่ง 3 ขั้นตอน และเพิ่ม cognitive load"}, {"id": "H8-10-a", "t": "Home: search/categories → Menu: recommended/add-ons → Checkout: summary/pay/confirm", "th": "Home: ค้นหา/หมวดหมู่ → Menu: เมนูแนะนำ/ของเพิ่ม → Checkout: สรุป/จ่ายเงิน/ยืนยัน", "w": "ตรงกับสไลด์ case study"}], "answer": "H8-10-a", "ref": "Ch8 p55"}, {"id": "H9-01", "set": "H", "ch": 9, "q": "Out of 1,000 respondents, 650 score 9–10, 250 score 7–8 and 100 score 0–6. What is the NPS, and how does the course interpret it?", "q_th": "จากผู้ตอบ 1,000 คน มี 650 คนให้ 9–10, 250 คนให้ 7–8 และ 100 คนให้ 0–6 NPS เท่ากับเท่าไร และคอร์สตีความอย่างไร", "options": [{"id": "H9-01-a", "t": "55: a very good product (30–70)", "th": "55: สินค้าดีมาก (30–70)", "w": "Promoters 65% − Detractors 10% = 55 อยู่ช่วง 30–70 = สินค้าดีมาก"}, {"id": "H9-01-d0", "t": "65: an excellent product (70–100)", "th": "65: สินค้ายอดเยี่ยม (70–100)", "w": "ลืมหัก Detractors และ 65 ไม่อยู่ช่วง 70–100"}, {"id": "H9-01-d1", "t": "40: a good product (0–30)", "th": "40: สินค้าดี (0–30)", "w": "คำนวณผิด และ 40 ไม่อยู่ช่วง 0–30"}, {"id": "H9-01-d2", "t": "90: an excellent product", "th": "90: สินค้ายอดเยี่ยม", "w": "นำ Passive มารวมผิดสูตร"}], "answer": "H9-01-a", "ref": "Ch9 p10–11"}, {"id": "H9-02", "set": "H", "ch": 9, "q": "A support team handled 400 issues: 320 were resolved at first contact, but 20 of those were later reopened. What is the FCR and its rating?", "q_th": "ทีมซัพพอร์ตรับเรื่อง 400 เรื่อง แก้ได้ในการติดต่อครั้งแรก 320 เรื่อง แต่ในนั้น 20 เรื่องถูกเปิดใหม่ภายหลัง FCR เท่ากับเท่าไร และอยู่ระดับใด", "options": [{"id": "H9-02-a", "t": "75%, a good rate (70–79%)", "th": "75% ระดับดี (70–79%)", "w": "FCR = (320 − 20) / 400 × 100 = 75% → Good"}, {"id": "H9-02-d0", "t": "80%, a world-class rate", "th": "80% ระดับโลก (world class)", "w": "ลืมหัก reopened issues"}, {"id": "H9-02-d1", "t": "85%, a world-class rate", "th": "85% ระดับโลก (world class)", "w": "คำนวณผิด"}, {"id": "H9-02-d2", "t": "75%, a rate that needs improvement", "th": "75% ระดับที่ต้องปรับปรุง", "w": "ตัวเลขถูกแต่ 75% อยู่ช่วง Good ไม่ใช่ Needs improvement (0–69%)"}], "answer": "H9-02-a", "ref": "Ch9 p17–18"}, {"id": "H9-03", "set": "H", "ch": 9, "q": "Goal: \"make checkout effortless.\" Signal: \"fewer back-and-forth steps.\" Which HEART dimension and metric fit BEST in the GSM method?", "q_th": "Goal: \"ทำให้ checkout ง่ายไม่ต้องออกแรง\" Signal: \"ย้อนไปมาน้อยลง\" มิติ HEART และ metric ใดเหมาะที่สุดตามวิธี GSM", "options": [{"id": "H9-03-a", "t": "Task Success: checkout success rate or time to checkout", "th": "Task Success: อัตรา checkout สำเร็จ หรือเวลาที่ใช้ checkout", "w": "เป้าหมายเรื่องทำภารกิจได้ง่าย/เร็ว = Task Success วัดด้วย success rate/เวลา"}, {"id": "H9-03-d0", "t": "Adoption: number of new sign-ups each week", "th": "Adoption: จำนวนผู้สมัครใหม่ต่อสัปดาห์", "w": "วัดผู้ใช้ใหม่ ไม่ใช่ความง่ายของ checkout"}, {"id": "H9-03-d1", "t": "Retention: monthly churn rate of customers", "th": "Retention: อัตรา churn รายเดือนของลูกค้า", "w": "วัดการกลับมาใช้"}, {"id": "H9-03-d2", "t": "Engagement: average session length in the app", "th": "Engagement: ความยาว session เฉลี่ยในแอป", "w": "session ยาวอาจแปลว่าติดขัด ไม่ใช่ effortless"}], "answer": "H9-03-a", "ref": "Ch9 p2–4"}, {"id": "H9-04", "set": "H", "ch": 9, "q": "A one-sample t-test gives t(29) = −4.903, p = .001 (mean = 52.4 s, target = 60 s). What is the correct conclusion?", "q_th": "One-sample t-test ได้ t(29) = −4.903, p = .001 (ค่าเฉลี่ย = 52.4 วินาที, เป้า = 60 วินาที) ข้อสรุปที่ถูกต้องคือ", "options": [{"id": "H9-04-d0", "t": "Users were significantly slower, because t is negative", "th": "ผู้ใช้ช้ากว่าอย่างมีนัยสำคัญ เพราะ t ติดลบ", "w": "t ติดลบหมายถึงค่าเฉลี่ยน้อยกว่าเกณฑ์ (เร็วกว่า)"}, {"id": "H9-04-a", "t": "Users finished significantly faster than the 60-second target", "th": "ผู้ใช้ทำเสร็จเร็วกว่าเป้า 60 วินาทีอย่างมีนัยสำคัญ", "w": "t ติดลบ = ค่าเฉลี่ยต่ำกว่าเกณฑ์ และ p < .05 → มีนัยสำคัญ ผ่านเกณฑ์ประสิทธิภาพ"}, {"id": "H9-04-d1", "t": "No significant difference, because p is not exactly 0", "th": "ไม่ต่างอย่างมีนัยสำคัญ เพราะ p ไม่เท่ากับ 0 พอดี", "w": "p = .001 < .05 ถือว่ามีนัยสำคัญ"}, {"id": "H9-04-d2", "t": "The test is invalid, because df should equal 30", "th": "การทดสอบใช้ไม่ได้ เพราะ df ควรเท่ากับ 30", "w": "df = n − 1 = 29 ถูกต้อง"}], "answer": "H9-04-a", "ref": "Ch9 p24–25"}, {"id": "H9-05", "set": "H", "ch": 9, "q": "Two-way ANOVA results: background p = .384, icon type p < .001, background × icon p < .001. Which conclusion is BEST?", "q_th": "ผล Two-way ANOVA: background p = .384, icon type p < .001, background × icon p < .001 ข้อสรุปใดดีที่สุด", "options": [{"id": "H9-05-a", "t": "Icon type matters and depends on background; background alone doesn't", "th": "ประเภทไอคอนมีผล และผลนั้นขึ้นกับพื้นหลัง; พื้นหลังอย่างเดียวไม่มีผล", "w": "background ไม่ sig, icon sig, interaction sig → ผลของไอคอนเปลี่ยนตามสีพื้นหลัง"}, {"id": "H9-05-d0", "t": "Background is the main factor, and icon type does not matter at all", "th": "พื้นหลังเป็นปัจจัยหลัก และประเภทไอคอนไม่มีผลเลย", "w": "กลับด้านกับผล"}, {"id": "H9-05-d1", "t": "Nothing is significant, because one p-value is above .05", "th": "ไม่มีอะไรมีนัยสำคัญ เพราะมีค่า p หนึ่งค่าที่มากกว่า .05", "w": "มี 2 ค่าที่ < .05"}, {"id": "H9-05-d2", "t": "There is no interaction, so the factors act independently", "th": "ไม่มี interaction ปัจจัยทั้งสองส่งผลแยกกัน", "w": "interaction p < .001 คือมีผลร่วม"}], "answer": "H9-05-a", "ref": "Ch9 p43–46"}, {"id": "H9-06", "set": "H", "ch": 9, "q": "A one-way ANOVA comparing three backgrounds gives F = 6.43 with F-critical = 3.35. What should the team conclude and do next?", "q_th": "One-way ANOVA เปรียบเทียบพื้นหลัง 3 แบบ ได้ F = 6.43 และ F-critical = 3.35 ทีมควรสรุปและทำอะไรต่อ", "options": [{"id": "H9-06-d0", "t": "All three backgrounds differ from each other", "th": "พื้นหลังทั้งสามแบบต่างกันทุกคู่", "w": "ANOVA บอกแค่ว่ามีอย่างน้อย 1 คู่ต่างกัน"}, {"id": "H9-06-a", "t": "At least one pair differs; run a post-hoc test", "th": "มีอย่างน้อย 1 คู่ที่ต่างกัน; ทำ post-hoc test ต่อ", "w": "F > F-critical → sig แต่ยังไม่รู้คู่ไหน ต้องทำ post-hoc"}, {"id": "H9-06-d1", "t": "No difference, because F is larger than F-critical", "th": "ไม่ต่างกัน เพราะ F มากกว่า F-critical", "w": "F มากกว่า F-critical แปลว่ามีนัยสำคัญ"}, {"id": "H9-06-d2", "t": "Run a Chi-square test instead, because ANOVA is invalid", "th": "ไปใช้ Chi-square แทน เพราะ ANOVA ใช้ไม่ได้", "w": "ANOVA เหมาะสมแล้ว"}], "answer": "H9-06-a", "ref": "Ch9 p35"}, {"id": "H9-07", "set": "H", "ch": 9, "q": "Repeated-measures results: 48×48 vs 64×64 icons, p = .198; all other pairs p < .001. Which icon size should be the standard?", "q_th": "ผล repeated measures: ไอคอน 48×48 เทียบ 64×64 p = .198 ส่วนคู่อื่นทั้งหมด p < .001 ควรใช้ไอคอนขนาดใดเป็นมาตรฐาน", "options": [{"id": "H9-07-d0", "t": "64×64, because it has the lowest mean time of all sizes", "th": "64×64 เพราะมีเวลาเฉลี่ยต่ำที่สุดในทุกขนาด", "w": "เร็วกว่าเล็กน้อยแต่ไม่มีนัยสำคัญ และเปลืองพื้นที่"}, {"id": "H9-07-d1", "t": "16×16, because it saves the most space", "th": "16×16 เพราะประหยัดพื้นที่ที่สุด", "w": "ช้าที่สุดอย่างมีนัยสำคัญ"}, {"id": "H9-07-d2", "t": "32×32, because it is in the middle", "th": "32×32 เพราะอยู่ตรงกลาง", "w": "ช้ากว่า 48 และ 64 อย่างมีนัยสำคัญ"}, {"id": "H9-07-a", "t": "48×48: 64×64 is not significantly faster and uses more space", "th": "48×48: เพราะ 64×64 ไม่ได้เร็วกว่าอย่างมีนัยสำคัญ และเปลืองพื้นที่", "w": "สไลด์ discussion: เลือก 48×48 เป็นมาตรฐาน"}], "answer": "H9-07-a", "ref": "Ch9 p52–54"}, {"id": "H9-08", "set": "H", "ch": 9, "q": "The same 12 participants each try four font sizes, and their reading times are compared. Which analysis fits BEST?", "q_th": "ผู้เข้าร่วมกลุ่มเดิม 12 คนทดลองอ่านฟอนต์ 4 ขนาด แล้วเปรียบเทียบเวลาอ่าน การวิเคราะห์ใดเหมาะที่สุด", "options": [{"id": "H9-08-a", "t": "Repeated measures ANOVA", "th": "Repeated measures ANOVA", "w": "กลุ่มเดิมวัดซ้ำหลายเงื่อนไข (4 เงื่อนไข)"}, {"id": "H9-08-d0", "t": "One-way ANOVA with independent groups", "th": "One-way ANOVA แบบกลุ่มอิสระ", "w": "ข้อมูลมาจากคนกลุ่มเดียวกัน ไม่เป็นอิสระ"}, {"id": "H9-08-d1", "t": "Paired t-test", "th": "Paired t-test", "w": "paired ใช้เปรียบเทียบได้แค่ 2 ครั้ง/เงื่อนไข"}, {"id": "H9-08-d2", "t": "Chi-square test", "th": "Chi-square test", "w": "ไม่ใช่ข้อมูลความถี่เชิงกลุ่ม"}], "answer": "H9-08-a", "ref": "Ch9 p47–49"}, {"id": "H9-09", "set": "H", "ch": 9, "q": "The correlation between the number of form fields and the form completion rate is r = −0.82. What does this mean?", "q_th": "สหสัมพันธ์ระหว่างจำนวนช่องในฟอร์มกับอัตราการกรอกฟอร์มสำเร็จคือ r = −0.82 หมายความว่าอย่างไร", "options": [{"id": "H9-09-a", "t": "A strong negative relationship: more fields go with lower completion", "th": "สัมพันธ์เชิงลบระดับสูง: ช่องยิ่งมาก อัตราสำเร็จยิ่งต่ำ", "w": "ใกล้ −1 = สัมพันธ์เชิงลบระดับสูง ตัวหนึ่งเพิ่ม อีกตัวลด"}, {"id": "H9-09-d0", "t": "A strong positive relationship: more fields go with higher completion", "th": "สัมพันธ์เชิงบวกระดับสูง: ช่องยิ่งมาก อัตราสำเร็จยิ่งสูง", "w": "เครื่องหมายลบบอกทิศทางตรงข้าม"}, {"id": "H9-09-d1", "t": "A weak relationship, because the value is negative", "th": "สัมพันธ์ระดับอ่อน เพราะค่าติดลบ", "w": "ค่าลบไม่ได้แปลว่าอ่อน ขนาด 0.82 ถือว่าสูงมาก"}, {"id": "H9-09-d2", "t": "No relationship, because r is below zero", "th": "ไม่สัมพันธ์กัน เพราะ r ต่ำกว่าศูนย์", "w": "ไม่มีความสัมพันธ์คือ r ≈ 0"}], "answer": "H9-09-a", "ref": "Ch9 p57"}, {"id": "H9-10", "set": "H", "ch": 9, "q": "A team wants to predict whether a visitor will buy (yes/no) based on the time they spend talking with a sales chatbot. Which method fits BEST?", "q_th": "ทีมต้องการทำนายว่าผู้เข้าชมจะซื้อหรือไม่ (ใช่/ไม่ใช่) จากเวลาที่คุยกับแชตบอตฝ่ายขาย วิธีใดเหมาะที่สุด", "options": [{"id": "H9-10-d0", "t": "Linear regression", "th": "Linear regression", "w": "ใช้ทำนายค่าต่อเนื่อง ไม่ใช่ใช่/ไม่ใช่"}, {"id": "H9-10-d1", "t": "Pearson correlation", "th": "Pearson correlation", "w": "วัดความสัมพันธ์ ไม่ได้ทำนายผลแบบจำแนก"}, {"id": "H9-10-a", "t": "Logistic regression", "th": "Logistic regression", "w": "ทำนายโอกาสและจำแนกผลแบบ 0/1 (ซื้อ/ไม่ซื้อ) = Logistic"}, {"id": "H9-10-d2", "t": "One-sample t-test", "th": "One-sample t-test", "w": "เปรียบเทียบค่าเฉลี่ยกับเกณฑ์"}], "answer": "H9-10-a", "ref": "Ch9 p62–63"}]}, "S2": {"name": "Standard 2", "questions": [{"id": "S2.2-01", "set": "S2", "ch": 2, "q": "In the perception process, grouping information by similarity or proximity happens in which stage?", "q_th": "ในกระบวนการรับรู้ การจัดกลุ่มข้อมูลตามความคล้ายหรือความใกล้ชิดเกิดขึ้นในขั้นใด", "options": [{"id": "S2.2-01-d0", "t": "Selection", "th": "Selection", "w": "Selection = เลือกสนใจสิ่งเร้าที่สำคัญ ยังไม่ได้จัดกลุ่ม"}, {"id": "S2.2-01-a", "t": "Organization", "th": "Organization", "w": "Organization = สมองจัดกลุ่มตามความคล้าย/ความใกล้ (Gestalt)"}, {"id": "S2.2-01-d1", "t": "Interpretation", "th": "Interpretation", "w": "Interpretation = ใช้ประสบการณ์เดิมตีความ (Affordance)"}, {"id": "S2.2-01-d2", "t": "Retention", "th": "Retention", "w": "Retention เป็นส่วนหนึ่งของ Selective Perception ไม่ใช่ขั้นของ Perception"}], "answer": "S2.2-01-a", "ref": "Ch2 p5, p37"}, {"id": "S2.2-02", "set": "S2", "ch": 2, "q": "A \"free trial\" quietly states in tiny text that it will turn into a paid monthly plan automatically. Which dark pattern is this?", "q_th": "\"ทดลองใช้ฟรี\" ที่เขียนตัวเล็กมากว่าจะเปลี่ยนเป็นสมาชิกรายเดือนแบบเสียเงินอัตโนมัติ เป็น dark pattern แบบใด", "options": [{"id": "S2.2-02-d0", "t": "Drip Pricing", "th": "Drip Pricing", "w": "Drip Pricing คือบวกค่าธรรมเนียมทีละรายการตอน checkout"}, {"id": "S2.2-02-d1", "t": "Confirm Shaming", "th": "Confirm Shaming", "w": "Confirm Shaming ใช้ถ้อยคำทำให้รู้สึกผิดเมื่อปฏิเสธ"}, {"id": "S2.2-02-d2", "t": "Disguised Advertisement", "th": "Disguised Advertisement", "w": "คือโฆษณาที่เนียนเป็นเนื้อหา"}, {"id": "S2.2-02-a", "t": "Subscription Trap", "th": "Subscription Trap", "w": "หลอกให้ตกลงสมัครแบบต่อเนื่อง ตัวอย่างตรงจากสไลด์ p16"}], "answer": "S2.2-02-a", "ref": "Ch2 p16"}, {"id": "S2.2-03", "set": "S2", "ch": 2, "q": "Replacing \"Error Code: 404\" with \"Sorry, this page was not found. Please try again.\" applies which concept?", "q_th": "การเปลี่ยนข้อความ \"Error Code: 404\" เป็น \"ขออภัย ไม่พบหน้านี้ กรุณาลองใหม่อีกครั้ง\" เป็นการใช้แนวคิดใด", "options": [{"id": "S2.2-03-d0", "t": "Selective Exposure", "th": "Selective Exposure", "w": "Exposure คือการเลือกเปิดรับข้อมูล เช่น personalized dashboard"}, {"id": "S2.2-03-d1", "t": "Selective Retention", "th": "Selective Retention", "w": "Retention คือการเลือกจดจำ เช่น contextual hints"}, {"id": "S2.2-03-a", "t": "Selective Comprehension", "th": "Selective Comprehension", "w": "สไลด์ใช้ตัวอย่างนี้กับ Selective Comprehension: ผู้ใช้ทั่วไปตีความ error code ไม่ได้"}, {"id": "S2.2-03-d2", "t": "Banner Blindness", "th": "Banner Blindness", "w": "คือการเมินสิ่งที่ดูเหมือนโฆษณา"}], "answer": "S2.2-03-a", "ref": "Ch2 p32"}, {"id": "S2.2-04", "set": "S2", "ch": 2, "q": "A long registration form is split into Step 1, Step 2 and Step 3 so users see only 3–5 actions per page. Which law supports this?", "q_th": "ฟอร์มสมัครสมาชิกยาว ๆ ถูกแบ่งเป็น Step 1, 2, 3 ให้ผู้ใช้เห็นแค่ 3–5 อย่างต่อหน้า เป็นไปตามกฎใด", "options": [{"id": "S2.2-04-d0", "t": "Fitts's Law", "th": "Fitts's Law", "w": "Fitts เกี่ยวกับขนาดและระยะของเป้าหมาย"}, {"id": "S2.2-04-d1", "t": "Jakob's Law", "th": "Jakob's Law", "w": "Jakob เกี่ยวกับความคุ้นเคยกับเว็บอื่น"}, {"id": "S2.2-04-d2", "t": "Tesler's Law", "th": "Tesler's Law", "w": "Tesler เกี่ยวกับการย้ายความซับซ้อนให้ระบบรับ"}, {"id": "S2.2-04-a", "t": "Hick's Law", "th": "Hick's Law", "w": "สไลด์ยกตัวอย่างการแบ่งฟอร์มสมัครเป็น step ไว้ใต้ Hick's Law เพื่อลดตัวเลือกต่อครั้ง"}], "answer": "S2.2-04-a", "ref": "Ch2 p49"}, {"id": "S2.2-05", "set": "S2", "ch": 2, "q": "Why does the course recommend placing important buttons at the edges or corners of the screen?", "q_th": "ทำไมคอร์สแนะนำให้วางปุ่มสำคัญไว้ที่ขอบหรือมุมของหน้าจอ", "options": [{"id": "S2.2-05-d0", "t": "Users remember edge items best because of the recency effect", "th": "Users remember edge items best because of the recency effect", "w": "Recency เป็นเรื่องลำดับรายการ ไม่ใช่ตำแหน่งบนจอ"}, {"id": "S2.2-05-d1", "t": "Edges have fewer choices, so decisions are faster", "th": "Edges have fewer choices, so decisions are faster", "w": "เป็นการปน Hick's Law"}, {"id": "S2.2-05-a", "t": "The cursor stops at the edge, making it easy and accurate to hit", "th": "The cursor stops at the edge, making it easy and accurate to hit", "w": "สไลด์ Fitts: ขอบจอทำให้เมาส์ชนแล้วหยุดพอดี คลิกง่ายและแม่นที่สุด"}, {"id": "S2.2-05-d2", "t": "Edge placement hides the buttons from accidental clicks", "th": "Edge placement hides the buttons from accidental clicks", "w": "ไม่ได้ซ่อน แต่ทำให้กดง่ายขึ้น"}], "answer": "S2.2-05-a", "ref": "Ch2 p53"}, {"id": "S2.2-06", "set": "S2", "ch": 2, "q": "According to the course, the key principle behind Jakob's Law is:", "q_th": "ตามที่คอร์สสอน หลักการสำคัญเบื้องหลัง Jakob's Law คือ", "options": [{"id": "S2.2-06-a", "t": "Mental Models", "th": "Mental Models", "w": "สไลด์ p71: หลักการสำคัญของ Jakob's Law คือ Mental Models"}, {"id": "S2.2-06-d0", "t": "Cognitive Load Theory", "th": "Cognitive Load Theory", "w": "เป็นทฤษฎีภาระทางปัญญา ไม่ใช่หลักของ Jakob"}, {"id": "S2.2-06-d1", "t": "Serial Position Effect", "th": "Serial Position Effect", "w": "เกี่ยวกับการจำลำดับรายการ"}, {"id": "S2.2-06-d2", "t": "Principle of Least Effort", "th": "Principle of Least Effort", "w": "เกี่ยวกับการเลือกทางที่ใช้แรงน้อยที่สุด"}], "answer": "S2.2-06-a", "ref": "Ch2 p71"}, {"id": "S2.2-07", "set": "S2", "ch": 2, "q": "A long checkout shows \"Step 2 of 4\" at the top. Which cognitive-overload protection technique is this?", "q_th": "หน้า checkout ยาว ๆ แสดง \"ขั้นที่ 2 จาก 4\" ไว้ด้านบน เป็นเทคนิคป้องกัน cognitive overload ข้อใด", "options": [{"id": "S2.2-07-d0", "t": "Image Identifying", "th": "Image Identifying", "w": "คือใช้รูป/ไอคอน/สีคู่กับข้อความ"}, {"id": "S2.2-07-d1", "t": "Familiarity", "th": "Familiarity", "w": "คือใช้แพทเทิร์นมาตรฐานที่คุ้นเคย"}, {"id": "S2.2-07-d2", "t": "Less is more", "th": "Less is more", "w": "คือการตัดตัวเลือกที่ไม่จำเป็น"}, {"id": "S2.2-07-a", "t": "Progress Indicators", "th": "Progress Indicators", "w": "บอกผู้ใช้ว่าอยู่ขั้นไหนและเหลืออีกกี่ขั้น"}], "answer": "S2.2-07-a", "ref": "Ch2 p43"}, {"id": "S2.2-08", "set": "S2", "ch": 2, "q": "In the UX version of Maslow's hierarchy, a system that loads fast, is secure and lets users cancel or undo meets which level?", "q_th": "ใน Maslow ฉบับ UX ระบบที่โหลดเร็ว ปลอดภัย และให้ผู้ใช้ cancel หรือ undo ได้ ตอบสนองขั้นใด", "options": [{"id": "S2.2-08-d0", "t": "Functional", "th": "Functional", "w": "Functional = ทำงานได้จริง ไม่มี bug"}, {"id": "S2.2-08-a", "t": "Reliability", "th": "Reliability", "w": "สไลด์: Reliability = โหลดเร็ว ปลอดภัย พร้อมใช้ตลอด กด cancel/undo ได้"}, {"id": "S2.2-08-d1", "t": "Convenience", "th": "Convenience", "w": "Convenience = ลดขั้นตอน ประหยัดเวลา"}, {"id": "S2.2-08-d2", "t": "Pleasurable", "th": "Pleasurable", "w": "Pleasurable = UI สวย interaction น่าประทับใจ"}], "answer": "S2.2-08-a", "ref": "Ch2 p26"}, {"id": "S2.2-09", "set": "S2", "ch": 2, "q": "In the list \"rambutan, orange, guava, pants, watermelon\", the word \"pants\" stands out because of its meaning. Which isolation method is this?", "q_th": "ในรายการ \"เงาะ ส้ม ฝรั่ง กางเกง แตงโม\" คำว่า \"กางเกง\" โดดเด่นเพราะความหมาย เป็น isolation วิธีใด", "options": [{"id": "S2.2-09-d0", "t": "Perceptual (visual) isolation", "th": "Perceptual isolation (ความต่างทางสายตา)", "w": "Perceptual ใช้สีหรือขนาด"}, {"id": "S2.2-09-a", "t": "Conceptual/Semantic isolation", "th": "Conceptual/Semantic isolation", "w": "ต่างด้านความหมาย/ประเภทข้อมูล ตัวอย่างตรงจากสไลด์"}, {"id": "S2.2-09-d1", "t": "Spatial isolation", "th": "Spatial isolation", "w": "Spatial ใช้พื้นที่ว่าง"}, {"id": "S2.2-09-d2", "t": "Counter isolation", "th": "Counter isolation", "w": "Counter คือสิ่งที่เหนือความคาดหมาย ขัดภาพจำ"}], "answer": "S2.2-09-a", "ref": "Ch2 p79"}, {"id": "S2.2-10", "set": "S2", "ch": 2, "q": "Offering \"Login with Google/Apple\" instead of creating a new password is an example of:", "q_th": "การมีตัวเลือก \"เข้าสู่ระบบด้วย Google/Apple\" แทนการตั้งรหัสผ่านใหม่ เป็นตัวอย่างของ", "options": [{"id": "S2.2-10-d0", "t": "Increasing germane load", "th": "เพิ่ม germane load", "w": "ไม่ได้ช่วยเชื่อมความรู้ใหม่กับเดิม"}, {"id": "S2.2-10-d1", "t": "Applying the Von Restorff effect", "th": "ใช้ Von Restorff effect", "w": "ไม่ใช่การทำให้สิ่งหนึ่งแปลกแยก"}, {"id": "S2.2-10-a", "t": "Minimizing interaction cost (Least Effort)", "th": "ลด interaction cost (Least Effort)", "w": "Least Effort Sample: ลดการคลิกและการกรอกข้อมูล เช่น login คลิกเดียว"}, {"id": "S2.2-10-d2", "t": "Applying Parkinson's work-expansion rule", "th": "ใช้กฎการขยายตัวของงานของ Parkinson", "w": "สไลด์จัดตัวอย่างนี้ไว้ใต้ Least Effort"}], "answer": "S2.2-10-a", "ref": "Ch2 p83"}, {"id": "S2.3-01", "set": "S2", "ch": 3, "q": "In a problem statement, the \"Desired State\" describes:", "q_th": "ใน problem statement คำว่า \"Desired State\" อธิบายถึง", "options": [{"id": "S2.3-01-d0", "t": "The problem happening now, with evidence", "th": "ปัญหาที่เกิดขึ้นตอนนี้พร้อมหลักฐาน", "w": "นั่นคือ Current State"}, {"id": "S2.3-01-a", "t": "The goal or outcome we want to achieve", "th": "เป้าหมายหรือผลลัพธ์ที่ต้องการ", "w": "สไลด์: Desired State = ความคาดหวัง เป้าหมาย ผลลัพธ์ที่ต้องการ"}, {"id": "S2.3-01-d1", "t": "The damage if the problem is not solved", "th": "ความเสียหายหากไม่แก้ปัญหา", "w": "นั่นคือ Impact"}, {"id": "S2.3-01-d2", "t": "The exact feature that will fix the problem", "th": "ฟีเจอร์ที่จะใช้แก้ปัญหา", "w": "เป็น solution ซึ่งไม่ควรใส่"}], "answer": "S2.3-01-a", "ref": "Ch3 p3"}, {"id": "S2.3-02", "set": "S2", "ch": 3, "q": "Why should a problem statement describe the user's emotional state (e.g., frustrated, confused)?", "q_th": "ทำไม problem statement ควรระบุสภาวะอารมณ์ของผู้ใช้ (เช่น หงุดหงิด สับสน)", "options": [{"id": "S2.3-02-d0", "t": "It replaces the need for numbers and data", "th": "ทำให้ไม่ต้องใช้ตัวเลขและข้อมูล", "w": "ยังต้องใช้ข้อมูลและตัวเลข"}, {"id": "S2.3-02-d1", "t": "It is required by the PDPA", "th": "PDPA กำหนดไว้", "w": "ไม่เกี่ยวกับ PDPA"}, {"id": "S2.3-02-a", "t": "Feelings affect whether users keep using it", "th": "ความรู้สึกมีผลต่อการใช้งานต่อ", "w": "สไลด์ Emotional Impact: ในทาง UX ความรู้สึกส่งผลต่อการตัดสินใจใช้งานต่อ"}, {"id": "S2.3-02-d2", "t": "It tells the developers which solution to build", "th": "บอก developer ว่าต้องสร้างทางแก้อะไร", "w": "problem statement ไม่ควรระบุ solution"}], "answer": "S2.3-02-a", "ref": "Ch3 p4"}, {"id": "S2.3-03", "set": "S2", "ch": 3, "q": "How does a persona help save budget, according to the course?", "q_th": "ตามที่คอร์สสอน persona ช่วยประหยัดงบประมาณได้อย่างไร", "options": [{"id": "S2.3-03-d0", "t": "By removing the need to test with real users", "th": "โดยไม่ต้องทดสอบกับผู้ใช้จริง", "w": "ยังต้องทดสอบกับผู้ใช้"}, {"id": "S2.3-03-a", "t": "By scoping down the target group", "th": "โดย scope กลุ่มเป้าหมายให้แคบลง", "w": "สไลด์: การ scope down ทำให้เจาะความสนใจและรูปแบบการทำงานได้แคบลง"}, {"id": "S2.3-03-d1", "t": "By replacing the ethics approval process", "th": "โดยใช้แทนการขอรับรองจริยธรรม", "w": "ไม่เกี่ยวข้อง"}, {"id": "S2.3-03-d2", "t": "By letting the team skip the wireframe stage", "th": "โดยให้ทีมข้ามขั้นทำ wireframe", "w": "ไม่ได้ข้ามขั้นตอนออกแบบ"}], "answer": "S2.3-03-a", "ref": "Ch3 p14"}, {"id": "S2.3-04", "set": "S2", "ch": 3, "q": "Which of the following is NOT one of the three steps of the User Persona Process?", "q_th": "ข้อใด \"ไม่ใช่\" หนึ่งใน 3 ขั้นตอนของ User Persona Process", "options": [{"id": "S2.3-04-d0", "t": "Data Gathering", "th": "Data Gathering", "w": "เป็นขั้นที่ 1"}, {"id": "S2.3-04-a", "t": "Usability Testing", "th": "Usability Testing", "w": "3 ขั้น: Data Gathering → Analysis & Synthesis → Persona Creation"}, {"id": "S2.3-04-d1", "t": "Analysis & Synthesis", "th": "Analysis & Synthesis", "w": "เป็นขั้นที่ 2"}, {"id": "S2.3-04-d2", "t": "Persona Creation", "th": "Persona Creation", "w": "เป็นขั้นที่ 3"}], "answer": "S2.3-04-a", "ref": "Ch3 p17"}, {"id": "S2.3-05", "set": "S2", "ch": 3, "q": "In the Process of a user journey, the \"After\" stage focuses on:", "q_th": "ใน Process ของ user journey ช่วง \"After\" เน้นเรื่องใด", "options": [{"id": "S2.3-05-d0", "t": "What users do before entering the process", "th": "สิ่งที่ผู้ใช้ทำก่อนเข้าสู่กระบวนการ", "w": "นั่นคือ Before"}, {"id": "S2.3-05-d1", "t": "Logging in and completing the main task", "th": "การล็อกอินและทำภารกิจหลักให้เสร็จ", "w": "นั่นคือ During"}, {"id": "S2.3-05-a", "t": "Feelings and actions after finishing the task", "th": "ความรู้สึกและการกระทำหลังทำภารกิจเสร็จ", "w": "สไลด์: After = ความรู้สึกหรือการกระทำเมื่อเสร็จสิ้นภารกิจ วิเคราะห์ความรู้สึก"}, {"id": "S2.3-05-d2", "t": "Choosing the persona for the map", "th": "การเลือก persona ของแผนที่", "w": "persona เป็นขั้นแรกของ journey map"}], "answer": "S2.3-05-a", "ref": "Ch3 p24"}, {"id": "S2.3-06", "set": "S2", "ch": 3, "q": "In a journey scenario, \"Environment\" refers to:", "q_th": "ใน scenario ของ journey คำว่า \"Environment\" หมายถึง", "options": [{"id": "S2.3-06-d0", "t": "The event that brings the user to the product", "th": "เหตุการณ์ที่ทำให้ผู้ใช้เข้ามาใช้", "w": "นั่นคือ Trigger"}, {"id": "S2.3-06-a", "t": "The context while the user is using the product", "th": "บริบทขณะที่ผู้ใช้ใช้ผลิตภัณฑ์", "w": "สไลด์: Environment = บริบทขณะใช้"}, {"id": "S2.3-06-d1", "t": "The person who matches the persona", "th": "บุคคลที่ตรงกับ persona", "w": "นั่นคือ Actor"}, {"id": "S2.3-06-d2", "t": "The company's server infrastructure", "th": "โครงสร้างเซิร์ฟเวอร์ของบริษัท", "w": "ไม่ใช่ความหมายในสไลด์"}], "answer": "S2.3-06-a", "ref": "Ch3 p25"}, {"id": "S2.3-07", "set": "S2", "ch": 3, "q": "During the Awareness phase, what should the design mainly provide?", "q_th": "ในช่วง Awareness ดีไซน์ควรให้อะไรเป็นหลัก", "options": [{"id": "S2.3-07-d0", "t": "Reviews and comparisons of competing options", "th": "รีวิวและการเปรียบเทียบตัวเลือกต่าง ๆ", "w": "นั่นคือสิ่งที่ต้องให้ในช่วง Consideration"}, {"id": "S2.3-07-a", "t": "Knowledge about the problem the user is facing", "th": "ความรู้เกี่ยวกับปัญหาที่ผู้ใช้กำลังเผชิญ", "w": "สไลด์: Awareness = เริ่มตระหนักว่ามีปัญหา ต้องให้ความรู้เกี่ยวกับปัญหา"}, {"id": "S2.3-07-d1", "t": "A loyalty reward after purchase", "th": "รางวัลสะสมแต้มหลังการซื้อ", "w": "เป็นเรื่องหลังใช้งาน"}, {"id": "S2.3-07-d2", "t": "A detailed checkout summary", "th": "สรุปรายการ checkout อย่างละเอียด", "w": "ยังไม่ถึงขั้นซื้อ"}], "answer": "S2.3-07-a", "ref": "Ch3 p27"}, {"id": "S2.3-08", "set": "S2", "ch": 3, "q": "\"Clean colors and an uncluttered layout\" mainly target which level of Don Norman's emotional design?", "q_th": "\"สีสะอาดตาและเลย์เอาต์ไม่รก\" มุ่งไปที่ระดับใดของ emotional design ของ Don Norman", "options": [{"id": "S2.3-08-a", "t": "Visceral", "th": "Visceral", "w": "สไลด์: Visceral = ความรู้สึกแรกเห็น เช่น สีสะอาดตา layout ไม่รก"}, {"id": "S2.3-08-d0", "t": "Behavioral", "th": "Behavioral", "w": "Behavioral = ความรู้สึกตอนใช้งาน ใช้ง่าย รวดเร็ว"}, {"id": "S2.3-08-d1", "t": "Reflective", "th": "Reflective", "w": "Reflective = ความภูมิใจ/ภักดีหลังใช้"}, {"id": "S2.3-08-d2", "t": "Consideration", "th": "Consideration", "w": "Consideration เป็นช่วงของ Action ไม่ใช่ระดับอารมณ์"}], "answer": "S2.3-08-a", "ref": "Ch3 p29"}, {"id": "S2.3-09", "set": "S2", "ch": 3, "q": "Icons that do not communicate their meaning and unnecessary animations are which type of pain point?", "q_th": "ไอคอนที่สื่อความหมายไม่ได้และแอนิเมชันที่เกินความจำเป็น เป็น pain point ประเภทใด", "options": [{"id": "S2.3-09-d0", "t": "Support pain point", "th": "Support pain point", "w": "Support = ข้อมูล/ความช่วยเหลือไม่ชัด"}, {"id": "S2.3-09-d1", "t": "Process pain point", "th": "Process pain point", "w": "Process = ขั้นตอนซับซ้อน"}, {"id": "S2.3-09-a", "t": "Design pain point", "th": "Design pain point", "w": "สไลด์ Design pain point: icon ไม่สื่อสาร, animation เกินความจำเป็น"}, {"id": "S2.3-09-d2", "t": "Productivity pain point", "th": "Productivity pain point", "w": "Productivity = เสียเวลา ทำงานช้า"}], "answer": "S2.3-09-a", "ref": "Ch3 p33"}, {"id": "S2.3-10", "set": "S2", "ch": 3, "q": "Designing a short onboarding screen that adapts to each user's interests is which Idea/Impact approach?", "q_th": "การออกแบบหน้าแนะนำการใช้งานสั้น ๆ ที่ปรับตามความสนใจของผู้ใช้แต่ละคน เป็นแนวทาง Idea/Impact แบบใด", "options": [{"id": "S2.3-10-a", "t": "Personalization", "th": "Personalization", "w": "สไลด์: Personalization = หน้าแนะนำสั้นกระชับ ปรับตามความสนใจแต่ละคน"}, {"id": "S2.3-10-d0", "t": "Accessibility", "th": "Accessibility", "w": "Accessibility = ทุกกลุ่มเข้าถึงได้"}, {"id": "S2.3-10-d1", "t": "Micro-interactions", "th": "Micro-interactions", "w": "Micro-interactions = แอนิเมชันเล็ก ๆ"}, {"id": "S2.3-10-d2", "t": "Frictionless Flow", "th": "Frictionless Flow", "w": "Frictionless Flow = ย่อขั้นตอน ลดการทำซ้ำ"}], "answer": "S2.3-10-a", "ref": "Ch3 p36"}, {"id": "S2.4-01", "set": "S2", "ch": 4, "q": "A team forgot to apply for ethics approval and has already collected data. According to the course rules, can they request approval retroactively?", "q_th": "ทีมลืมขอรับรองจริยธรรมและเก็บข้อมูลไปแล้ว ตามกฎของคอร์ส ขอรับรองย้อนหลังได้หรือไม่", "options": [{"id": "S2.4-01-d0", "t": "Yes, within 3 months after collection", "th": "ได้ ภายใน 3 เดือนหลังเก็บข้อมูล", "w": "3 เดือนคือระยะยื่นล่วงหน้า ไม่ใช่ย้อนหลัง"}, {"id": "S2.4-01-d1", "t": "Yes, if the study was exempt", "th": "ได้ ถ้างานวิจัยเข้าข่าย exempt", "w": "exempt ก็ต้องยื่นก่อน"}, {"id": "S2.4-01-d2", "t": "Yes, if the certificate is still valid", "th": "ได้ ถ้าใบ certificate ยังไม่หมดอายุ", "w": "อายุ certificate ไม่ได้ทำให้ขอย้อนหลังได้"}, {"id": "S2.4-01-a", "t": "No, retroactive approval is not allowed", "th": "ไม่ได้ ห้ามขอรับรองย้อนหลัง", "w": "สไลด์ Rules: ขอรับรองย้อนหลังไม่ได้"}], "answer": "S2.4-01-a", "ref": "Ch4 p5"}, {"id": "S2.4-02", "set": "S2", "ch": 4, "q": "Collecting saliva samples is listed as an example of which review type?", "q_th": "การเก็บตัวอย่างน้ำลายถูกยกเป็นตัวอย่างของการพิจารณาประเภทใด", "options": [{"id": "S2.4-02-d0", "t": "Exemption", "th": "Exemption", "w": "Exemption ตัวอย่างคือแบบสอบถามพึงพอใจไม่ระบุชื่อ"}, {"id": "S2.4-02-d1", "t": "Full Board", "th": "Full Board", "w": "Full Board สำหรับยาใหม่ ผ่าตัด กลุ่มเปราะบาง"}, {"id": "S2.4-02-d2", "t": "Not Subject to Ethical Review", "th": "Not Subject to Ethical Review", "w": "การเก็บตัวอย่างจากคนเข้าข่ายต้องพิจารณา"}, {"id": "S2.4-02-a", "t": "Expedited", "th": "Expedited", "w": "ตาราง p14: Expedited = เจาะเลือดน้อย, เก็บน้ำลาย, สัมภาษณ์ไม่กระทบจิตใจ"}], "answer": "S2.4-02-a", "ref": "Ch4 p14"}, {"id": "S2.4-03", "set": "S2", "ch": 4, "q": "Analyzing public historical documents with no link to personal data is classified as:", "q_th": "การวิเคราะห์เอกสารประวัติศาสตร์ที่เปิดเผยต่อสาธารณะโดยไม่เชื่อมโยงข้อมูลส่วนบุคคล จัดอยู่ในประเภทใด", "options": [{"id": "S2.4-03-a", "t": "Not Subject to Ethical Review", "th": "Not Subject to Ethical Review", "w": "สไลด์ p8: ข้อมูลสาธารณะ/เอกสารประวัติศาสตร์ที่ไม่เชื่อมข้อมูลส่วนบุคคล"}, {"id": "S2.4-03-d0", "t": "Full Board", "th": "Full Board", "w": "ไม่มีความเสี่ยงสูง"}, {"id": "S2.4-03-d1", "t": "Expedited", "th": "Expedited", "w": "ไม่ได้เก็บข้อมูลจากคน"}, {"id": "S2.4-03-d2", "t": "Waive Consent procedure", "th": "Waive Consent", "w": "เป็นการยกเว้นความยินยอม ไม่ใช่ประเภทโครงการ"}], "answer": "S2.4-03-a", "ref": "Ch4 p8"}, {"id": "S2.4-04", "set": "S2", "ch": 4, "q": "According to ICH GCP, a vulnerable person is someone who:", "q_th": "ตาม ICH GCP บุคคลเปราะบางคือผู้ที่", "options": [{"id": "S2.4-04-d0", "t": "Has more than 18 years of research experience", "th": "มีประสบการณ์วิจัยมากกว่า 18 ปี", "w": "ไม่เกี่ยวข้อง"}, {"id": "S2.4-04-a", "t": "Can be easily induced by hope or fear", "th": "ถูกชักจูงได้ง่ายด้วยความหวังหรือความกลัว", "w": "นิยาม ICH GCP ในสไลด์ p20"}, {"id": "S2.4-04-d1", "t": "Works as a member of the ethics committee", "th": "เป็นกรรมการจริยธรรม", "w": "ไม่ใช่นิยาม"}, {"id": "S2.4-04-d2", "t": "Has full capability and autonomy to decide", "th": "มีความสามารถและอิสระในการตัดสินใจเต็มที่", "w": "นั่นคือคนที่ไม่เปราะบาง"}], "answer": "S2.4-04-a", "ref": "Ch4 p20"}, {"id": "S2.4-05", "set": "S2", "ch": 4, "q": "Under 45 CFR 46, which subpart adds protections for prisoners?", "q_th": "ตาม 45 CFR 46 Subpart ใดให้ความคุ้มครองเพิ่มเติมแก่นักโทษ", "options": [{"id": "S2.4-05-d0", "t": "Subpart A", "th": "Subpart A", "w": "A คือกฎทั่วไป"}, {"id": "S2.4-05-d1", "t": "Subpart B", "th": "Subpart B", "w": "B คือหญิงตั้งครรภ์ ทารกในครรภ์ ทารกแรกเกิด"}, {"id": "S2.4-05-d2", "t": "Subpart D", "th": "Subpart D", "w": "D คือเด็ก"}, {"id": "S2.4-05-a", "t": "Subpart C", "th": "Subpart C", "w": "A ทั่วไป, B ตั้งครรภ์/ทารก, C นักโทษ, D เด็ก"}], "answer": "S2.4-05-a", "ref": "Ch4 p28"}, {"id": "S2.4-06", "set": "S2", "ch": 4, "q": "Conscripted soldiers asked to join a study under their unit's rules are an example of which vulnerability?", "q_th": "ทหารเกณฑ์ที่ถูกขอให้เข้าร่วมงานวิจัยภายใต้กฎของหน่วย เป็นตัวอย่างความเปราะบางแบบใด", "options": [{"id": "S2.4-06-d0", "t": "Economic Vulnerability type", "th": "Economic Vulnerability", "w": "เกี่ยวกับฐานะทางเศรษฐกิจ"}, {"id": "S2.4-06-d1", "t": "Medical Vulnerability", "th": "Medical Vulnerability", "w": "เกี่ยวกับการเจ็บป่วยรุนแรง"}, {"id": "S
