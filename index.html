2.4-06-a", "t": "Institutional Vulnerability", "th": "Institutional Vulnerability", "w": "อยู่ภายใต้กฎระเบียบหรืออำนาจของสถาบัน เช่น ทหารเกณฑ์ นักโทษ"}, {"id": "S2.4-06-d2", "t": "Social Vulnerability", "th": "Social Vulnerability", "w": "เกี่ยวกับการด้อยโอกาสทางสังคม เช่น ภัยพิบัติ แรงงานข้ามชาติ"}], "answer": "S2.4-06-a", "ref": "Ch4 p31"}, {"id": "S2.4-07", "set": "S2", "ch": 4, "q": "Storing participants' data as codes instead of their real names supports which practice under Respect for Persons?", "q_th": "การเก็บข้อมูลผู้เข้าร่วมเป็นรหัสแทนชื่อจริง สนับสนุนแนวปฏิบัติใดภายใต้ Respect for Persons", "options": [{"id": "S2.4-07-d0", "t": "Voluntary Participation", "th": "Voluntary Participation", "w": "คือการถอนตัวได้ทุกเมื่อ"}, {"id": "S2.4-07-d1", "t": "Distributive Justice", "th": "Distributive Justice", "w": "เป็นประเภทของ Justice"}, {"id": "S2.4-07-a", "t": "Privacy and Confidentiality", "th": "Privacy and Confidentiality", "w": "สไลด์: ใช้ coding แทนชื่อ-นามสกุลจริงเพื่อปกป้องตัวตน"}, {"id": "S2.4-07-d2", "t": "Interim Analysis", "th": "Interim Analysis", "w": "เป็นการวิเคราะห์ระหว่างโครงการใน GCP"}], "answer": "S2.4-07-a", "ref": "Ch4 p53"}, {"id": "S2.4-08", "set": "S2", "ch": 4, "q": "Distributive Justice is about:", "q_th": "Distributive Justice หมายถึง", "options": [{"id": "S2.4-08-a", "t": "Fairly sharing benefits, opportunities and burdens", "th": "การแบ่งปันประโยชน์ โอกาส และภาระอย่างเป็นธรรม", "w": "สไลด์ p64: ไม่ให้กลุ่มใดถูกเอาเปรียบหรือรับภาระมากเกินไป"}, {"id": "S2.4-08-d0", "t": "Using the same transparent rules for everyone", "th": "การใช้กฎโปร่งใสเดียวกันกับทุกคน", "w": "นั่นคือ Procedural Justice"}, {"id": "S2.4-08-d1", "t": "Compensating harm or punishing wrongdoing", "th": "การเยียวยาความเสียหายหรือลงโทษความผิด", "w": "นั่นคือ Retributive/Corrective Justice"}, {"id": "S2.4-08-d2", "t": "Maximizing benefits while minimizing risks", "th": "การเพิ่มประโยชน์สูงสุดและลดความเสี่ยงให้ต่ำที่สุด", "w": "นั่นคือ Beneficence"}], "answer": "S2.4-08-a", "ref": "Ch4 p64"}, {"id": "S2.4-09", "set": "S2", "ch": 4, "q": "Which is one of the data subject's rights under PDPA?", "q_th": "ข้อใดเป็นสิทธิของเจ้าของข้อมูลตาม PDPA", "options": [{"id": "S2.4-09-d0", "t": "Sell the company's customer database", "th": "ขายฐานข้อมูลลูกค้าของบริษัท", "w": "ไม่ใช่สิทธิของเจ้าของข้อมูล"}, {"id": "S2.4-09-d1", "t": "Access other customers' personal data", "th": "เข้าถึงข้อมูลส่วนบุคคลของลูกค้าคนอื่น", "w": "เป็นการละเมิด"}, {"id": "S2.4-09-d2", "t": "Decide the company's data processing purposes", "th": "กำหนดวัตถุประสงค์การประมวลผลข้อมูลของบริษัท", "w": "นั่นคือบทบาทของ Data Controller"}, {"id": "S2.4-09-a", "t": "Withdraw consent at any time", "th": "ถอนความยินยอมได้ตลอดเวลา", "w": "สิทธิ: เข้าถึง, ลบ/ทำลาย, คัดค้าน, ถอนความยินยอม"}], "answer": "S2.4-09-a", "ref": "Ch4 p88"}, {"id": "S2.4-10", "set": "S2", "ch": 4, "q": "What is the most important condition when using consent by action?", "q_th": "เงื่อนไขที่สำคัญที่สุดเมื่อใช้ consent by action คืออะไร", "options": [{"id": "S2.4-10-d0", "t": "The participant must sign a written form", "th": "ผู้เข้าร่วมต้องเซ็นเอกสารเป็นลายลักษณ์อักษร", "w": "consent by action ไม่มีเอกสารลงนาม"}, {"id": "S2.4-10-d1", "t": "The study must be reviewed by Full Board", "th": "ต้องผ่าน Full Board", "w": "ใช้กับงานความเสี่ยงต่ำมาก"}, {"id": "S2.4-10-a", "t": "No identifier is collected", "th": "ต้องไม่เก็บ identifier ที่ระบุตัวตน", "w": "สไลด์: ที่สำคัญคือต้องไม่มีการเก็บ identifier เพื่อระบุตัวตน"}, {"id": "S2.4-10-d2", "t": "Participants must be under 7 years old", "th": "ผู้เข้าร่วมต้องอายุต่ำกว่า 7 ปี", "w": "ไม่ใช่เงื่อนไข"}], "answer": "S2.4-10-a", "ref": "Ch4 p100"}, {"id": "S2.5-01", "set": "S2", "ch": 5, "q": "Heuristic #9 asks error messages to help users do three things. Which set is correct?", "q_th": "Heuristic ข้อ 9 ให้ข้อความ error ช่วยผู้ใช้ 3 อย่าง ข้อใดถูกต้อง", "options": [{"id": "S2.5-01-d0", "t": "Prevent, Hide, Retry", "th": "Prevent, Hide, Retry", "w": "การซ่อน error ขัดกับหลักนี้"}, {"id": "S2.5-01-d1", "t": "Select, Organize, Interpret", "th": "Select, Organize, Interpret", "w": "เป็นขั้นของ Perception"}, {"id": "S2.5-01-d2", "t": "Visceral, Behavioral, Reflective", "th": "Visceral, Behavioral, Reflective", "w": "เป็นระดับอารมณ์ของ Norman"}, {"id": "S2.5-01-a", "t": "Recognize, Diagnose, Recover", "th": "Recognize, Diagnose, Recover", "w": "สไลด์: Recognize (เห็นชัด), Diagnose (อธิบายสาเหตุ), Recover (บอกวิธีแก้)"}], "answer": "S2.5-01-a", "ref": "Ch5 p20"}, {"id": "S2.5-02", "set": "S2", "ch": 5, "q": "Letting experienced users customize menus and set shortcuts for frequent tasks follows which heuristic?", "q_th": "การให้ผู้ใช้ที่ชำนาญปรับแต่งเมนูและตั้งทางลัดสำหรับงานที่ทำบ่อย เป็นไปตาม heuristic ใด", "options": [{"id": "S2.5-02-d0", "t": "Recognition rather than recall", "th": "Recognition rather than recall", "w": "เป็นการแสดงตัวเลือกให้เห็นแทนการจำ"}, {"id": "S2.5-02-d1", "t": "User control and freedom", "th": "User control and freedom", "w": "เป็นเรื่อง undo/ยกเลิก/ออก"}, {"id": "S2.5-02-a", "t": "Flexibility and efficiency of use", "th": "Flexibility and efficiency of use", "w": "รองรับทั้งมือใหม่และมืออาชีพ มีทางลัด ปรับแต่งได้"}, {"id": "S2.5-02-d2", "t": "Help and documentation", "th": "Help and documentation", "w": "เป็นเรื่องคู่มือ/FAQ"}], "answer": "S2.5-02-a", "ref": "Ch5 p17"}, {"id": "S2.5-03", "set": "S2", "ch": 5, "q": "In \"Aesthetic and minimalist design\", the word \"minimalist\" means:", "q_th": "ใน \"Aesthetic and minimalist design\" คำว่า \"minimalist\" หมายถึง", "options": [{"id": "S2.5-03-d0", "t": "An empty screen that follows fashion trends", "th": "หน้าจอโล่ง ๆ ตามเทรนด์แฟชั่น", "w": "สไลด์ระบุว่าไม่ใช่แค่นี้"}, {"id": "S2.5-03-d1", "t": "Using only black and white colors", "th": "ใช้เฉพาะสีขาวดำ", "w": "ไม่ใช่ความหมาย"}, {"id": "S2.5-03-a", "t": "Simplicity that is most useful", "th": "ความเรียบง่ายที่มีประโยชน์สูงสุด", "w": "สไลด์: ไม่ใช่แค่โล่งตามเทรนด์ แต่คือเรียบง่ายที่มีประโยชน์สูงสุด"}, {"id": "S2.5-03-d2", "t": "Removing all help and error messages", "th": "ตัดข้อความช่วยเหลือและ error ทั้งหมด", "w": "ขัดกับ heuristic ข้อ 9 และ 10"}], "answer": "S2.5-03-a", "ref": "Ch5 p18"}, {"id": "S2.5-04", "set": "S2", "ch": 5, "q": "In the Usability Test Design Process, a hypothesis is:", "q_th": "ใน Usability Test Design Process สมมุติฐาน (hypothesis) คือ", "options": [{"id": "S2.5-04-d0", "t": "What we will do and want to achieve", "th": "สิ่งที่จะทำและต้องการให้สำเร็จ", "w": "นั่นคือ objective"}, {"id": "S2.5-04-d1", "t": "The list of participants", "th": "รายชื่อผู้เข้าร่วม", "w": "ไม่ใช่สมมุติฐาน"}, {"id": "S2.5-04-a", "t": "A predicted outcome of the test", "th": "การคาดเดาผลลัพธ์ของการทดสอบ", "w": "สไลด์ p24: สมมุติฐานคือการคาดเดาคำตอบ/ผลลัพธ์"}, {"id": "S2.5-04-d2", "t": "The final report of the results", "th": "รายงานผลสรุปสุดท้าย", "w": "สมมุติฐานตั้งก่อนทดสอบ"}], "answer": "S2.5-04-a", "ref": "Ch5 p24"}, {"id": "S2.5-05", "set": "S2", "ch": 5, "q": "Which statement about questionnaires matches the course?", "q_th": "ข้อความใดเกี่ยวกับแบบสอบถามตรงกับที่คอร์สสอน", "options": [{"id": "S2.5-05-a", "t": "Suits many people; gives primary data", "th": "เหมาะกับคนจำนวนมาก ได้ primary data", "w": "สไลด์ p50: เหมาะกับกลุ่มคนจำนวนมาก ข้อมูลปฐมภูมิถูกต้องเป็นปัจจุบัน"}, {"id": "S2.5-05-d0", "t": "Only works with 6–10 people at a time", "th": "ใช้ได้กับคนแค่ 6–10 คนต่อครั้ง", "w": "นั่นคือ focus group"}, {"id": "S2.5-05-d1", "t": "Never uses open-ended questions", "th": "ไม่เคยใช้คำถามปลายเปิด", "w": "มีทั้งปลายปิดและปลายเปิด"}, {"id": "S2.5-05-d2", "t": "Is the fastest way, with no interaction at all", "th": "เป็นวิธีเร็วที่สุดที่ไม่มีปฏิสัมพันธ์เลย", "w": "นั่นคือ observation"}], "answer": "S2.5-05-a", "ref": "Ch5 p50"}, {"id": "S2.5-06", "set": "S2", "ch": 5, "q": "Room temperature recorded during a test is which type of data?", "q_th": "อุณหภูมิห้องที่บันทึกระหว่างการทดสอบเป็นข้อมูลประเภทใด", "options": [{"id": "S2.5-06-d0", "t": "Quantitative – discrete", "th": "เชิงปริมาณ – discrete", "w": "Discrete คือการนับจำนวนเต็ม"}, {"id": "S2.5-06-a", "t": "Quantitative – continuous", "th": "เชิงปริมาณ – continuous", "w": "การวัดค่า เช่น น้ำหนัก อุณหภูมิ = Continuous"}, {"id": "S2.5-06-d1", "t": "Qualitative – ordinal", "th": "เชิงคุณภาพ – ordinal", "w": "Ordinal คือกลุ่มที่เรียงลำดับได้"}, {"id": "S2.5-06-d2", "t": "Qualitative – nominal", "th": "เชิงคุณภาพ – nominal", "w": "Nominal คือกลุ่มที่เรียงไม่ได้"}], "answer": "S2.5-06-a", "ref": "Ch5 p36"}, {"id": "S2.5-07", "set": "S2", "ch": 5, "q": "What is a limitation of interviews mentioned in the course?", "q_th": "ข้อจำกัดของการสัมภาษณ์ตามที่คอร์สกล่าวถึงคืออะไร", "options": [{"id": "S2.5-07-d0", "t": "It cannot read the respondent's feelings", "th": "อ่านความรู้สึกของผู้ตอบไม่ได้", "w": "สไลด์บอกว่าอ่านความรู้สึกได้ (เป็นข้อดี)"}, {"id": "S2.5-07-d1", "t": "It cannot go deep into a topic", "th": "เจาะลึกหัวข้อไม่ได้", "w": "สไลด์บอกว่าเจาะลึกได้ดี"}, {"id": "S2.5-07-d2", "t": "It requires at least 100 respondents", "th": "ต้องมีผู้ตอบอย่างน้อย 100 คน", "w": "ไม่ใช่ข้อกำหนด"}, {"id": "S2.5-07-a", "t": "Needs a skilled interviewer and much time", "th": "ต้องใช้ผู้สัมภาษณ์ที่มีทักษะสูงและใช้เวลานาน", "w": "สไลด์ p51 ระบุข้อจำกัดนี้"}], "answer": "S2.5-07-a", "ref": "Ch5 p51"}, {"id": "S2.5-08", "set": "S2", "ch": 5, "q": "Checking whether users can immediately remember where key steps are, without re-reading, measures memorability for which law?", "q_th": "การตรวจว่าผู้ใช้จำตำแหน่งขั้นตอนสำคัญได้ทันทีโดยไม่ต้องกลับไปอ่านซ้ำ เป็นการวัด memorability ตามกฎใด", "options": [{"id": "S2.5-08-d0", "t": "Fitts's Law", "th": "Fitts's Law", "w": "Fitts วัด task time และ error rate ของการกด"}, {"id": "S2.5-08-a", "t": "Miller's Law", "th": "Miller's Law", "w": "สไลด์ p45: Miller's Law วัด cognitive load และ memorability"}, {"id": "S2.5-08-d1", "t": "Parkinson's Law", "th": "Parkinson's Law", "w": "Parkinson วัดเวลาและความพยายาม"}, {"id": "S2.5-08-d2", "t": "Tesler's Law", "th": "Tesler's Law", "w": "Tesler เน้น make it simple"}], "answer": "S2.5-08-a", "ref": "Ch5 p45"}, {"id": "S2.5-09", "set": "S2", "ch": 5, "q": "What is the FIRST step of the course's mapping-the-flows process?", "q_th": "ขั้นตอน \"แรก\" ของกระบวนการ mapping the flows ในคอร์สคืออะไร", "options": [{"id": "S2.5-09-d0", "t": "List all external system downtimes", "th": "ลิสต์ช่วงปิดระบบภายนอกทั้งหมด", "w": "เป็นขั้นที่ 6"}, {"id": "S2.5-09-d1", "t": "Decide how users change their phone number", "th": "กำหนดวิธีให้ผู้ใช้เปลี่ยนเบอร์โทร", "w": "เป็นขั้นที่ 7"}, {"id": "S2.5-09-a", "t": "Complete all happy flows first", "th": "ทำ happy flow ให้ครบก่อน", "w": "สไลด์ p64 ข้อ 1"}, {"id": "S2.5-09-d2", "t": "Check backend failures", "th": "ตรวจกรณีระบบหลังบ้านล่ม", "w": "เป็นขั้นที่ 5"}], "answer": "S2.5-09-a", "ref": "Ch5 p64"}, {"id": "S2.5-10", "set": "S2", "ch": 5, "q": "An End-to-End Workflow is best described as:", "q_th": "End-to-End Workflow อธิบายได้ดีที่สุดว่า", "options": [{"id": "S2.5-10-a", "t": "A seamless flow from start to end", "th": "ขั้นตอนครบวงจรไร้รอยต่อตั้งแต่ต้นจนจบ", "w": "สไลด์ p67"}, {"id": "S2.5-10-d0", "t": "Only the error screens of a system", "th": "เฉพาะหน้าจอ error ของระบบ", "w": "นั่นเป็นแค่ส่วนหนึ่งของ unhappy path"}, {"id": "S2.5-10-d1", "t": "A single screen tested in isolation", "th": "หน้าจอเดียวที่ทดสอบแยกเดี่ยว", "w": "ขัดกับการมองภาพรวมทั้งระบบ"}, {"id": "S2.5-10-d2", "t": "A list of user personas", "th": "รายการ user persona", "w": "ไม่ใช่ workflow"}], "answer": "S2.5-10-a", "ref": "Ch5 p67"}, {"id": "S2.8-01", "set": "S2", "ch": 8, "q": "Why send a wireframe to end users?", "q_th": "ทำไมจึงส่ง wireframe ให้ end user ดู", "options": [{"id": "S2.8-01-d0", "t": "To approve the final brand colors", "th": "เพื่ออนุมัติสีแบรนด์สุดท้าย", "w": "wireframe ปกติไม่มีสี"}, {"id": "S2.8-01-d1", "t": "To test database performance", "th": "เพื่อทดสอบประสิทธิภาพฐานข้อมูล", "w": "wireframe ไม่เชื่อมฐานข้อมูล"}, {"id": "S2.8-01-d2", "t": "To collect payment details", "th": "เพื่อเก็บข้อมูลการชำระเงิน", "w": "ไม่เกี่ยวข้อง"}, {"id": "S2.8-01-a", "t": "To check if key info is placed well", "th": "เพื่อเช็คว่าข้อมูลสำคัญอยู่ตำแหน่งที่ดีไหม", "w": "สไลด์ p2: ส่ง layout ให้ดูว่าข้อมูลสำคัญอยู่ในตำแหน่งที่ลูกค้าคิดว่าดีหรือยัง"}], "answer": "S2.8-01-a", "ref": "Ch8 p2"}, {"id": "S2.8-02", "set": "S2", "ch": 8, "q": "Low-fidelity wireframes are most suitable for:", "q_th": "Low-fidelity wireframe เหมาะที่สุดสำหรับ", "options": [{"id": "S2.8-02-d0", "t": "Final client sign-off of visual design", "th": "การให้ลูกค้าอนุมัติงานภาพขั้นสุดท้าย", "w": "นั่นคือ high-fidelity"}, {"id": "S2.8-02-a", "t": "Brainstorming sessions to try ideas early", "th": "การประชุมระดมสมองเพื่อลองไอเดียช่วงแรก", "w": "สไลด์ p6: เหมาะกับ brainstorm ลองผิดลองถูกขั้นแรกสุด"}, {"id": "S2.8-02-d1", "t": "Developer handoff with exact specs", "th": "การส่งมอบให้ developer พร้อมสเปกละเอียด", "w": "นั่นคือ high-fidelity"}, {"id": "S2.8-02-d2", "t": "Testing backend integration", "th": "การทดสอบการเชื่อมต่อระบบหลังบ้าน", "w": "นั่นคือ vertical prototype"}], "answer": "S2.8-02-a", "ref": "Ch8 p6"}, {"id": "S2.8-03", "set": "S2", "ch": 8, "q": "Which describes content in a mid-fidelity wireframe?", "q_th": "ข้อใดอธิบายเนื้อหาใน mid-fidelity wireframe", "options": [{"id": "S2.8-03-a", "t": "Realistic-length real or dummy text", "th": "ข้อความจริงหรือจำลองที่ยาวสมจริง", "w": "สไลด์ p8: เนื้อหาเบื้องต้นใช้ข้อความจริง/จำลองที่ยาวสมจริง"}, {"id": "S2.8-03-d0", "t": "Only crossed boxes and scribbles", "th": "มีแค่กล่องกากบาทและเส้นขยุกขยิก", "w": "นั่นคือ low-fidelity"}, {"id": "S2.8-03-d1", "t": "Final photos and brand animations", "th": "รูปจริงและแอนิเมชันแบรนด์", "w": "นั่นคือ high-fidelity"}, {"id": "S2.8-03-d2", "t": "Live data from the database", "th": "ข้อมูลจริงจากฐานข้อมูล", "w": "wireframe ไม่ต่อฐานข้อมูล"}], "answer": "S2.8-03-a", "ref": "Ch8 p8"}, {"id": "S2.8-04", "set": "S2", "ch": 8, "q": "In the core elements of a wireframe, a Sidebar is used for:", "q_th": "ในองค์ประกอบหลักของ wireframe ส่วน Sidebar ใช้สำหรับ", "options": [{"id": "S2.8-04-d0", "t": "The logo and main search bar", "th": "โลโก้และช่องค้นหาหลัก", "w": "นั่นคือ Header/Navigation"}, {"id": "S2.8-04-d1", "t": "Privacy policy and social links", "th": "นโยบายความเป็นส่วนตัวและลิงก์โซเชียล", "w": "นั่นคือ Footer"}, {"id": "S2.8-04-d2", "t": "The main article content", "th": "เนื้อหาบทความหลัก", "w": "นั่นคือ Content Blocks"}, {"id": "S2.8-04-a", "t": "Filters or sub-menus", "th": "ตัวกรอง (filter) หรือเมนูย่อย", "w": "สไลด์ p17: Sidebar = เมนูด้านข้างสำหรับคัดกรองข้อมูลหรือเมนูย่อย"}], "answer": "S2.8-04-a", "ref": "Ch8 p17"}, {"id": "S2.8-05", "set": "S2", "ch": 8, "q": "In a wireframe, a rectangle with an X across it represents:", "q_th": "ใน wireframe สี่เหลี่ยมที่มีเครื่องหมายกากบาท (X) ตรงกลางแทนอะไร", "options": [{"id": "S2.8-05-d0", "t": "A close button", "th": "ปุ่มปิด", "w": "ไม่ใช่ความหมายใน wireframe"}, {"id": "S2.8-05-d1", "t": "A section that was deleted", "th": "ส่วนที่ถูกลบไปแล้ว", "w": "ไม่ใช่ความหมายใน wireframe"}, {"id": "S2.8-05-d2", "t": "An error message", "th": "ข้อความ error", "w": "ไม่ใช่ความหมายใน wireframe"}, {"id": "S2.8-05-a", "t": "An image or video placeholder", "th": "ตำแหน่งที่จะใส่รูปภาพหรือวิดีโอ (placeholder)", "w": "สไลด์ p17: Image/Video Placeholders"}], "answer": "S2.8-05-a", "ref": "Ch8 p17"}, {"id": "S2.8-06", "set": "S2", "ch": 8, "q": "What is the main difference between a prototype and a wireframe?", "q_th": "ความแตกต่างหลักระหว่าง prototype กับ wireframe คืออะไร", "options": [{"id": "S2.8-06-d0", "t": "A prototype never has any color", "th": "Prototype ไม่มีสีเลย", "w": "prototype อาจเป็น high-fidelity มีสีได้"}, {"id": "S2.8-06-a", "t": "A prototype is interactive and simulates real use", "th": "Prototype โต้ตอบได้และจำลองการใช้งานจริง", "w": "สไลด์ p21: prototype คลิกและมีปฏิสัมพันธ์ได้ เหนือกว่า wireframe"}, {"id": "S2.8-06-d1", "t": "A wireframe is always made after the prototype", "th": "Wireframe ทำหลัง prototype เสมอ", "w": "ลำดับคือ wireframe ก่อน"}, {"id": "S2.8-06-d2", "t": "A wireframe connects to the real backend", "th": "Wireframe เชื่อมต่อ backend จริง", "w": "wireframe ไม่ต่อ backend"}], "answer": "S2.8-06-a", "ref": "Ch8 p21"}, {"id": "S2.8-07", "set": "S2", "ch": 8, "q": "What is the main advantage of a vertical prototype?", "q_th": "ข้อดีหลักของ vertical prototype คืออะไร", "options": [{"id": "S2.8-07-d0", "t": "It shows users the whole system overview quickly", "th": "ให้ผู้ใช้เห็นภาพรวมทั้งระบบได้เร็ว", "w": "นั่นคือข้อดีของ horizontal"}, {"id": "S2.8-07-a", "t": "It reduces technical risk", "th": "ลดความเสี่ยงทางเทคนิค", "w": "สไลด์ p26"}, {"id": "S2.8-07-d1", "t": "It is the fastest type to build", "th": "สร้างได้เร็วที่สุด", "w": "vertical ใช้เวลานานกว่า"}, {"id": "S2.8-07-d2", "t": "It needs no developers at all", "th": "ไม่ต้องใช้ developer เลย", "w": "กลุ่มผู้ใช้หลักคือทีม developer"}], "answer": "S2.8-07-a", "ref": "Ch8 p26"}, {"id": "S2.8-08", "set": "S2", "ch": 8, "q": "What is the main limitation of a horizontal prototype?", "q_th": "ข้อจำกัดหลักของ horizontal prototype คืออะไร", "options": [{"id": "S2.8-08-d0", "t": "Users cannot see the overall system", "th": "ผู้ใช้มองไม่เห็นภาพรวมของระบบ", "w": "นั่นคือข้อจำกัดของ vertical"}, {"id": "S2.8-08-d1", "t": "It takes the longest time to build", "th": "ใช้เวลาสร้างนานที่สุด", "w": "horizontal สร้างง่ายและเร็ว"}, {"id": "S2.8-08-a", "t": "It cannot process real data", "th": "ประมวลผลข้อมูลจริงไม่ได้", "w": "สไลด์ p26: ข้อจำกัดคือไม่สามารถนำไปประมวลผลข้อมูลจริงได้"}, {"id": "S2.8-08-d2", "t": "It can only show one screen", "th": "แสดงได้แค่หน้าจอเดียว", "w": "horizontal เห็นทุกหน้าจอ"}], "answer": "S2.8-08-a", "ref": "Ch8 p26"}, {"id": "S2.8-09", "set": "S2", "ch": 8, "q": "In the course's visual hierarchy analysis, the question \"What will you choose?\" is linked to:", "q_th": "ในการวิเคราะห์ visual hierarchy ของคอร์ส คำถาม \"คุณจะเลือกอะไร?\" เชื่อมโยงกับ", "options": [{"id": "S2.8-09-d0", "t": "Miller's Law (memory)", ", "t": "Intrinsic load", "th": "Intrinsic load", "w": "สไลด์: Intrinsic = ความยากโดยธรรมชาติของเนื้อหา เช่น coding"}, {"id": "S3.2-06-d0", "t": "Extraneous load", "th": "Extraneous load", "w": "Extraneous มาจากการนำเสนอที่ไม่ดี"}, {"id": "S3.2-06-d1", "t": "Germane load", "th": "Germane load", "w": "Germane คือการเชื่อมความรู้ใหม่กับเดิม"}, {"id": "S3.2-06-d2", "t": "Cognitive overload", "th": "Cognitive overload", "w": "คือภาวะข้อมูลมากเกินไป ไม่ใช่ประเภทของ load"}], "answer": "S3.2-06-a", "ref": "Ch2 p41"}, {"id": "S3.2-07", "set": "S3", "ch": 2, "q": "A food-delivery app remembers your saved address so you do not have to type it every time. Which law does the course link to this?", "q_th": "แอปสั่งอาหารจำที่อยู่ที่บันทึกไว้ ผู้ใช้ไม่ต้องพิมพ์ใหม่ทุกครั้ง คอร์สเชื่อมตัวอย่างนี้กับกฎใด", "options": [{"id": "S3.2-07-d0", "t": "Hick's Law", "th": "Hick's Law", "w": "Hick เกี่ยวกับจำนวนตัวเลือก"}, {"id": "S3.2-07-d1", "t": "Miller's Law", "th": "Miller's Law", "w": "Miller เกี่ยวกับความจุความจำ"}, {"id": "S3.2-07-a", "t": "Tesler's Law", "th": "Tesler's Law", "w": "สไลด์ p68: Grab/Lineman จำที่อยู่ ระบบรับความซับซ้อนแทนผู้ใช้"}, {"id": "S3.2-07-d2", "t": "Fitts's Law", "th": "Fitts's Law", "w": "Fitts เกี่ยวกับขนาดและระยะ"}], "answer": "S3.2-07-a", "ref": "Ch2 p68"}, {"id": "S3.2-08", "set": "S3", "ch": 2, "q": "According to the Parkinson's Law graph in the course, what happens when far too much time is allocated to a task?", "q_th": "ตามกราฟ Parkinson's Law ในคอร์ส จะเกิดอะไรขึ้นเมื่อให้เวลากับงานมากเกินไป", "options": [{"id": "S3.2-08-d0", "t": "Effort keeps increasing steadily", "th": "ความพยายามเพิ่มขึ้นเรื่อย ๆ", "w": "กราฟลดลงทางขวา"}, {"id": "S3.2-08-a", "t": "Effort drops and people procrastinate", "th": "ความพยายามลดลงและผัดวันประกันพรุ่ง", "w": "สไลด์ p65: เวลามากเกินไป = ประสิทธิภาพลดลง"}, {"id": "S3.2-08-d1", "t": "Quality always improves", "th": "คุณภาพดีขึ้นเสมอ", "w": "ไม่ตรงกับสไลด์"}, {"id": "S3.2-08-d2", "t": "Users remember the task better", "th": "ผู้ใช้จำงานได้ดีขึ้น", "w": "เป็นการปนเรื่องความจำ"}], "answer": "S3.2-08-a", "ref": "Ch2 p65"}, {"id": "S3.2-09", "set": "S3", "ch": 2, "q": "Following the Serial Position Effect, where should the most frequently used options in a settings list be placed?", "q_th": "ตาม Serial Position Effect ควรวางตัวเลือกที่ใช้บ่อยที่สุดในรายการตั้งค่าไว้ที่ใด", "options": [{"id": "S3.2-09-d0", "t": "In the exact middle of the list", "th": "ตรงกลางรายการพอดี", "w": "ตรงกลางลืมง่ายที่สุด"}, {"id": "S3.2-09-a", "t": "At the top or bottom of the list", "th": "บนสุดหรือล่างสุดของรายการ", "w": "สไลด์ p77: วางตัวเลือกที่ใช้บ่อยไว้บนสุดหรือล่างสุด"}, {"id": "S3.2-09-d1", "t": "Hidden in a sub-menu", "th": "ซ่อนไว้ในเมนูย่อย", "w": "ทำให้หายากขึ้น"}, {"id": "S3.2-09-d2", "t": "In random positions each time", "th": "สุ่มตำแหน่งทุกครั้ง", "w": "ขัดกับ familiarity และหลักนี้"}], "answer": "S3.2-09-a", "ref": "Ch2 p77"}, {"id": "S3.2-10", "set": "S3", "ch": 2, "q": "What happens to the Von Restorff (isolation) effect if every element on a screen competes to stand out?", "q_th": "จะเกิดอะไรขึ้นกับ Von Restorff (isolation) effect ถ้าทุกองค์ประกอบบนหน้าจอแย่งกันโดดเด่น", "options": [{"id": "S3.2-10-d0", "t": "Every element becomes equally memorable", "th": "ทุกองค์ประกอบถูกจดจำได้เท่ากัน", "w": "ไม่มีอะไรแปลกแยกจึงไม่มีอะไรเด่น"}, {"id": "S3.2-10-a", "t": "The effect is lost and it gets confusing", "th": "เอฟเฟกต์หายไปและหน้าจอสับสน", "w": "สไลด์ p78: อย่าทำให้เด่นไปหมด เอฟเฟกต์จะไร้ผลและสร้างความสับสน"}, {"id": "S3.2-10-d1", "t": "Cognitive load decreases", "th": "Cognitive load ลดลง", "w": "กลับเพิ่มความสับสน"}, {"id": "S3.2-10-d2", "t": "It turns into the primacy effect", "th": "กลายเป็น primacy effect", "w": "คนละแนวคิด"}], "answer": "S3.2-10-a", "ref": "Ch2 p78"}, {"id": "S3.3-01", "set": "S3", "ch": 3, "q": "In a problem statement, \"Impact\" answers which question?", "q_th": "ใน problem statement องค์ประกอบ \"Impact\" ตอบคำถามใด", "options": [{"id": "S3.3-01-d0", "t": "What is happening now and what evidence proves it?", "th": "ตอนนี้เกิดอะไรขึ้น และมีหลักฐานอะไรยืนยัน", "w": "นั่นคือ Current State"}, {"id": "S3.3-01-d1", "t": "What outcome do we want?", "th": "เราต้องการผลลัพธ์อะไร", "w": "นั่นคือ Desired State"}, {"id": "S3.3-01-d2", "t": "Which button should be added?", "th": "ควรเพิ่มปุ่มอะไร", "w": "เป็น solution ซึ่งไม่ควรใส่"}, {"id": "S3.3-01-a", "t": "What harm results, and to whom, if unsolved?", "th": "ถ้าไม่แก้จะเกิดผลเสียอะไร และกับใคร", "w": "สไลด์ p3"}], "answer": "S3.3-01-a", "ref": "Ch3 p3"}, {"id": "S3.3-02", "set": "S3", "ch": 3, "q": "In 5W1H, the \"Where\" question asks:", "q_th": "ใน 5W1H คำถาม \"Where\" ถามเรื่องใด", "options": [{"id": "S3.3-02-d0", "t": "How often the problem happens", "th": "ปัญหาเกิดบ่อยแค่ไหน", "w": "นั่นคือ When"}, {"id": "S3.3-02-d1", "t": "Who faces the problem", "th": "ใครเผชิญปัญหา", "w": "นั่นคือ Who"}, {"id": "S3.3-02-d2", "t": "Why the problem is important", "th": "ทำไมปัญหานี้สำคัญ", "w": "นั่นคือ Why"}, {"id": "S3.3-02-a", "t": "Which step of the system it occurs in", "th": "ปัญหาเกิดที่ขั้นตอนไหนของระบบ", "w": "สไลด์ p5"}], "answer": "S3.3-02-a", "ref": "Ch3 p5"}, {"id": "S3.3-03", "set": "S3", "ch": 3, "q": "What are the outputs of the \"Analysis & Synthesis\" step in the persona process?", "q_th": "ผลลัพธ์ของขั้น \"Analysis & Synthesis\" ใน persona process คืออะไร", "options": [{"id": "S3.3-03-d0", "t": "Interviews, questionnaires and observation", "th": "Interviews, questionnaires และ observation", "w": "เป็นวิธีของ Data Gathering"}, {"id": "S3.3-03-d1", "t": "General details, personality and needs", "th": "General details, personality และ needs", "w": "เป็นส่วนของ Persona Creation"}, {"id": "S3.3-03-a", "t": "Pain points, goals and behaviors", "th": "Pain points, goals และ behaviors", "w": "สไลด์ p17"}, {"id": "S3.3-03-d2", "t": "Wireframes and prototypes", "th": "Wireframes และ prototypes", "w": "เป็นงานของ Ch8"}], "answer": "S3.3-03-a", "ref": "Ch3 p17"}, {"id": "S3.3-04", "set": "S3", "ch": 3, "q": "Which item is NOT part of the course's Empathy Map diagram?", "q_th": "ข้อใด \"ไม่ใช่\" ส่วนหนึ่งของแผนภาพ Empathy Map ในคอร์ส", "options": [{"id": "S3.3-04-a", "t": "Metrics", "th": "Metrics", "w": "Empathy Map: Think, Say, Does, Feel + Pain points, Needs, Goals"}, {"id": "S3.3-04-d0", "t": "Goals", "th": "Goals", "w": "อยู่ด้านล่างของแผนภาพ"}, {"id": "S3.3-04-d1", "t": "Needs", "th": "Needs", "w": "อยู่ด้านขวาของแผนภาพ"}, {"id": "S3.3-04-d2", "t": "Pain points", "th": "Pain points", "w": "อยู่ด้านซ้ายของแผนภาพ"}], "answer": "S3.3-04-a", "ref": "Ch3 p13"}, {"id": "S3.3-05", "set": "S3", "ch": 3, "q": "A user journey helps the team see the overall experience from whose point of view?", "q_th": "User journey ช่วยให้ทีมเห็นภาพรวมประสบการณ์จากมุมมองของใคร", "options": [{"id": "S3.3-05-d0", "t": "The developers'", "th": "Developer", "w": "ไม่ใช่มุมมองหลักของ journey"}, {"id": "S3.3-05-d1", "t": "The ethics committee's", "th": "คณะกรรมการจริยธรรม", "w": "ไม่เกี่ยวข้อง"}, {"id": "S3.3-05-d2", "t": "The competitors'", "th": "คู่แข่ง", "w": "ไม่ใช่วัตถุประสงค์"}, {"id": "S3.3-05-a", "t": "The real customer's", "th": "ลูกค้าจริง", "w": "สไลด์ p10: เห็นภาพรวมประสบการณ์ของผู้ใช้ในมุมมองของลูกค้าจริง ๆ"}], "answer": "S3.3-05-a", "ref": "Ch3 p10"}, {"id": "S3.3-06", "set": "S3", "ch": 3, "q": "\"Users can complete a purchase in just 3 clicks and the search works accurately\" targets which emotional level?", "q_th": "\"ผู้ใช้สั่งซื้อได้จบใน 3 คลิก และปุ่มค้นหาทำงานแม่นยำ\" มุ่งไปที่ระดับอารมณ์ใด", "options": [{"id": "S3.3-06-a", "t": "Behavioral", "th": "Behavioral", "w": "สไลด์ p29: Behavioral = ความรู้สึกเมื่อใช้งาน ใช้ง่าย รวดเร็ว"}, {"id": "S3.3-06-d0", "t": "Visceral", "th": "Visceral", "w": "Visceral = ความรู้สึกแรกเห็น"}, {"id": "S3.3-06-d1", "t": "Reflective", "th": "Reflective", "w": "Reflective = ความภูมิใจหลังใช้"}, {"id": "S3.3-06-d2", "t": "Awareness", "th": "Awareness", "w": "Awareness เป็นช่วงของ Action"}], "answer": "S3.3-06-a", "ref": "Ch3 p29"}, {"id": "S3.3-07", "set": "S3", "ch": 3, "q": "Outdated software that crashes often and slows down work is which type of pain point?", "q_th": "ซอฟต์แวร์ล้าสมัยที่ล่มบ่อยและทำให้งานช้า เป็น pain point ประเภทใด", "options": [{"id": "S3.3-07-d0", "t": "Design pain point", "th": "Design pain point", "w": "Design เกี่ยวกับหน้าตาและการจัดวาง"}, {"id": "S3.3-07-a", "t": "Productivity pain point", "th": "Productivity pain point", "w": "สไลด์ p30: ระบบซอฟต์แวร์ล้าสมัย ล่มบ่อย คอมอืด"}, {"id": "S3.3-07-d1", "t": "Support pain point", "th": "Support pain point", "w": "Support เกี่ยวกับความช่วยเหลือและข้อมูล"}, {"id": "S3.3-07-d2", "t": "Reflective pain point", "th": "Reflective pain point", "w": "ไม่มีหมวดนี้"}], "answer": "S3.3-07-a", "ref": "Ch3 p30"}, {"id": "S3.3-08", "set": "S3", "ch": 3, "q": "A checkout flow with too many pages is which type of pain point?", "q_th": "ขั้นตอน checkout ที่มีหลายหน้าเกินไปเป็น pain point ประเภทใด", "options": [{"id": "S3.3-08-d0", "t": "Productivity pain point", "th": "Productivity pain point", "w": "Productivity เน้นเสียเวลาจากการกรอกซ้ำ/ระบบช้า"}, {"id": "S3.3-08-a", "t": "Process pain point", "th": "Process pain point", "w": "สไลด์ p32: Checkout Flow มีหลายหน้าเกินไป"}, {"id": "S3.3-08-d1", "t": "Support pain point", "th": "Support pain point", "w": "Support เน้นความช่วยเหลือ"}, {"id": "S3.3-08-d2", "t": "Design pain point", "th": "Design pain point", "w": "Design เน้นหน้าตา"}], "answer": "S3.3-08-a", "ref": "Ch3 p32"}, {"id": "S3.3-09", "set": "S3", "ch": 3, "q": "In the Idea/Impact stage, \"Accessibility\" means:", "q_th": "ในขั้น Idea/Impact คำว่า \"Accessibility\" หมายถึง", "options": [{"id": "S3.3-09-d0", "t": "Adding small animations to buttons", "th": "ใส่แอนิเมชันเล็ก ๆ ให้ปุ่ม", "w": "นั่นคือ micro-interactions"}, {"id": "S3.3-09-d1", "t": "Removing repeated steps from the flow", "th": "ตัดขั้นตอนที่ซ้ำออกจาก flow", "w": "นั่นคือ frictionless flow"}, {"id": "S3.3-09-d2", "t": "Tailoring content to each user's interests", "th": "ปรับเนื้อหาตามความสนใจของแต่ละคน", "w": "นั่นคือ personalization"}, {"id": "S3.3-09-a", "t": "Making it easy for all groups to access", "th": "ทำให้คนทุกกลุ่มเข้าถึงได้ง่าย", "w": "สไลด์ p36"}], "answer": "S3.3-09-a", "ref": "Ch3 p36"}, {"id": "S3.3-10", "set": "S3", "ch": 3, "q": "Which of the following is NOT one of the tools the course lists for finding pain points?", "q_th": "ข้อใด \"ไม่ใช่\" เครื่องมือหา pain point ที่คอร์สระบุไว้", "options": [{"id": "S3.3-10-d0", "t": "Empathy Map", "th": "Empathy Map", "w": "อยู่ในรายการ"}, {"id": "S3.3-10-d1", "t": "Customer Journey", "th": "Customer Journey", "w": "อยู่ในรายการ"}, {"id": "S3.3-10-a", "t": "Chi-square test", "th": "Chi-square test", "w": "สไลด์ p34: Empathy Map, Customer Journey, Usability Test"}, {"id": "S3.3-10-d2", "t": "Usability Test", "th": "Usability Test", "w": "อยู่ในรายการ"}], "answer": "S3.3-10-a", "ref": "Ch3 p34"}, {"id": "S3.4-01", "set": "S3", "ch": 4, "q": "Which of the following is NOT a reason for research ethics given in the course?", "q_th": "ข้อใด \"ไม่ใช่\" เหตุผลของการมีจริยธรรมการวิจัยตามที่คอร์สให้ไว้", "options": [{"id": "S3.4-01-a", "t": "To make data collection faster", "th": "เพื่อให้เก็บข้อมูลได้เร็วขึ้น", "w": "WHY Ethics: คุ้มครองสิทธิ ความปลอดภัย มาตรฐานกฎหมาย ความน่าเชื่อถือ"}, {"id": "S3.4-01-d0", "t": "To protect participants' rights and safety", "th": "เพื่อคุ้มครองสิทธิและความปลอดภัยของผู้เข้าร่วม", "w": "เป็นเหตุผลในสไลด์"}, {"id": "S3.4-01-d1", "t": "To meet international and legal standards", "th": "เพื่อให้เป็นไปตามมาตรฐานสากลและกฎหมาย", "w": "เป็นเหตุผลในสไลด์"}, {"id": "S3.4-01-d2", "t": "To build credibility for the research", "th": "เพื่อสร้างความน่าเชื่อถือให้งานวิจัย", "w": "เป็นเหตุผลในสไลด์"}], "answer": "S3.4-01-a", "ref": "Ch4 p6"}, {"id": "S3.4-02", "set": "S3", "ch": 4, "q": "Who checks an Exemption request and issues the exemption?", "q_th": "ใครเป็นผู้ตรวจคำขอแบบ Exemption และออกใบยกเว้น", "options": [{"id": "S3.4-02-a", "t": "The committee chair or secretary", "th": "ประธานหรือเลขานุการคณะกรรมการ", "w": "ตาราง p14"}, {"id": "S3.4-02-d0", "t": "The researcher personally", "th": "ผู้วิจัยเอง", "w": "ผู้วิจัยยกเว้นตัวเองไม่ได้"}, {"id": "S3.4-02-d1", "t": "The full committee in a large meeting", "th": "คณะกรรมการทั้งหมดในที่ประชุมใหญ่", "w": "นั่นคือ Full Board"}, {"id": "S3.4-02-d2", "t": "2–3 members online", "th": "กรรมการ 2–3 ท่านแบบออนไลน์", "w": "นั่นคือ Expedited"}], "answer": "S3.4-02-a", "ref": "Ch4 p14"}, {"id": "S3.4-03", "set": "S3", "ch": 4, "q": "A study intentionally deceives participants about its real purpose. Can it request exemption?", "q_th": "งานวิจัยที่ตั้งใจปกปิดหรือหลอกผู้เข้าร่วมเรื่องวัตถุประสงค์จริง ขอ exemption ได้หรือไม่", "options": [{"id": "S3.4-03-d0", "t": "Yes, if the questionnaire is anonymous", "th": "ได้ ถ้าแบบสอบถามไม่ระบุตัวตน", "w": "การหลอกลวงทำให้ขอ exempt ไม่ได้"}, {"id": "S3.4-03-d1", "t": "Yes, if it lasts less than one hour", "th": "ได้ ถ้าใช้เวลาน้อยกว่า 1 ชั่วโมง", "w": "ระยะเวลาไม่ใช่เกณฑ์"}, {"id": "S3.4-03-d2", "t": "Yes, if participants are adults", "th": "ได้ ถ้าผู้เข้าร่วมเป็นผู้ใหญ่", "w": "ไม่ใช่เกณฑ์"}, {"id": "S3.4-03-a", "t": "No, deception rules out exemption", "th": "ไม่ได้ การหลอกลวงทำให้ขอ exempt ไม่ได้", "w": "สไลด์ p11"}], "answer": "S3.4-03-a", "ref": "Ch4 p11"}, {"id": "S3.4-04", "set": "S3", "ch": 4, "q": "According to the course, a non-vulnerable participant has which two qualities?", "q_th": "ตามที่คอร์สสอน ผู้เข้าร่วมที่ \"ไม่เปราะบาง\" มีคุณสมบัติ 2 อย่างใด", "options": [{"id": "S3.4-04-d0", "t": "Wealth and Fame", "th": "ความมั่งคั่งและชื่อเสียง", "w": "ไม่ใช่เกณฑ์"}, {"id": "S3.4-04-d1", "t": "Age over 60 and good health", "th": "อายุเกิน 60 และสุขภาพดี", "w": "ไม่ใช่เกณฑ์"}, {"id": "S3.4-04-d2", "t": "Beneficence and Justice", "th": "Beneficence และ Justice", "w": "เป็นหลัก Belmont"}, {"id": "S3.4-04-a", "t": "Capability and Autonomy", "th": "Capability และ Autonomy", "w": "สไลด์ p26: ความสามารถ (สติปัญญา วุฒิภาวะ การสื่อสาร) + อิสระในการตัดสินใจ"}], "answer": "S3.4-04-a", "ref": "Ch4 p26"}, {"id": "S3.4-05", "set": "S3", "ch": 4, "q": "When recruiting terminally ill patients, what is the main ethical concern for medical vulnerability?", "q_th": "เมื่อคัดเลือกผู้ป่วยระยะสุดท้าย ข้อกังวลทางจริยธรรมหลักของ medical vulnerability คืออะไร", "options": [{"id": "S3.4-05-a", "t": "False hope of being cured", "th": "ความหวังลม ๆ แล้ง ๆ ว่าจะหายจากโรค", "w": "สไลด์ p33"}, {"id": "S3.4-05-d0", "t": "They cannot read the consent form", "th": "อ่านใบยินยอมไม่ได้", "w": "ไม่ใช่ประเด็นหลักของ medical vulnerability"}, {"id": "S3.4-05-d1", "t": "They earn too much money", "th": "มีรายได้สูงเกินไป", "w": "ไม่เกี่ยวข้อง"}, {"id": "S3.4-05-d2", "t": "They are always under 18", "th": "อายุต่ำกว่า 18 ปีเสมอ", "w": "ไม่ถูกต้อง"}], "answer": "S3.4-05-a", "ref": "Ch4 p33"}, {"id": "S3.4-06", "set": "S3", "ch": 4, "q": "Under Beneficence, what is the common risk of survey research, and how should researchers reduce it?", "q_th": "ภายใต้หลัก Beneficence ความเสี่ยงทั่วไปของงานวิจัยแบบสำรวจคืออะไร และควรลดอย่างไร", "options": [{"id": "S3.4-06-a", "t": "Too many questions; keep only essentials", "th": "คำถามมากเกินไป; ใช้เฉพาะคำถามที่จำเป็น", "w": "สไลด์ p60"}, {"id": "S3.4-06-d0", "t": "Physical injury; provide medical insurance", "th": "บาดเจ็บทางร่างกาย ให้มีประกันสุขภาพ", "w": "ไม่ใช่ความเสี่ยงทั่วไปของแบบสำรวจ"}, {"id": "S3.4-06-d1", "t": "Low pay; offer a large cash reward", "th": "ค่าตอบแทนน้อย ให้เงินรางวัลก้อนใหญ่", "w": "ค่าตอบแทนสูงเป็นการจูงใจเกินควร"}, {"id": "S3.4-06-d2", "t": "Boredom; add more questions for variety", "th": "เบื่อ ให้เพิ่มคำถามให้หลากหลาย", "w": "ยิ่งเพิ่มความเสี่ยง"}], "answer": "S3.4-06-a", "ref": "Ch4 p60"}, {"id": "S3.4-07", "set": "S3", "ch": 4, "q": "What does the Declaration of Helsinki say about the number of participants?", "q_th": "Declaration of Helsinki กล่าวถึงจำนวนผู้เข้าร่วมวิจัยไว้อย่างไร", "options": [{"id": "S3.4-07-d0", "t": "As many as possible to be safe", "th": "มากที่สุดเท่าที่ทำได้เพื่อความปลอดภัย", "w": "มากเกินจำเป็นทำให้คนเสี่ยงโดยไม่จำเป็น"}, {"id": "S3.4-07-a", "t": "Neither more than needed nor too few", "th": "ไม่มากเกินจำเป็นและไม่น้อยเกินไป", "w": "หลักเกณฑ์ข้อ 6"}, {"id": "S3.4-07-d1", "t": "Always exactly 30 people", "th": "30 คนพอดีเสมอ", "w": "ไม่มีกำหนดตายตัว"}, {"id": "S3.4-07-d2", "t": "Fewer than 5 to reduce risk", "th": "น้อยกว่า 5 คนเพื่อลดความเสี่ยง", "w": "น้อยเกินจนวัดสถิติไม่ได้"}], "answer": "S3.4-07-a", "ref": "Ch4 p67"}, {"id": "S3.4-08", "set": "S3", "ch": 4, "q": "In GCP, DSMB stands for:", "q_th": "ใน GCP คำว่า DSMB ย่อมาจาก", "options": [{"id": "S3.4-08-d0", "t": "Design and Study Management Board", "th": "Design and Study Management Board", "w": "ไม่ใช่ชื่อในสไลด์"}, {"id": "S3.4-08-d1", "t": "Data Subject Membership Board", "th": "Data Subject Membership Board", "w": "ไม่ใช่ชื่อในสไลด์"}, {"id": "S3.4-08-a", "t": "Data and Safety Monitoring Board", "th": "Data and Safety Monitoring Board", "w": "คณะกรรมการดูแลด้านข้อมูลและความปลอดภัย"}, {"id": "S3.4-08-d2", "t": "Drug Sales Monitoring Bureau", "th": "Drug Sales Monitoring Bureau", "w": "ไม่ใช่ชื่อในสไลด์"}], "answer": "S3.4-08-a", "ref": "Ch4 p70"}, {"id": "S3.4-09", "set": "S3", "ch": 4, "q": "A company is sued in civil court under PDPA. Besides the actual damages, how much extra compensation can the court order at most?", "q_th": "บริษัทถูกฟ้องทางแพ่งตาม PDPA นอกจากค่าเสียหายจริงแล้ว ศาลสั่งให้จ่ายค่าเสียหายเพิ่มได้สูงสุดเท่าใด", "options": [{"id": "S3.4-09-d0", "t": "Up to 5 times the actual damages", "th": "เพิ่มได้ไม่เกิน 5 เท่าของค่าเสียหายจริง", "w": "ตัวเลข 5 คือโทษปรับทางปกครอง 5 ล้านบาท"}, {"id": "S3.4-09-d1", "t": "A flat fine of 1 million baht only", "th": "ปรับตายตัว 1 ล้านบาทเท่านั้น", "w": "1 ล้านบาทเป็นโทษปรับทางอาญา"}, {"id": "S3.4-09-a", "t": "Up to 2 times the actual damages", "th": "เพิ่มได้ไม่เกิน 2 เท่าของค่าเสียหายจริง", "w": "สไลด์ p88: ทางแพ่ง ชดใช้ค่าเสียหายจริงบวกเพิ่มสูงสุดไม่เกิน 2 เท่า"}, {"id": "S3.4-09-d2", "t": "Nothing beyond the actual damages", "th": "ไม่มีค่าเสียหายเพิ่มเกินกว่าความเสียหายจริง", "w": "PDPA ให้บวกเพิ่มได้ไม่เกิน 2 เท่า"}], "answer": "S3.4-09-a", "ref": "Ch4 p88"}, {"id": "S3.4-10", "set": "S3", "ch": 4, "q": "What consent documents does the course require for participants aged 13–17?", "q_th": "คอร์สกำหนดเอกสารยินยอมอย่างไรสำหรับผู้เข้าร่วมอายุ 13–17 ปี", "options": [{"id": "S3.4-10-d0", "t": "Only the parent signs; no child signature", "th": "ผู้ปกครองลงนามอย่างเดียว เด็กไม่ต้อง", "w": "นั่นคืออายุต่ำกว่า 7 ปี"}, {"id": "S3.4-10-d1", "t": "A child-language assent form only", "th": "เอกสาร assent ภาษาเด็กอย่างเดียว", "w": "7–12 ใช้ภาษาเด็ก และยังต้องมีผู้ปกครอง"}, {"id": "S3.4-10-d2", "t": "The teen signs alone like an adult", "th": "วัยรุ่นลงนามเองคนเดียวเหมือนผู้ใหญ่", "w": "ยังต้องมีผู้ปกครองลงนาม"}, {"id": "S3.4-10-a", "t": "Adult-language form: teen assent + parent signs", "th": "เอกสารภาษาผู้ใหญ่: วัยรุ่น assent + ผู้ปกครองลงนาม", "w": "สไลด์ p101"}], "answer": "S3.4-10-a", "ref": "Ch4 p101"}, {"id": "S3.5-01", "set": "S3", "ch": 5, "q": "Replacing technical jargon with everyday words that users understand follows which heuristic?", "q_th": "การเปลี่ยนศัพท์เทคนิคเป็นคำในชีวิตประจำวันที่ผู้ใช้เข้าใจ เป็นไปตาม heuristic ใด", "options": [{"id": "S3.5-01-d0", "t": "Consistency and standards", "th": "Consistency and standards", "w": "เน้นความเหมือนกันทั้งระบบ"}, {"id": "S3.5-01-d1", "t": "Error prevention", "th": "Error prevention", "w": "เน้นป้องกันข้อผิดพลาด"}, {"id": "S3.5-01-a", "t": "Match between system and the real world", "th": "Match between system and the real world", "w": "ใช้ภาษา คำศัพท์ สัญลักษณ์ที่ผู้ใช้คุ้นเคย ไม่ใช้ศัพท์เทคนิค"}, {"id": "S3.5-01-d2", "t": "Visibility of system status and feedback", "th": "Visibility of system status", "w": "เน้นบอกสถานะระบบ"}], "answer": "S3.5-01-a", "ref": "Ch5 p6"}, {"id": "S3.5-02", "set": "S3", "ch": 5, "q": "A green check mark appears right after data is saved successfully. Which heuristic is this?", "q_th": "เครื่องหมายถูกสีเขียวปรากฏทันทีหลังบันทึกข้อมูลสำเร็จ เป็น heuristic ใด", "options": [{"id": "S3.5-02-a", "t": "Visibility of system status", "th": "Visibility of system status", "w": "สไลด์ p4: เครื่องหมายสีเขียวยืนยันว่าการจัดเก็บสำเร็จ"}, {"id": "S3.5-02-d0", "t": "Help and documentation", "th": "Help and documentation", "w": "เป็นเรื่องคู่มือ"}, {"id": "S3.5-02-d1", "t": "User control and freedom", "th": "User control and freedom", "w": "เป็นเรื่อง undo/ยกเลิก"}, {"id": "S3.5-02-d2", "t": "Aesthetic and minimalist design", "th": "Aesthetic and minimalist design", "w": "เป็นเรื่องตัดสิ่งไม่จำเป็น"}], "answer": "S3.5-02-a", "ref": "Ch5 p4"}, {"id": "S3.5-03", "set": "S3", "ch": 5, "q": "Asking \"Are you sure you want to delete this?\" before deleting follows which heuristic?", "q_th": "การถามว่า \"คุณแน่ใจหรือไม่ที่จะลบข้อมูลนี้?\" ก่อนลบ เป็นไปตาม heuristic ใด", "options": [{"id": "S3.5-03-d0", "t": "Help users recognize, diagnose and recover from errors", "th": "Help users recognize, diagnose and recover from errors", "w": "ใช้หลังเกิด error แล้ว"}, {"id": "S3.5-03-d1", "t": "Recognition rather than recall", "th": "Recognition rather than recall", "w": "เป็นการแสดงตัวเลือกแทนการจำ"}, {"id": "S3.5-03-d2", "t": "Flexibility and efficiency of use", "th": "Flexibility and efficiency of use", "w": "เป็นเรื่องทางลัด"}, {"id": "S3.5-03-a", "t": "Error prevention", "th": "Error prevention", "w": "สไลด์ p12: ถามซ้ำก่อนลบเพื่อป้องกันความผิดพลาด"}], "answer": "S3.5-03-a", "ref": "Ch5 p12"}, {"id": "S3.5-04", "set": "S3", "ch": 5, "q": "In step 3 \"Clarify user and sample group\", what must the researcher be able to explain?", "q_th": "ในขั้นที่ 3 \"Clarify user and sample group\" ผู้วิจัยต้องอธิบายได้ว่าอะไร", "options": [{"id": "S3.5-04-d0", "t": "Which statistical test proves the hypothesis", "th": "สถิติใดพิสูจน์สมมุติฐาน", "w": "อยู่ในขั้นวิเคราะห์ผล"}, {"id": "S3.5-04-d1", "t": "The final UI colors", "th": "สี UI สุดท้าย", "w": "ไม่เกี่ยวข้อง"}, {"id": "S3.5-04-a", "t": "How and why participants were chosen", "th": "เลือกผู้เข้าร่วมอย่างไรและทำไม", "w": "สไลด์ p26"}, {"id": "S3.5-04-d2", "t": "The developers' coding language", "th": "ภาษาโปรแกรมของ developer", "w": "ไม่เกี่ยวข้อง"}], "answer": "S3.5-04-a", "ref": "Ch5 p26"}, {"id": "S3.5-05", "set": "S3", "ch": 5, "q": "The main purpose of experimental design in a usability test is to:", "q_th": "วัตถุประสงค์หลักของ experimental design ใน usability test คือ", "options": [{"id": "S3.5-05-d0", "t": "Collect as many opinions as possible", "th": "เก็บความคิดเห็นให้มากที่สุด", "w": "ไม่ใช่วัตถุประสงค์หลัก"}, {"id": "S3.5-05-d1", "t": "Replace the need for consent", "th": "ใช้แทนการขอความยินยอม", "w": "ยังต้องขอ consent"}, {"id": "S3.5-05-a", "t": "Find cause and effect between variables", "th": "หาความสัมพันธ์เชิงเหตุและผลระหว่างตัวแปร", "w": "สไลด์ p30"}, {"id": "S3.5-05-d2", "t": "Design the final visual style", "th": "ออกแบบสไตล์ภาพสุดท้าย", "w": "เป็นงานออกแบบ ไม่ใช่การทดลอง"}], "answer": "S3.5-05-a", "ref": "Ch5 p30"}, {"id": "S3.5-06", "set": "S3", "ch": 5, "q": "Before collecting data, participants try a mock-up first. What rule applies to this mock-up?", "q_th": "ก่อนเก็บข้อมูล ผู้เข้าร่วมได้ลองทำ mock-up ก่อน mock-up นี้มีกฎอะไร", "options": [{"id": "S3.5-06-d0", "t": "It must be identical to the real test", "th": "ต้องเหมือนการทดสอบจริงทุกประการ", "w": "จะเกิดการเรียนรู้"}, {"id": "S3.5-06-a", "t": "It must not reuse the real data details", "th": "ต้องไม่ใช้รายละเอียดเดียวกับข้อมูลจริง", "w": "สไลด์ p57"}, {"id": "S3.5-06-d1", "t": "It must be done after the real test", "th": "ต้องทำหลังการทดสอบจริง", "w": "ต้องทำก่อนเพื่อทำความเข้าใจ"}, {"id": "S3.5-06-d2", "t": "It must be skipped for adults", "th": "ผู้ใหญ่ไม่ต้องทำ", "w": "ไม่ใช่กฎในสไลด์"}], "answer": "S3.5-06-a", "ref": "Ch5 p57"}, {"id": "S3.5-07", "set": "S3", "ch": 5, "q": "A researcher wants to video-record a usability session. What does the course require?", "q_th": "ผู้วิจัยต้องการอัดวิดีโอระหว่างทดสอบ usability คอร์สกำหนดอะไร", "options": [{"id": "S3.5-07-d0", "t": "Record secretly to keep behavior natural", "th": "อัดแบบลับ ๆ ให้พฤติกรรมเป็นธรรมชาติ", "w": "ขัดกับจริยธรรม"}, {"id": "S3.5-07-a", "t": "Ask permission and record a consent clip", "th": "ขออนุญาตและอัดคลิปการยินยอม", "w": "สไลด์ p58: ถ้าไม่อนุญาต ห้ามบันทึก"}, {"id": "S3.5-07-d1", "t": "Record first and ask afterwards", "th": "อัดก่อนแล้วค่อยถามทีหลัง", "w": "ต้องขอก่อน"}, {"id": "S3.5-07-d2", "t": "Only blur faces; no permission needed", "th": "เบลอหน้าก็พอ ไม่ต้องขออนุญาต", "w": "ยังต้องขออนุญาต"}], "answer": "S3.5-07-a", "ref": "Ch5 p58"}, {"id": "S3.5-08", "set": "S3", "ch": 5, "q": "\"Province of residence\" is which type of data?", "q_th": "\"จังหวัดที่อาศัยอยู่\" เป็นข้อมูลประเภทใด", "options": [{"id": "S3.5-08-d0", "t": "Qualitative – ordinal", "th": "เชิงคุณภาพ – ordinal", "w": "จังหวัดเรียงลำดับไม่ได้"}, {"id": "S3.5-08-a", "t": "Qualitative – nominal", "th": "เชิงคุณภาพ – nominal", "w": "แบ่งกลุ่มได้แต่เรียงลำดับไม่ได้ เช่น เพศ สี จังหวัด"}, {"id": "S3.5-08-d1", "t": "Quantitative – discrete", "th": "เชิงปริมาณ – discrete", "w": "ไม่ใช่การนับ"}, {"id": "S3.5-08-d2", "t": "Quantitative – continuous", "th": "เชิงปริมาณ – continuous", "w": "ไม่ใช่การวัดค่า"}], "answer": "S3.5-08-a", "ref": "Ch5 p35"}, {"id": "S3.5-09", "set": "S3", "ch": 5, "q": "For a complex system with many requirements, when should user stories be written?", "q_th": "สำหรับระบบซับซ้อนที่มี requirement จำนวนมาก ควรเขียน user story เมื่อไร", "options": [{"id": "S3.5-09-a", "t": "Before mapping the happy and unhappy flows", "th": "ก่อนทำ mapping the flows (happy/unhappy)", "w": "สไลด์ p66"}, {"id": "S3.5-09-d0", "t": "After launching the product", "th": "หลังเปิดตัวผลิตภัณฑ์", "w": "สายเกินไป"}, {"id": "S3.5-09-d1", "t": "Only after usability testing is complete", "th": "หลังทำ usability test เสร็จเท่านั้น", "w": "ควรทำก่อน mapping flows"}, {"id": "S3.5-09-d2", "t": "Never; user stories are for marketing", "th": "ไม่ต้องเขียน เพราะเป็นงานการตลาด", "w": "ไม่ถูกต้อง"}], "answer": "S3.5-09-a", "ref": "Ch5 p66"}, {"id": "S3.5-10", "set": "S3", "ch": 5, "q": "Hiding extra options in a sub-menu and using a multi-step form are UI techniques for applying which law?", "q_th": "การซ่อนตัวเลือกเสริมไว้ในเมนูย่อยและใช้ฟอร์มแบบหลายขั้นตอน เป็นเทคนิค UI ของกฎใด", "options": [{"id": "S3.5-10-a", "t": "Hick's Law", "th": "Hick's Law", "w": "สไลด์ p40: Hick (UI testing) ลดตัวเลือก ซ่อนในเมนูย่อย stepped process"}, {"id": "S3.5-10-d0", "t": "Fitts's Law", "th": "Fitts's Law", "w": "Fitts เน้น size, location, distance"}, {"id": "S3.5-10-d1", "t": "Jakob's Law", "th": "Jakob's Law", "w": "Jakob เน้นความคุ้นเคย"}, {"id": "S3.5-10-d2", "t": "Parkinson's Law", "th": "Parkinson's Law", "w": "Parkinson เน้นจำกัดเวลาและขั้นตอน"}], "answer": "S3.5-10-a", "ref": "Ch5 p40"}, {"id": "S3.8-01", "set": "S3", "ch": 8, "q": "What is a main purpose of a high-fidelity wireframe?", "q_th": "วัตถุประสงค์หลักของ high-fidelity wireframe คืออะไร", "options": [{"id": "S3.8-01-d0", "t": "To brainstorm many rough ideas quickly", "th": "ระดมไอเดียคร่าว ๆ จำนวนมากอย่างรวดเร็ว", "w": "นั่นคือ low-fi"}, {"id": "S3.8-01-d1", "t": "To test backend database speed", "th": "ทดสอบความเร็วฐานข้อมูลหลังบ้าน", "w": "ไม่ใช่วัตถุประสงค์ของ wireframe"}, {"id": "S3.8-01-d2", "t": "To avoid any user feedback", "th": "หลีกเลี่ยง feedback จากผู้ใช้", "w": "high-fi ใช้เก็บ feedback ที่แม่นที่สุด"}, {"id": "S3.8-01-a", "t": "Realistic screens for coding or sign-off", "th": "หน้าจอเสมือนจริงเพื่อพัฒนาโค้ดหรือให้ลูกค้าอนุมัติ", "w": "สไลด์ p10"}], "answer": "S3.8-01-a", "ref": "Ch8 p10"}, {"id": "S3.8-02", "set": "S3", "ch": 8, "q": "Under the \"Cost\" factor for choosing a wireframe tool, which considerations are mentioned?", "q_th": "ภายใต้ปัจจัย \"Cost\" ในการเลือกเครื่องมือ wireframe มีสิ่งที่ต้องพิจารณาอะไรบ้าง", "options": [{"id": "S3.8-02-d0", "t": "Free tutorials and similarity to current tools", "th": "สื่อสอนฟรีและความคล้ายกับเครื่องมือเดิม", "w": "นั่นคือ Learnability"}, {"id": "S3.8-02-a", "t": "Budget, team size and type of project", "th": "งบประมาณ ขนาดทีม และประเภทโปรเจกต์", "w": "สไลด์ p15"}, {"id": "S3.8-02-d1", "t": "Collaboration and integrations", "th": "การทำงานร่วมกันและ integrations", "w": "นั่นคือ Tool Capabilities"}, {"id": "S3.8-02-d2", "t": "Paper versus digital needs", "th": "ความต้องการกระดาษหรือดิจิทัล", "w": "นั่นคือ Project Type & Goals"}], "answer": "S3.8-02-a", "ref": "Ch8 p15"}, {"id": "S3.8-03", "set": "S3", "ch": 8, "q": "What is the LAST step of \"Wireframe in 6 Steps\"?", "q_th": "ขั้นตอน \"สุดท้าย\" ของ \"Wireframe in 6 Steps\" คืออะไร", "options": [{"id": "S3.8-03-d0", "t": "Research and requirements gathering", "th": "Research and requirements", "w": "เป็นขั้นที่ 1"}, {"id": "S3.8-03-a", "t": "Documentation and developer handoff", "th": "Documentation and developer handoff", "w": "ขั้นที่ 6"}, {"id": "S3.8-03-d1", "t": "User flow mapping", "th": "User flow mapping", "w": "เป็นขั้นที่ 3"}, {"id": "S3.8-03-d2", "t": "Create digital wireframes", "th": "Create digital wireframes", "w": "เป็นขั้นที่ 5"}], "answer": "S3.8-03-a", "ref": "Ch8 p19"}, {"id": "S3.8-04", "set": "S3", "ch": 8, "q": "The course's wireframe process follows which sequence of stages?", "q_th": "กระบวนการทำ wireframe ในคอร์สเป็นไปตามลำดับขั้นใด", "options": [{"id": "S3.8-04-d0", "t": "Goals → Signals → Metrics", "th": "Goals → Signals → Metrics", "w": "นั่นคือ GSM ของ HEART"}, {"id": "S3.8-04-d1", "t": "Selection → Organization → Interpretation", "th": "Selection → Organization → Interpretation", "w": "นั่นคือ Perception"}, {"id": "S3.8-04-a", "t": "Empathize → Define → Ideate → Prototype → Test → Implement", "th": "Empathize → Define → Ideate → Prototype → Test → Implement", "w": "สไลด์ p18 ใช้ขั้นของ Design Thinking"}, {"id": "S3.8-04-d2", "t": "Persona → Process → Action → Emotion → Idea/Impact", "th": "Persona → Process → Action → Emotion → Idea/Impact", "w": "นั่นคือ User Journey Map"}], "answer": "S3.8-04-a", "ref": "Ch8 p18"}, {"id": "S3.8-05", "set": "S3", "ch": 8, "q": "How is a paper prototype \"run\" during a test?", "q_th": "ระหว่างการทดสอบ paper prototype ทำงานอย่างไร", "options": [{"id": "S3.8-05-a", "t": "Someone moves paper pieces by hand", "th": "มีคนขยับชิ้นกระดาษด้วยมือ", "w": "สไลด์ p23"}, {"id": "S3.8-05-d0", "t": "It is uploaded to Figma and clicked online", "th": "อัปโหลดเข้า Figma แล้วคลิกออนไลน์", "w": "นั่นคือ digital/interactive"}, {"id": "S3.8-05-d1", "t": "It connects to the backend automatically", "th": "เชื่อมต่อ backend อัตโนมัติ", "w": "ทำไม่ได้"}, {"id": "S3.8-05-d2", "t": "It records clicks with analytics software", "th": "บันทึกการคลิกด้วยซอฟต์แวร์ analytics", "w": "paper บันทึกอัตโนมัติไม่ได้"}], "answer": "S3.8-05-a", "ref": "Ch8 p23"}, {"id": "S3.8-06", "set": "S3", "ch": 8, "q": "An interactive prototype is usually at which fidelity level?", "q_th": "Interactive prototype มักอยู่ที่ระดับ fidelity ใด", "options": [{"id": "S3.8-06-a", "t": "Mid to high", "th": "กลางถึงสูง", "w": "สไลด์ p25: ต้องจำลองการทำงานได้ จึงมักเป็นระดับกลางถึงสูง"}, {"id": "S3.8-06-d0", "t": "Always low", "th": "ต่ำเสมอ", "w": "ไม่ตรงกับสไลด์"}, {"id": "S3.8-06-d1", "t": "Only paper level", "th": "ระดับกระดาษเท่านั้น", "w": "ไม่ตรงกับสไลด์"}, {"id": "S3.8-06-d2", "t": "Low to high, like any digital file", "th": "ต่ำถึงสูง เหมือนไฟล์ดิจิทัลทั่วไป", "w": "นั่นคือคำอธิบายของ digital prototype"}], "answer": "S3.8-06-a", "ref": "Ch8 p25"}, {"id": "S3.8-07", "set": "S3", "ch": 8, "q": "In Christian Bourgeois's 12 types of prototypes, a Minimum Viable Product (MVP) is classified as:", "q_th": "ใน 12 ประเภทของ prototype โดย Christian Bourgeois, Minimum Viable Product (MVP) จัดอยู่ในระดับใด", "options": [{"id": "S3.8-07-d0", "t": "Low-fidelity", "th": "Low-fidelity", "w": "Low คือ sketches และ paper"}, {"id": "S3.8-07-a", "t": "High-fidelity", "th": "High-fidelity", "w": "สไลด์ p27: Working model, Functional, MVP, Vertical = high-fidelity"}, {"id": "S3.8-07-d1", "t": "Mid-fidelity", "th": "Mid-fidelity", "w": "Mid เช่น wireframes, clickthrough"}, {"id": "S3.8-07-d2", "t": "Low-to-mid fidelity", "th": "Low-to-mid fidelity", "w": "คือ mockups"}], "answer": "S3.8-07-a", "ref": "Ch8 p27"}, {"id": "S3.8-08", "set": "S3", "ch": 8, "q": "In the course's Pruxus Design page analysis, which concept explains how much of the page users can recall afterwards?", "q_th": "ในการวิเคราะห์หน้า Pruxus Design ของคอร์ส แนวคิดใดอธิบายว่าผู้ใช้จำเนื้อหาบนหน้าได้มากน้อยแค่ไหนหลังดู", "options": [{"id": "S3.8-08-d0", "t": "Hick's Law (decision & choice)", "th": "Hick's Law (การตัดสินใจและการเลือก)", "w": "คู่กับคำถาม what will you choose"}, {"id": "S3.8-08-d1", "t": "Proximity (grouping)", "th": "Proximity (การจัดกลุ่ม)", "w": "คู่กับคำถาม do the objects relate"}, {"id": "S3.8-08-a", "t": "Miller's Law (memory)", "th": "Miller's Law (ความจำ)", "w": "สไลด์ p35"}, {"id": "S3.8-08-d2", "t": "Status quo bias", "th": "Status quo bias", "w": "เป็นอคติยึดติดสภาพเดิม"}], "answer": "S3.8-08-a", "ref": "Ch8 p35"}, {"id": "S3.8-09", "set": "S3", "ch": 8, "q": "Before wireframing, \"Content\" refers to:", "q_th": "ก่อนทำ wireframe คำว่า \"Content\" หมายถึง", "options": [{"id": "S3.8-09-d0", "t": "Who the users are and their pain points", "th": "ผู้ใช้คือใครและมี pain point อะไร", "w": "นั่นคือ User"}, {"id": "S3.8-09-d1", "t": "The situation and environment of use", "th": "สถานการณ์และสภาพแวดล้อมการใช้งาน", "w": "นั่นคือ Context"}, {"id": "S3.8-09-a", "t": "What info to show and its priority", "th": "ข้อมูลอะไรต้องแสดงและลำดับความสำคัญ", "w": "สไลด์ p51"}, {"id": "S3.8-09-d2", "t": "The tool's subscription price", "th": "ราคาสมาชิกของเครื่องมือ", "w": "ไม่เกี่ยวข้อง"}], "answer": "S3.8-09-a", "ref": "Ch8 p51"}, {"id": "S3.8-10", "set": "S3", "ch": 8, "q": "In the course's food-ordering app case study, who is the target audience?", "q_th": "ใน case study แอปสั่งอาหารของคอร์ส กลุ่มเป้าหมายคือใคร", "options": [{"id": "S3.8-10-d0", "t": "Restaurant owners managing stock", "th": "เจ้าของร้านอาหารที่จัดการสต็อก", "w": "ไม่ใช่กลุ่มเป้าหมายในสไลด์"}, {"id": "S3.8-10-d1", "t": "Tourists looking for hotels", "th": "นักท่องเที่ยวที่หาโรงแรม", "w": "ไม่เกี่ยวข้อง"}, {"id": "S3.8-10-a", "t": "Students, lecturers and staff at lunch", "th": "นักศึกษา อาจารย์ เจ้าหน้าที่ช่วงพักเที่ยง", "w": "สไลด์ p55"}, {"id": "S3.8-10-d2", "t": "Delivery riders planning routes", "th": "ไรเดอร์ที่วางแผนเส้นทาง", "w": "ไม่ใช่กลุ่มเป้าหมายในสไลด์"}], "answer": "S3.8-10-a", "ref": "Ch8 p55"}, {"id": "S3.9-01", "set": "S3", "ch": 9, "q": "Which metrics are used for the Happiness dimension of HEART?", "q_th": "metric ใดใช้วัดมิติ Happiness ของ HEART", "options": [{"id": "S3.9-01-d0", "t": "Churn rate and renewal rate", "th": "Churn rate และ renewal rate", "w": "เป็นของ Retention"}, {"id": "S3.9-01-d1", "t": "Task success rate and time on task", "th": "Task success rate และเวลาทำภารกิจ", "w": "เป็นของ Task Success"}, {"id": "S3.9-01-d2", "t": "Download and registration rate", "th": "Download rate และ registration rate", "w": "เป็นของ Adoption"}, {"id": "S3.9-01-a", "t": "Surveys, reviews, NPS and CSAT", "th": "แบบสอบถาม รีวิว NPS และ CSAT", "w": "สไลด์ p2–3"}], "answer": "S3.9-01-a", "ref": "Ch9 p2–3"}, {"id": "S3.9-02", "set": "S3", "ch": 9, "q": "Which is a reason the course gives for using statistics in UX/UI?", "q_th": "ข้อใดเป็นเหตุผลที่คอร์สให้ไว้ในการใช้สถิติในงาน UX/UI", "options": [{"id": "S3.9-02-d0", "t": "It removes the need to test with users", "th": "ทำให้ไม่ต้องทดสอบกับผู้ใช้", "w": "ยังต้องทดสอบเพื่อได้ข้อมูล"}, {"id": "S3.9-02-d1", "t": "It makes qualitative data unnecessary", "th": "ทำให้ไม่ต้องใช้ข้อมูลเชิงคุณภาพ", "w": "ไม่ใช่สิ่งที่สไลด์กล่าว"}, {"id": "S3.9-02-a", "t": "It reduces deciding by gut feeling", "th": "ลดการตัดสินใจด้วยความรู้สึก", "w": "สไลด์ p19"}, {"id": "S3.9-02-d2", "t": "It guarantees every design will succeed", "th": "รับประกันว่าทุกดีไซน์จะสำเร็จ", "w": "ไม่มีการรับประกัน"}], "answer": "S3.9-02-a", "ref": "Ch9 p19"}, {"id": "S3.9-03", "set": "S3", "ch": 9, "q": "Out of 200 respondents, 140 give 9–10, 40 give 7–8 and 20 give 0–6. What is the NPS?", "q_th": "จากผู้ตอบ 200 คน มี 140 คนให้ 9–10, 40 คนให้ 7–8 และ 20 คนให้ 0–6 ค่า NPS เท่ากับเท่าไร", "options": [{"id": "S3.9-03-d0", "t": "120", "th": "120", "w": "เอาจำนวนคนมาลบกันโดยไม่แปลงเป็นเปอร์เซ็นต์ (140 − 20)"}, {"id": "S3.9-03-d1", "t": "70", "th": "70", "w": "ลืมหัก Detractors"}, {"id": "S3.9-03-d2", "t": "50", "th": "50", "w": "นำ Passives มาหักผิดสูตร"}, {"id": "S3.9-03-a", "t": "60", "th": "60", "w": "Promoters 70% − Detractors 10% = 60 (ต้องแปลงเป็นเปอร์เซ็นต์ก่อน)"}], "answer": "S3.9-03-a", "ref": "Ch9 p10–11"}, {"id": "S3.9-04", "set": "S3", "ch": 9, "q": "170 out of 200 respondents give a score of 4 or 5 on a 1–5 scale. What is the CSAT score and rating?", "q_th": "ผู้ตอบ 170 จาก 200 คนให้คะแนน 4 หรือ 5 บนสเกล 1–5 คะแนน CSAT และระดับคือ", "options": [{"id": "S3.9-04-d0", "t": "85%, excellent", "th": "85% ระดับ excellent", "w": "Excellent ต้อง 90% ขึ้นไป"}, {"id": "S3.9-04-a", "t": "85%, very good", "th": "85% ระดับ very good", "w": "170 ÷ 200 × 100 = 85% อยู่ช่วง 80–89% (very good)"}, {"id": "S3.9-04-d1", "t": "17%, poor", "th": "17% ระดับ poor", "w": "คำนวณผิด"}, {"id": "S3.9-04-d2", "t": "90%, excellent", "th": "90% ระดับ excellent", "w": "คำนวณผิด"}], "answer": "S3.9-04-a", "ref": "Ch9 p8–9"}, {"id": "S3.9-05", "set": "S3", "ch": 9, "q": "A team only wants to know whether the new design is FASTER than the 60-second target. Which test direction does the course recommend?", "q_th": "ทีมต้องการรู้เพียงว่าดีไซน์ใหม่ \"เร็วกว่า\" เป้า 60 วินาทีหรือไม่ คอร์สแนะนำการทดสอบทิศทางใด", "options": [{"id": "S3.9-05-d0", "t": "Two-tailed test", "th": "Two-tailed test", "w": "two-tailed ดูแค่ว่าต่างหรือไม่ ไม่สนทิศทาง"}, {"id": "S3.9-05-d1", "t": "Chi-square test", "th": "Chi-square test", "w": "ไม่ใช่การเทียบค่าเฉลี่ยกับเกณฑ์"}, {"id": "S3.9-05-d2", "t": "Spearman correlation", "th": "Spearman correlation", "w": "เป็นการหาความสัมพันธ์"}, {"id": "S3.9-05-a", "t": "One-tailed test", "th": "One-tailed test", "w": "สไลด์ p23: one-tailed แนะนำสำหรับ UX เพราะต้องการให้เร็วกว่าเดิม"}], "answer": "S3.9-05-a", "ref": "Ch9 p23"}, {"id": "S3.9-06", "set": "S3", "ch": 9, "q": "Comparing task time between Gen X users and Gen Y users (different people) uses which test?", "q_th": "การเปรียบเทียบเวลาทำภารกิจระหว่างผู้ใช้ Gen X กับ Gen Y (คนละกลุ่ม) ใช้สถิติใด", "options": [{"id": "S3.9-06-d0", "t": "Paired t-test", "th": "Paired t-test", "w": "ใช้กับคนกลุ่มเดิม"}, {"id": "S3.9-06-d1", "t": "One-sample t-test vs target", "th": "One-sample t-test เทียบเกณฑ์", "w": "ใช้กับ 1 กลุ่มเทียบเกณฑ์"}, {"id": "S3.9-06-d2", "t": "Repeated measures", "th": "Repeated measures", "w": "ใช้กับคนกลุ่มเดิมหลายเงื่อนไข"}, {"id": "S3.9-06-a", "t": "Independent samples t-test", "th": "Independent samples t-test", "w": "2 กลุ่มที่เป็นอิสระต่อกัน ตัวอย่างในสไลด์ p26"}], "answer": "S3.9-06-a", "ref": "Ch9 p26"}, {"id": "S3.9-07", "set": "S3", "ch": 9, "q": "How many independent variables does a two-way ANOVA have?", "q_th": "Two-way ANOVA มีตัวแปรอิสระกี่ตัว", "options": [{"id": "S3.9-07-d0", "t": "1", "th": "1", "w": "นั่นคือ one-way"}, {"id": "S3.9-07-d1", "t": "3", "th": "3", "w": "ไม่ใช่"}, {"id": "S3.9-07-d2", "t": "0", "th": "0", "w": "ไม่ใช่"}, {"id": "S3.9-07-a", "t": "2", "th": "2", "w": "สไลด์ p38: Two-way = 2 ตัวแปรอิสระ และหา interaction effect"}], "answer": "S3.9-07-a", "ref": "Ch9 p38"}, {"id": "S3.9-08", "set": "S3", "ch": 9, "q": "Which statement about F-critical is correct?", "q_th": "ข้อใดเกี่ยวกับ F-critical ถูกต้อง", "options": [{"id": "S3.9-08-d0", "t": "It is calculated from users' raw data", "th": "คำนวณจากข้อมูลดิบของผู้ใช้", "w": "นั่นคือ F-value"}, {"id": "S3.9-08-d1", "t": "It changes with users' behavior", "th": "เปลี่ยนตามพฤติกรรมผู้ใช้", "w": "นั่นคือ F-value"}, {"id": "S3.9-08-d2", "t": "It equals the p-value", "th": "เท่ากับค่า p-value", "w": "คนละค่า"}, {"id": "S3.9-08-a", "t": "From the F-table; fixed for the same design", "th": "มาจากตาราง F; คงที่ถ้าแผนการทดลองเดิม", "w": "สไลด์ p36"}], "answer": "S3.9-08-a", "ref": "Ch9 p36"}, {"id": "S3.9-09", "set": "S3", "ch": 9, "q": "What is a disadvantage of repeated measures designs?", "q_th": "ข้อเสียของการออกแบบแบบ repeated measures คืออะไร", "options": [{"id": "S3.9-09-a", "t": "Fatigue or dropout from repeated tests", "th": "ความล้าหรือการลาออกจากการทดสอบซ้ำ", "w": "สไลด์ p47"}, {"id": "S3.9-09-d0", "t": "It needs many more participants", "th": "ต้องใช้ผู้เข้าร่วมมากขึ้นมาก", "w": "ข้อดีคือใช้คนน้อยลง"}, {"id": "S3.9-09-d1", "t": "It cannot control individual differences", "th": "ควบคุมความต่างระหว่างบุคคลไม่ได้", "w": "ข้อดีคือควบคุมได้ดี"}, {"id": "S3.9-09-d2", "t": "It only works with two conditions", "th": "ใช้ได้กับแค่ 2 เงื่อนไข", "w": "ใช้กับหลายเงื่อนไขได้"}], "answer": "S3.9-09-a", "ref": "Ch9 p47"}, {"id": "S3.9-10", "set": "S3", "ch": 9, "q": "400 users are split into two groups of 200 and 100 users click in total. If button color had no effect, how many clicks would be expected in each group?", "q_th": "ผู้ใช้ 400 คนแบ่ง 2 กลุ่ม กลุ่มละ 200 คน มีคนคลิกรวม 100 คน ถ้าสีปุ่มไม่มีผล คาดว่าจะมีคนคลิกกลุ่มละกี่คน", "options": [{"id": "S3.9-10-d0", "t": "100", "th": "100", "w": "เป็นยอดรวมทั้งสองกลุ่ม"}, {"id": "S3.9-10-d1", "t": "65", "th": "65", "w": "เป็นค่าที่เกิดจริงของปุ่มเขียว (observed)"}, {"id": "S3.9-10-a", "t": "50", "th": "50", "w": "Expected table (p56): ถ้าสีไม่มีผล การคลิกแบ่งเท่ากัน 50/50"}, {"id": "S3.9-10-d2", "t": "150", "th": "150", "w": "เป็นค่าคาดหวังของคนที่ไม่คลิกต่อกลุ่ม"}], "answer": "S3.9-10-a", "ref": "Ch9 p56"}]}}}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('quiz-data').textContent);
window.QUIZ_DATA = DATA;
const CH = DATA.chapters; // {"2":"Psychology in UX UI",...}
const CHS = Object.keys(CH);
const SETS = DATA.sets;   // {"E":{name,questions:[...]}, ...}
const SETN = {E:"Set 1 · Easy (ง่ายกว่าเนื้อหา)",S:"Set 2 · Standard (ตามเนื้อหา)",H:"Set 3 · Hard (ยากกว่าเนื้อหา)",S2:"Set 4 · Standard 2 (ปกติ)",S3:"Set 5 · Standard 3 (ปกติ)",M:"Mock รวม (สุ่มจากทุกชุด)"};
const ORDER=["E","S","H","S2","S3"];
// ---------- storage with fallback ----------
const Store=(()=>{let mem={};let ok=false;try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);ok=true}catch(e){ok=false}
 return{get(k,d){try{if(ok){const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}}catch(e){}return k in mem?mem[k]:d},
 set(k,v){mem[k]=v;try{if(ok)localStorage.setItem(k,JSON.stringify(v))}catch(e){}},persistent:()=>ok}})();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function gradeOf(p,A){const s=[[A,'A'],[A-5,'B+'],[A-10,'B'],[A-15,'C+'],[A-20,'C'],[A-25,'D+'],[A-30,'D']];for(const [t,g] of s)if(p>=t)return g;return 'F'}
function QT(q,lang){return lang==='th'?esc(q.q_th):lang==='both'?esc(q.q)+'<div class="tr">'+esc(q.q_th)+'</div>':esc(q.q)}
function OT(o,lang){return lang==='th'?esc(o.th):(lang==='both'&&o.th!==o.t)?esc(o.t)+'<div class="tr">'+esc(o.th)+'</div>':esc(o.t)}
const App={
 st:null,tick:null,
 settings(){return Object.assign({set:'S',scope:'all',ch:'2',mode:'practice',shuffle:true,mockN:60,limit:0,A:80,lang:'en'},Store.get('uxq_settings',{}))},
 home(){clearInterval(this.tick);document.getElementById('timer').classList.add('hidden');document.getElementById('homeBtn').classList.add('hidden');
  const s=this.settings();const avail=Object.keys(SETS);
  const hist=Store.get('uxq_hist',{});
  let h=`<div class="card"><h2>ตั้งค่าการสอบ</h2><div class="row"><div>
  <label>ชุดข้อสอบ <select id="sSet">${[...ORDER,'M'].filter(k=>k==='M'?avail.length>1:avail.includes(k)).map(k=>`<option value="${k}" ${s.set===k?'selected':''}>${SETN[k]}</option>`).join('')}</select></label>
  <label>ขอบเขต <select id="sScope"><option value="all" ${s.scope==='all'?'selected':''}>ทั้งชุด (6 บท)</option><option value="ch" ${s.scope==='ch'?'selected':''}>รายบท</option></select>
  <select id="sCh">${CHS.map(c=>`<option value="${c}" ${s.ch===c?'selected':''}>Ch${c} ${esc(CH[c])}</option>`).join('')}</select></label>
  <label>จำนวนข้อ (Mock รวม) <input id="sN" type="number" min="6" max="180" step="6" value="${s.mockN}"></label>
  </div><div>
  <label>โหมด <select id="sMode"><option value="practice" ${s.mode==='practice'?'selected':''}>ฝึก (เฉลยทันที)</option><option value="exam" ${s.mode==='exam'?'selected':''}>สอบ (เฉลยหลังส่ง)</option></select></label>
  <label>ภาษาข้อสอบ <select id="sLang"><option value="en" ${s.lang==='en'?'selected':''}>English (เหมือนข้อสอบจริง)</option><option value="th" ${s.lang==='th'?'selected':''}>ภาษาไทย (คงคำทับศัพท์)</option><option value="both" ${s.lang==='both'?'selected':''}>สองภาษา (EN + ไทย)</option></select></label>
  <label><input type="checkbox" id="sShuf" ${s.shuffle?'checked':''}> สลับลำดับตัวเลือก (และลำดับข้อ)</label>
  <label>จำกัดเวลา (นาที, 0 = ไม่จำกัด) <input id="sLim" type="number" min="0" max="300" value="${s.limit}"></label>
  <label>เกณฑ์เกรด A ≥ <input id="sA" type="number" min="50" max="100" value="${s.A}"> %</label>
  </div></div><button class="pri" id="startBtn" onclick="App.start()">▶ เริ่มทำข้อสอบ</button>
  <p class="small">ข้อมูลข้อสอบฝังในไฟล์นี้ ใช้งานออฟไลน์ได้ · สถิติ${Store.persistent()?'บันทึกใน localStorage':'เก็บในหน่วยความจำ (localStorage ใช้ไม่ได้)'} · ชุดที่มี: ${avail.map(k=>SETN[k].split(' (')[0]+' ('+SETS[k].questions.length+' ข้อ)').join(', ')}</p></div>`;
  h+=this.compareHTML(hist);
  document.getElementById('app').innerHTML=h;window.scrollTo(0,0);
 },
 compareHTML(hist){const keys=ORDER.filter(k=>SETS[k]);if(!keys.length)return'';
  let r=`<div class="card"><h2>📊 เปรียบเทียบผลทุกชุด (ทั้งชุด 60 ข้อ)</h2><table><tr><th>บท</th>${keys.map(k=>`<th>${SETN[k].split(' (')[0]}</th>`).join('')}</tr>`;
  for(const c of CHS){r+=`<tr><td>Ch${c}</td>${keys.map(k=>{const x=hist[k];return `<td>${x&&x.byCh[c]?x.byCh[c].c+'/'+x.byCh[c].n:'-'}</td>`}).join('')}</tr>`}
  r+=`<tr><th>รวม</th>${keys.map(k=>{const x=hist[k];return `<th>${x?x.c+'/'+x.n+' ('+x.p+'%) '+x.g:'ยังไม่ทำ'}</th>`}).join('')}</tr></table>`;
  const done=keys.filter(k=>hist[k]);r+=done.length===keys.length?`<p>✅ ทำครบทุกชุดแล้ว · เฉลี่ย ${Math.round(done.reduce((a,k)=>a+hist[k].p,0)/done.length)}%</p>`:`<p class="small">ทำครบทุกชุด (ทั้งชุด) แล้วตารางนี้จะสมบูรณ์</p>`;
  return r+`</div>`},
 start(){
  const g=id=>document.getElementById(id);
  const s={set:g('sSet').value,scope:g('sScope').value,ch:g('sCh').value,mode:g('sMode').value,shuffle:g('sShuf').checked,mockN:Math.max(6,Math.min(180,parseInt(g('sN').value)||60)),limit:Math.max(0,parseInt(g('sLim').value)||0),A:Math.max(50,Math.min(100,parseInt(g('sA').value)||80)),lang:g('sLang').value};
  Store.set('uxq_settings',s);
  let qs=[];
  if(s.set==='M'){const pool=[].concat(...Object.values(SETS).map(x=>x.questions));
   const chs=s.scope==='ch'?[s.ch]:CHS;const per=Math.max(1,Math.round(s.mockN/chs.length));
   for(const c of chs)qs.push(...shuffle(pool.filter(q=>String(q.ch)===c)).slice(0,per));}
  else{qs=SETS[s.set].questions.filter(q=>s.scope!=='ch'||String(q.ch)===s.ch)}
  if(s.shuffle)qs=shuffle(qs);
  this.st={s,qs:qs.map(q=>({q,opts:s.shuffle?shuffle(q.options):q.options.slice(),ans:null,star:false,shown:false})),i:0,t0:Date.now(),done:false,filter:null};
  document.getElementById('homeBtn').classList.remove('hidden');
  const tm=document.getElementById('timer');tm.classList.remove('hidden');clearInterval(this.tick);
  this.tick=setInterval(()=>{const st=this.st;if(!st||st.done)return;const e=Math.floor((Date.now()-st.t0)/1000);
   const L=st.s.limit*60;const v=L?Math.max(0,L-e):e;tm.textContent=(L?'⏳ ':'⏱ ')+String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');
   if(L&&e>=L){this.submit(true)}},500);
  this.render();
 },
 cur(){return this.st.qs[this.st.i]},
 render(){const st=this.st,it=this.cur(),q=it.q,n=st.qs.length;
  const answered=st.qs.filter(x=>x.ans).length;
  const reveal=st.done||(st.s.mode==='practice'&&it.shown);
  let h=`<div class="card" data-qid="${esc(q.id)}" id="qcard"><div class="bar"><i style="width:${Math.round(answered/n*100)}%"></i></div>
  <div class="meta"><span>ข้อ ${st.i+1}/${n} · ตอบแล้ว ${answered}</span><span><span class="tag">Ch${q.ch}</span><span class="tag">${esc(q.id)}</span></span></div>
  <div class="q">${QT(q,st.s.lang)}</div>`;
  it.opts.forEach((o,k)=>{let cls='opt';if(it.ans===o.id)cls+=' sel';if(reveal){if(o.id===q.answer)cls+=' ok';else if(it.ans===o.id)cls+=' bad'}
   h+=`<button class="${cls}" data-oid="${esc(o.id)}" ${reveal?'disabled':''} onclick="App.pick('${o.id}')"><span class="L">${'ABCD'[k]}.</span>${OT(o,st.s.lang)}${reveal?`<div class="why">${o.id===q.answer?'✅ ':'❌ '}${esc(o.w)}</div>`:''}</button>`});
  if(reveal)h+=`<div class="exp">${it.ans===q.answer?'<b style="color:var(--ok)">ถูกต้อง</b>':it.ans?'<b style="color:var(--bad)">ผิด</b>':'<b>ไม่ได้ตอบ</b>'} · เฉลย: <b>${OT(q.options.find(o=>o.id===q.answer),st.s.lang==='both'?'en':st.s.lang)}</b><br>📖 อ้างอิง: ${esc(q.ref)}</div>`;
  h+=`<div class="nav"><button onclick="App.go(-1)" ${st.i===0?'disabled':''}>◀ ย้อนกลับ</button><button onclick="App.lang()" title="สลับภาษา">🌐 ${{en:'EN',th:'ไทย',both:'EN+ไทย'}[st.s.lang]}</button><button class="star ${it.star?'on':''}" onclick="App.star()">${it.star?'★ ติดดาวแล้ว':'☆ ติดดาว'}</button><span class="sp"></span>
  ${st.i<n-1?`<button onclick="App.go(1)">${it.ans?'ถัดไป ▶':'ข้าม ▶'}</button>`:''}
  ${st.done?`<button class="pri" onclick="App.results()">📊 ผลสอบ</button>`:`<button class="pri" id="submitBtn" onclick="App.submit()">ส่งคำตอบ</button>`}</div>
  <div class="grid">${st.qs.map((x,k)=>{let c='';if(st.done||(st.s.mode==='practice'&&x.shown)){c=x.ans===x.q.answer?'c':'x'}else if(x.ans)c='a';return `<button class="${c} ${x.star?'s':''} ${k===st.i?'cur':''}" onclick="App.jump(${k})">${k+1}</button>`}).join('')}</div></div>`;
  document.getElementById('app').innerHTML=h;
 },
 pick(id){const it=this.cur();if(this.st.done||(this.st.s.mode==='practice'&&it.shown))return;it.ans=id;if(this.st.s.mode==='practice')it.shown=true;this.render()},
 go(d){const st=this.st;const list=st.filter;if(list){const p=list.indexOf(st.i);const np=p+d;if(np>=0&&np<list.length)st.i=list[np]}else{st.i=Math.max(0,Math.min(st.qs.length-1,st.i+d))}this.render();window.scrollTo(0,0)},
 jump(k){this.st.i=k;this.render()},
 lang(){const s=this.st.s;s.lang={en:'th',th:'both',both:'en'}[s.lang];const g=Object.assign(this.settings(),{lang:s.lang});Store.set('uxq_settings',g);this.render()},
 star(){const it=this.cur();it.star=!it.star;this.render()},
 submit(force){const st=this.st;if(st.done)return;const left=st.qs.filter(x=>!x.ans).length;
  if(!force&&left&&!window.__noConfirm&&!confirm(`ยังไม่ได้ตอบ ${left} ข้อ ต้องการส่งเลยหรือไม่?`))return;
  st.done=true;st.t1=Date.now();this.score();this.results()},
 score(){const st=this.st;const byCh={};let c=0;
  for(const x of st.qs){const k=String(x.q.ch);byCh[k]=byCh[k]||{c:0,n:0};byCh[k].n++;if(x.ans===x.q.answer){byCh[k].c++;c++}}
  const n=st.qs.length,p=n?Math.round(c/n*1000)/10:0;st.res={c,n,p,byCh,g:gradeOf(p,st.s.A),sec:Math.round((st.t1-st.t0)/1000)};
  if(st.s.set!=='M'&&st.s.scope==='all'){const h=Store.get('uxq_hist',{});h[st.s.set]={c,n,p,byCh,g:st.res.g,at:Date.now()};Store.set('uxq_hist',h)}
  const log=Store.get('uxq_log',[]);log.push({set:st.s.set,scope:st.s.scope,ch:st.s.ch,c,n,p,at:Date.now()});Store.set('uxq_log',log.slice(-100));},
 results(){const st=this.st,r=st.res;st.filter=null;
  const rows=CHS.filter(c=>r.byCh[c]);let weakest=null,wp=101;
  for(const c of rows){const x=r.byCh[c];const pp=x.c/x.n*100;if(pp<wp){wp=pp;weakest=c}}
  let h=`<div class="card" id="results"><h2>📊 ผลสอบ: ${SETN[st.s.set]}</h2>
  <div class="row"><div><div class="big" id="scoreTotal">${r.c}/${r.n}</div><div><b id="scorePct">${r.p}%</b> · เกรดโดยประมาณ <b id="grade">${r.g}</b> (A ≥ ${st.s.A}%)</div><div class="small">เวลา ${Math.floor(r.sec/60)} นาที ${r.sec%60} วินาที</div></div></div>
  <h3>คะแนนรายบท</h3><table id="chTable"><tr><th>บท</th><th>คะแนน</th><th></th><th>%</th></tr>`;
  for(const c of rows){const x=r.byCh[c];const pp=Math.round(x.c/x.n*100);const col=pp>=80?'#1b8a4b':pp>=60?'#e0a100':'#c62828';
   h+=`<tr class="${c===weakest&&rows.length>1?'weak':''}" data-ch="${c}"><td>Ch${c} ${esc(CH[c])}${c===weakest&&rows.length>1?' ⚠️ อ่อนที่สุด':''}</td><td class="chs">${x.c}/${x.n}</td><td><div class="cb"><i style="width:${pp}%;background:${col}"></i></div></td><td>${pp}%</td></tr>`}
  h+=`</table>`;
  if(weakest)h+=`<p>👉 บทที่ควรทบทวน: <b>Ch${weakest}</b> · <a href="Study-Guide.html#ch${weakest}" target="_blank">อ่านสรุป Study Guide</a> · <a href="Cheat-Sheet.html" target="_blank">Cheat-Sheet</a></p>`;
  const wrong=st.qs.map((x,k)=>x.ans!==x.q.answer?k:-1).filter(k=>k>=0),stars=st.qs.map((x,k)=>x.star?k:-1).filter(k=>k>=0);
  h+=`<div class="nav"><button onclick="App.review('all')">ทบทวนทุกข้อ</button><button onclick="App.review('wrong')" ${wrong.length?'':'disabled'}>❌ ทบทวนข้อผิด (${wrong.length})</button><button onclick="App.review('star')" ${stars.length?'':'disabled'}>★ ข้อติดดาว (${stars.length})</button><button onclick="App.retry('wrong')" ${wrong.length?'':'disabled'}>🔁 ทำใหม่เฉพาะข้อผิด</button><span class="sp"></span><button class="pri" onclick="App.home()">🏠 หน้าแรก</button></div></div>`;
  h+=this.compareHTML(Store.get('uxq_hist',{}));
  document.getElementById('app').innerHTML=h;window.scrollTo(0,0)},
 review(kind){const st=this.st;const list=st.qs.map((x,k)=>k).filter(k=>kind==='all'||(kind==='wrong'?st.qs[k].ans!==st.qs[k].q.answer:st.qs[k].star));if(!list.length)return;st.filter=list;st.i=list[0];this.render()},
 retry(kind){const st=this.st;const qs=st.qs.filter(x=>kind==='wrong'?x.ans!==x.q.answer:x.star).map(x=>x.q);if(!qs.length)return;
  const s=Object.assign({},st.s,{set:st.s.set});this.st={s:Object.assign(s,{scope:'retry'}),qs:(s.shuffle?shuffle(qs):qs).map(q=>({q,opts:s.shuffle?shuffle(q.options):q.options.slice(),ans:null,star:false,shown:false})),i:0,t0:Date.now(),done:false,filter:null};this.render()}
};
window.App=App;App.home();
</script></body></html>
